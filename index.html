    function CoachProApp() {
      const [user, setUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [authData, setAuthData] = useState({ name: '', email: '', password: '' });

      const [showProfileDrawer, setShowProfileDrawer] = useState(false);
      const [profileImage, setProfileImage] = useState(null);
      const [language, setLanguage] = useState('it');
      const [showBoardPdfModal, setShowBoardPdfModal] = useState(false);

      const t = (key) => {
        return translations[language][key] || translations['it'][key] || key;
      };

      const [activeTab, setActiveTab] = useState('board');
      const [tool, setTool] = useState('move');
      const [draggedId, setDraggedId] = useState(null);
      const [elements, setElements] = useState([]);
      const [arrows, setArrows] = useState([]);
      const [isDrawingArrow, setIsDrawingArrow] = useState(false);
      const [currentArrowStart, setCurrentArrowStart] = useState(null);
      const [showPaywallModal, setShowPaywallModal] = useState(false);

      const [editingPlayerId, setEditingPlayerId] = useState(null);
      const [tempPlayerName, setTempPlayerName] = useState('');

      const [clubCodeInput, setClubCodeInput] = useState('');
      const [clubCodeMsg, setClubCodeMsg] = useState('');

      const [drills, setDrills] = useState([]);
      const [players, setPlayers] = useState([]);
      const [newPlayerName, setNewPlayerName] = useState('');
      const [newPlayerNumber, setNewPlayerNumber] = useState('');
      const [newPlayerRole, setNewPlayerRole] = useState('Centrocampista');
      
      const [newDrillTitle, setNewDrillTitle] = useState('');
      const [newDrillCat, setNewDrillCat] = useState('Possesso Palla');
      const [newDrillDur, setNewDrillDur] = useState('15 min');
      const [newDrillDesc, setNewDrillDesc] = useState('');

      const svgRef = useRef(null);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setProfileImage(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const checkAccess = () => {
        return true;
      };

      const hasAccess = checkAccess();

      const handleAuth = (evt) => {
        evt.preventDefault();
        if (!authData.email) return;
        const displayName = authData.name.trim() ? authData.name.trim() : authData.email.split('@')[0];
        const trialEndTime = new Date().getTime() + (TRIAL_DAYS * 24 * 60 * 60 * 1000);

        setUser({
          name: displayName,
          email: authData.email,
          isPro: false,
          clubCode: null,
          trialEndsAt: authMode === 'register' ? trialEndTime : null
        });
      };

      const handleLogout = () => {
        setUser(null);
        setAuthData({ name: '', email: '', password: '' });
        setProfileImage(null);
      };

      const activateTrial = () => {
        const trialEndTime = new Date().getTime() + (TRIAL_DAYS * 24 * 60 * 60 * 1000);
        setUser({ ...user, trialEndsAt: trialEndTime });
        setShowPaywallModal(false);
      };

      const handleRedeemClubCode = (e) => {
        e.preventDefault();
        if (!clubCodeInput.trim()) return;
        
        const code = clubCodeInput.trim().toUpperCase();
        if (code.length >= 4) {
          setUser({
            ...user,
            isPro: true,
            clubCode: code
          });
          setClubCodeMsg('✅ ' + (language === 'it' ? 'Codice Società riscattato con successo!' : 'Club code redeemed successfully!'));
          setTimeout(() => {
            setShowPaywallModal(false);
            setClubCodeMsg('');
            setClubCodeInput('');
          }, 1500);
        } else {
          setClubCodeMsg('❌ ' + (language === 'it' ? 'Codice non valido.' : 'Invalid code.'));
        }
      };

      const handleShareClubInvite = () => {
        const codeToShare = user?.clubCode || "CP-CLUB-2026";
        const text = `⚽ *COACHPRO - LICENZA SOCIETÀ*\n\n🔑 *Codice:* ${codeToShare}\n\n1. Open CoachPro\n2. Subscription > Redeem Club Code`;
        const encodedText = encodeURIComponent(text);
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
          window.location.href = `whatsapp://send?text=${encodedText}`;
        } else {
          window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
        }
      };

      const addPlayer = (e) => {
        e.preventDefault();
        if (!newPlayerName.trim()) return;
        
        const squadPlayer = {
          id: Date.now().toString(),
          name: newPlayerName.trim(),
          number: newPlayerNumber || '1',
          role: newPlayerRole || 'Centrocampista',
          status: 'presente'
        };

        setPlayers([...players, squadPlayer]);
        setNewPlayerName('');
        setNewPlayerNumber('');
      };

      const togglePlayerStatus = (id) => {
        setPlayers(players.map(p => {
          if (p.id === id) {
            const nextStatus = p.status === 'presente' ? 'assente' : p.status === 'assente' ? 'infortunato' : 'presente';
            return { ...p, status: nextStatus };
          }
          return p;
        }));
      };

      const removePlayer = (id) => {
        setPlayers(players.filter(p => p.id !== id));
      };

      const addDrill = (e) => {
        e.preventDefault();
        if (!newDrillTitle.trim()) return;
        setDrills([...drills, { id: Date.now().toString(), title: newDrillTitle.trim(), category: newDrillCat, duration: newDrillDur, description: newDrillDesc }]);
        setNewDrillTitle('');
        setNewDrillDesc('');
      };

      const removeDrill = (id) => {
        setDrills(drills.filter(d => d.id !== id));
      };

      const handleExportBoardPDF = () => {
        if (!hasAccess) {
          setShowPaywallModal(true);
          return;
        }
        setShowBoardPdfModal(true);
      };

      const presetFormation = (type) => {
        if (!hasAccess) {
          setShowPaywallModal(true);
          return;
        }
        let formationElements = [];
        formationElements.push({ id: 'p1', type: 'player', color: 'red', number: '1', name: 'Portiere', x: 50, y: 90 });

        if (type === '433') {
          formationElements.push(
            { id: 'p2', type: 'player', color: 'red', number: '2', name: 'Ter. Dx', x: 20, y: 70 },
            { id: 'p3', type: 'player', color: 'red', number: '5', name: 'Dif. Cen', x: 40, y: 75 },
            { id: 'p4', type: 'player', color: 'red', number: '6', name: 'Dif. Cen', x: 60, y: 75 },

        } else if (type === '4321') {
          formationElements.push(
            { id: 'p2', type: 'player', color: 'red', number: '2', name: 'Ter. Dx', x: 20, y: 70 },
            { id: 'p3', type: 'player', color: 'red', number: '5', name: 'Dif. Cen', x: 40, y: 75 },

          );
        }
        setElements(formationElements);
      };

      const getCoords = (evt) => {
        if (!svgRef.current) return { x: 50, y: 50 };
        const rect = svgRef.current.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        const x = Math.max(5, Math.min(95, ((clientX - rect.left) / rect.width) * 100));
        const y = Math.max(5, Math.min(95, ((clientY - rect.top) / rect.height) * 100));
        return { x, y };
      };

      const handleBoardClick = (evt) => {
        if (!hasAccess) {
          setShowPaywallModal(true);
          return;
        }
        if (draggedId) {
          setDraggedId(null);
          return;
        }
        const { x, y } = getCoords(evt);

        if (tool === 'red') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'red', number: (elements.filter(e => e.color === 'red').length + 1).toString(), name: 'Giocatore', x, y }]);
        } else if (tool === 'blue') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'blue', number: (elements.filter(e => e.color === 'blue').length + 1).toString(), name: 'Giocatore', x, y }]);
        } else if (tool === 'ball') {
          setElements([...elements, { id: Date.now().toString(), type: 'ball', x, y }]);
        } else if (tool === 'cone') {
          setElements([...elements, { id: Date.now().toString(), type: 'cone', x, y }]);
        } else if (tool === 'cinesina') {
          setElements([...elements, { id: Date.now().toString(), type: 'cinesina', x, y }]);
        } else if (tool === 'ladder') {
          setElements([...elements, { id: Date.now().toString(), type: 'ladder', x, y }]);
        } else if (tool === 'arrow') {
          if (!isDrawingArrow) {
            setIsDrawingArrow(true);
            setCurrentArrowStart({ x, y });
          } else {
            setArrows([...arrows, { id: Date.now().toString(), startX: currentArrowStart.x, startY: currentArrowStart.y, endX: x, endY: y }]);
            setIsDrawingArrow(false);
            setCurrentArrowStart(null);
          }
        }
      };

      const handleTouchMove = (evt) => {
        if (!hasAccess) return;
        if (!draggedId || tool !== 'move') return;
        const { x, y } = getCoords(evt);
        setElements(elements.map(el => el.id === draggedId ? { ...el, x, y } : el));
      };

      if (!user) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center p-4">
            <div className="max-w-md w-full glass-panel p-8 rounded-3xl shadow-2xl">
              <div className="text-center mb-8">
                <div className="w-16 h-16 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-2xl mx-auto flex items-center justify-center font-black text-2xl text-black mb-3 shadow-lg shadow-emerald-500/25">CP</div>
                <h1 className="text-2xl font-black text-white tracking-tight">{t('appTitle')}</h1>
                <p className="text-xs text-gray-400 mt-1">{t('subtitle')}</p>
              </div>

              <form onSubmit={handleAuth} className="space-y-4">
                {authMode === 'register' && (
                  <div>
                    <label className="block text-xs font-bold text-gray-300 mb-1">Nome Mister / Società</label>
                    <input 
                      type="text" 
                      placeholder={t('namePlaceholder')} 
                      value={authData.name} 
                      onChange={(e) => setAuthData({ ...authData, name: e.target.value })} 
                      className="w-full bg-gray-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white"
                    />
                  </div>
                )}
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1">{t('emailLabel')}</label>
                  <input 
                    type="email" 
                    required 
                    placeholder="mister@email.com" 
                    value={authData.email} 
                    onChange={(e) => setAuthData({ ...authData, email: e.target.value })} 
                    className="w-full bg-gray-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1">{t('passwordLabel')}</label>
                  <input 
                    type="password" 
                    required 
                    placeholder="••••••••" 
                    value={authData.password} 
                    onChange={(e) => setAuthData({ ...authData, password: e.target.value })} 
                    className="w-full bg-gray-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white"
                  />
                </div>
                <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-3.5 rounded-xl text-sm shadow-lg shadow-emerald-500/25 transition-all">
                  {authMode === 'login' ? t('loginButton') : t('registerButton')}
                </button>
              </form>

              <div className="mt-6 text-center">
                <button 
                  onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}
                  className="text-xs text-emerald-400 hover:underline font-semibold"
                >
                  {authMode === 'login' ? t('noAccount') : t('hasAccount')}
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-950 text-white flex flex-col">
          <header className="glass-panel border-b border-white/5 px-5 py-3.5 flex items-center justify-between sticky top-0 z-40">
            <div className="flex items-center space-x-3.5">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center font-black text-black shadow-lg shadow-emerald-500/25 tracking-wider">CP</div>
              <div>
                <h1 className="font-bold text-sm tracking-wide text-white">{user.name}</h1>
                <div className="flex items-center space-x-1.5 mt-0.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <p className="text-[10px] text-emerald-400 font-semibold tracking-wide uppercase">{t('proActive')}</p>
                </div>
              </div>
            </div>
            <div className="flex items-center space-x-2.5">
              <button onClick={() => setShowProfileDrawer(true)} className="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 text-xs font-bold border border-white/5">⚙️</button>
              <button onClick={handleLogout} className="px-3 py-2 rounded-xl bg-rose-500/10 border border-rose-500/20 hover:bg-rose-500/20 text-rose-400 text-xs font-semibold">{t('exitButton')}</button>
            </div>
          </header>

          <nav className="glass-panel border-b border-white/5 flex justify-around p-2.5 max-w-5xl w-full mx-auto my-3 rounded-2xl">
            <button onClick={() => setActiveTab('board')} className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-2 ${activeTab === 'board' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/25 font-extrabold' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
              <span>📋</span><span>{t('navBoard')}</span>
            </button>
            <button onClick={() => setActiveTab('drills')} className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-2 ${activeTab === 'drills' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/25 font-extrabold' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
              <span>⚽</span><span>{t('navDrills')}</span>
            </button>
            <button onClick={() => setActiveTab('squad')} className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-2 ${activeTab === 'squad' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/25 font-extrabold' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
              <span>👥</span><span>{t('navSquad')}</span>
            </button>
          </nav>

          <main className="flex-1 max-w-6xl w-full mx-auto p-4">

                    <button onClick={() => presetFormation('442')} className="px-3 py-1.5 bg-white/5 hover:bg-white/10 text-xs font-bold rounded-xl border border-white/5 transition-all">4-4-2</button>
                    <button onClick={() => presetFormation('352')} className="px-3 py-1.5 bg-white/5 hover:bg-white/10 text-xs font-bold rounded-xl border border-white/5 transition-all">3-5-2</button>
                    <button onClick={() => presetFormation('4321')} className="px-3 py-1.5 bg-white/5 hover:bg-white/10 text-xs font-bold rounded-xl border border-white/5 transition-all">4-3-2-1</button>
                  </div>
                  <button onClick={handleExportBoardPDF} className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-black text-xs font-extrabold rounded-xl shadow-lg shadow-emerald-500/20 transition-all">{t('exportPdf')}</button>
                </div>

                <div className="flex flex-wrap gap-2 glass-panel p-3 rounded-2xl">
                  <button onClick={() => setTool('move')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 ${tool === 'move' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>✋</span><span>{t('toolMove')}</span></button>
                  <button onClick={() => setTool('red')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 ${tool === 'red' ? 'bg-rose-600 text-white shadow-lg shadow-rose-600/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>🔴</span><span>{t('toolRed')}</span></button>
                  <button onClick={() => setTool('blue')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 ${tool === 'blue' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>🔵</span><span>{t('toolBlue')}</span></button>
                  <button onClick={() => setTool('ball')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 ${tool === 'ball' ? 'bg-white text-black shadow-lg shadow-white/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>⚽</span><span>{t('toolBall')}</span></button>
                  <button onClick={() => setTool('cone')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 ${tool === 'cone' ? 'bg-orange-600 text-white shadow-lg shadow-orange-600/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>🔺</span><span>{t('toolCone')}</span></button>
                  <button onClick={() => setTool('cinesina')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 ${tool === 'cinesina' ? 'bg-amber-500 text-black shadow-lg shadow-amber-500/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>⏺</span><span>{t('toolCinesina')}</span></button>
                  <button onClick={() => setTool('ladder')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 ${tool === 'ladder' ? 'bg-yellow-500 text-black shadow-lg shadow-yellow-500/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>🪜</span><span>{t('toolLadder')}</span></button>
                  <button onClick={() => setTool('arrow')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 ${tool === 'arrow' ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>↗️</span><span>{t('toolArrow')}</span></button>
                  <button onClick={() => setTool('delete')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 ${tool === 'delete' ? 'bg-rose-500 text-black shadow-lg shadow-rose-500/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>🧹</span><span>{t('toolDelete')}</span></button>
                  <button onClick={() => { setElements([]); setArrows([]); }} className="px-3.5 py-2 rounded-xl text-xs font-bold bg-white/5 text-gray-400 hover:text-white hover:bg-white/10">🗑️ {t('toolClear')}</button>
                </div>

                <div 
                  ref={svgRef}
                  onClick={handleBoardClick}
                  onMouseMove={handleTouchMove}
                  onTouchMove={handleTouchMove}
                  className="relative w-full aspect-[4/3] max-w-4xl mx-auto pitch-bg rounded-3xl overflow-hidden border border-white/10 shadow-2xl cursor-crosshair"
                >
                  <div className="absolute inset-4 border-2 border-white/30 pointer-events-none"></div>
                  <div className="absolute top-1/2 left-0 w-full h-0.5 bg-white/30 -translate-y-1/2 pointer-events-none"></div>
                  <div className="absolute top-1/2 left-1/2 w-24 h-24 border-2 border-white/30 rounded-full -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
                  <div className="absolute top-1/2 left-1/2 w-1.5 h-1.5 bg-white/50 rounded-full -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>

                  <svg className="absolute inset-0 w-full h-full pointer-events-none">
                    {arrows.map(arr => (
                      <g key={arr.id}>
                        <line x1={`${arr.startX}%`} y1={`${arr.startY}%`} x2={`${arr.endX}%`} y2={`${arr.endY}%`} stroke="#facc15" strokeWidth="3" strokeDasharray="6,4" />
                      </g>
                    ))}
                  </svg>

                 {elements.map(el => {
                      let tokenContent = '';
                      let tokenStyle = "";

                      if (el.type === 'player') {
                        let baseColor = el.color === 'blue' ? 'from-blue-600 to-blue-800 border-blue-400' : 'from-rose-600 to-rose-800 border-rose-400';
                        tokenStyle = `w-9 h-9 rounded-full flex items-center justify-center font-black text-xs shadow-xl border-2 bg-gradient-to-br ${baseColor} text-white`;
                        tokenContent = el.number;
                      } else if (el.type === 'ball') {
                        // Pallone da calcio geometrico e lucido
                        tokenStyle = "w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-2xl bg-gradient-to-br from-white via-gray-100 to-gray-300 border-2 border-gray-900";
                        tokenContent = '⚽';
                      } else if (el.type === 'cone') {
                        // Cono d'allenamento tridimensionale con base trapezoidale e striature
                        tokenStyle = "w-8 h-7 flex flex-col items-center justify-center filter drop-shadow-[0_4px_4px_rgba(0,0,0,0.6)] relative";
                        tokenContent = (
                          <div className="relative flex flex-col items-center">
                            <div className="w-0.5 h-1 bg-white/80 absolute -top-1 z-10"></div>
                            <div style={{
                              width: 0, 
                              height: 0, 
                              borderLeft: '11px solid transparent', 
                              borderRight: '11px solid transparent', 
                              borderBottom: '22px solid #ea580c',
                              filter: 'drop-shadow(0 2px 2px rgba(0,0,0,0.4))'
                            }}></div>
                            <div className="w-5 h-1.5 bg-orange-800 rounded-full -mt-0.5 shadow-md"></div>
                          </div>
                        );
                      } else if (el.type === 'cinesina') {
                        // Cinesina / piattino basso con effetto cupola professionale
                        tokenStyle = "w-7 h-4 rounded-full bg-gradient-to-t from-amber-600 via-amber-400 to-amber-300 border border-amber-200 shadow-xl flex items-center justify-center filter drop-shadow-[0_3px_3px_rgba(0,0,0,0.5)] relative";
                        tokenContent = (
                          <div className="w-3.5 h-1.5 rounded-full bg-white/40 absolute top-0.5 shadow-inner"></div>
                        );
                      } else if (el.type === 'ladder') {
                        // Scaletta di agilità a pioli rettangolari rigidi con texture in rilievo
                        tokenStyle = "w-12 h-6 bg-gradient-to-r from-yellow-500 via-yellow-400 to-yellow-500 border border-yellow-200 rounded-sm shadow-2xl flex flex-col justify-around p-0.5 filter drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)]";
                        tokenContent = (
                          <>
                            <div className="w-full h-1 bg-yellow-700/60 rounded-sm shadow-inner"></div>
                            <div className="w-full h-1 bg-yellow-700/60 rounded-sm shadow-inner"></div>
                            <div className="w-full h-1 bg-yellow-700/60 rounded-sm shadow-inner"></div>
                          </>
                        );
                      }

                      return (
                        <div
                          key={el.id}
                          onMouseDown={(e) => { e.stopPropagation(); if (tool === 'move' || tool === 'delete') { if(tool === 'delete') { setElements(elements.filter(item => item.id !== el.id)); setArrows(arrows.filter(a => a.id !== el.id)); } else { setDraggedId(el.id); } } }}
                          onTouchStart={(e) => { e.stopPropagation(); if (tool === 'move' || tool === 'delete') { if(tool === 'delete') { setElements(elements.filter(item => item.id !== el.id)); } else { setDraggedId(el.id); } } }}
                          style={{ left: `${el.x}%`, top: `${el.y}%`, transform: 'translate(-50%, -50%)' }}
                          className="absolute flex flex-col items-center cursor-pointer select-none z-10"
                        >
                          <div className={tokenStyle}>
                            {tokenContent}
                          </div>
                          {el.type === 'player' && (
                            editingPlayerId === el.id ? (
                              <input 
                                autoFocus
                                type="text"
                                value={tempPlayerName}
                                onChange={(e) => setTempPlayerName(e.target.value)}
                                onBlur={() => {
                                  setElements(elements.map(item => item.id === el.id ? { ...item, name: tempPlayerName } : item));
                                  setEditingPlayerId(null);
                                }}
                                onKeyDown={(e) => {
                                  if (e.key === 'Enter') {
                                    setElements(elements.map(item => item.id === el.id ? { ...item, name: tempPlayerName } : item));
                                    setEditingPlayerId(null);
                                  }
                                }}
                                className="mt-1 bg-black text-white text-[9px] px-1.5 py-0.5 rounded border border-emerald-500 text-center w-16 shadow-lg"
                              />
                            ) : (
                              <span 
                                onDoubleClick={(e) => { e.stopPropagation(); setEditingPlayerId(el.id); setTempPlayerName(el.name || ''); }}
                                onClick={(e) => { e.stopPropagation(); setEditingPlayerId(el.id); setTempPlayerName(el.name || ''); }}
                                className="mt-0.5 bg-black/90 text-white px-1.5 py-0.5 rounded text-[9px] font-bold whitespace-nowrap shadow-lg cursor-pointer border border-transparent hover:border-emerald-400"
                              >
                                {el.name || 'Nome'}
                              </span>
                            )
                          )}
                        </div>
                      );
                    })}
                </div>
              </div>
            )}

            {activeTab === 'drills' && (
              <div className="glass-panel p-6 rounded-3xl shadow-xl space-y-6 max-w-2xl mx-auto">
                <h2 className="text-lg font-black text-white">{t('newDrill')}</h2>
                <form onSubmit={addDrill} className="space-y-3">
                  <input type="text" placeholder={t('drillTitlePlaceholder')} value={newDrillTitle} onChange={(e)=>setNewDrillTitle(e.target.value)} className="w-full bg-gray-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
                  <textarea placeholder={t('drillDescPlaceholder')} value={newDrillDesc} onChange={(e)=>setNewDrillDesc(e.target.value)} className="w-full bg-gray-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 h-24"></textarea>
                  <button type="submit" className="w-full bg-emerald-500 text-black font-extrabold py-3 rounded-xl text-xs">{t('saveDrill')}</button>
                </form>
                <div className="space-y-2">
                  {drills.length === 0 ? <p className="text-xs text-gray-400 text-center py-4">{t('noDrills')}</p> : drills.map(d => (
                    <div key={d.id} className="p-3 bg-white/5 border border-white/5 rounded-xl flex justify-between items-center text-xs">
                      <span className="font-bold">{d.title}</span>
                      <button onClick={()=>removeDrill(d.id)} className="text-rose-400 font-bold">Elimina</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'squad' && (
              <div className="glass-panel p-6 rounded-3xl shadow-xl space-y-6 max-w-2xl mx-auto">
                <h2 className="text-lg font-black text-white">Rosa Giocatori</h2>
                <form onSubmit={addPlayer} className="flex gap-2">
                  <input type="text" placeholder="N." value={newPlayerNumber} onChange={(e)=>setNewPlayerNumber(e.target.value)} className="w-16 bg-gray-950/50 border border-white/10 rounded-xl px-3 py-3 text-sm text-white text-center" />
                  <input type="text" placeholder={t('playerPlaceholder')} value={newPlayerName} onChange={(e)=>setNewPlayerName(e.target.value)} className="flex-1 bg-gray-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
                  <button type="submit" className="bg-emerald-500 text-black px-5 font-extrabold rounded-xl text-xs">{t('addPlayer')}</button>
                </form>
                <div className="space-y-2">
                  {players.length === 0 ? <p className="text-xs text-gray-400 text-center py-4">{t('noPlayers')}</p> : players.map(p => (
                    <div key={p.id} className="p-3 bg-white/5 border border-white/5 rounded-xl flex justify-between items-center text-xs">
                      <span className="font-bold">#{p.number} - {p.name} ({p.role})</span>
                      <button onClick={()=>removePlayer(p.id)} className="text-rose-400 font-bold">Elimina</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<CoachProApp />, document.getElementById('root'));
  </script>
</body>
</html>
