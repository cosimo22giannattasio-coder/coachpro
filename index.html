    function CoachProApp() {
      // Auth state
      const [user, setUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [authData, setAuthData] = useState({ name: '', email: '', password: '' });

      // Profile & Settings state
      const [showProfileDrawer, setShowProfileDrawer] = useState(false);
      const [profileImage, setProfileImage] = useState(null);
      const [language, setLanguage] = useState('it');

      const t = (key) => {
        return translations[language][key] || translations['it'][key] || key;
      };

      // App state
      const [activeTab, setActiveTab] = useState('board');
      const [tool, setTool] = useState('move');
      const [draggedId, setDraggedId] = useState(null);
      const [elements, setElements] = useState([]);
      const [arrows, setArrows] = useState([]);
      const [isDrawingArrow, setIsDrawingArrow] = useState(false);
      const [currentArrowStart, setCurrentArrowStart] = useState(null);
      const [showPaywallModal, setShowPaywallModal] = useState(false);

      // Club License state
      const [clubCodeInput, setClubCodeInput] = useState('');
      const [clubCodeMsg, setClubCodeMsg] = useState('');

      // Data state
      const [drills, setDrills] = useState([]);
      const [players, setPlayers] = useState([]);
      const [newPlayerName, setNewPlayerName] = useState('');
      const [newPlayerRole, setNewPlayerRole] = useState('Centrocampista');
      
      const [newDrillTitle, setNewDrillTitle] = useState('');
      const [newDrillCat, setNewDrillCat] = useState('Possesso Palla');
      const [newDrillDur, setNewDrillDur] = useState('15 min');
      const [newDrillDesc, setNewDrillDesc] = useState('');

      const svgRef = useRef(null);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setProfileImage(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const checkAccess = () => {
        if (!user) return false;
        if (user.isPro) return true;
        if (user.trialEndsAt && new Date().getTime() < user.trialEndsAt) return true;
        return false;
      };

      const hasAccess = checkAccess();

      const handleAuth = (evt) => {
        evt.preventDefault();
        if (!authData.email) return;
        const displayName = authData.name.trim() ? authData.name.trim() : authData.email.split('@')[0];
        const trialEndTime = new Date().getTime() + (TRIAL_DAYS * 24 * 60 * 60 * 1000);

        setUser({
          name: displayName,
          email: authData.email,
          isPro: false,
          clubCode: null,
          trialEndsAt: authMode === 'register' ? trialEndTime : null
        });
      };

      const handleLogout = () => {
        setUser(null);
        setAuthData({ name: '', email: '', password: '' });
        setProfileImage(null);
      };

      const activateTrial = () => {
        const trialEndTime = new Date().getTime() + (TRIAL_DAYS * 24 * 60 * 60 * 1000);
        setUser({ ...user, trialEndsAt: trialEndTime });
        setShowPaywallModal(false);
      };

      const handleRedeemClubCode = (e) => {
        e.preventDefault();
        if (!clubCodeInput.trim()) return;
        
        const code = clubCodeInput.trim().toUpperCase();
        if (code.length >= 4) {
          setUser({
            ...user,
            isPro: true,
            clubCode: code
          });
          setClubCodeMsg('✅ ' + (language === 'it' ? 'Codice Società riscattato con successo!' : 'Club code redeemed successfully!'));
          setTimeout(() => {
            setShowPaywallModal(false);
            setClubCodeMsg('');
            setClubCodeInput('');
          }, 1500);
        } else {
          setClubCodeMsg('❌ ' + (language === 'it' ? 'Codice non valido.' : 'Invalid code.'));
        }
      };

      const handleShareClubInvite = () => {
        const codeToShare = user?.clubCode || "CP-CLUB-2026";
        const text = `⚽ *COACHPRO - LICENZA SOCIETÀ*\n\n🔑 *Codice:* ${codeToShare}\n\n1. Open CoachPro\n2. Subscription > Redeem Club Code`;
        const encodedText = encodeURIComponent(text);
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
          window.location.href = `whatsapp://send?text=${encodedText}`;
        } else {
          window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
        }
      };

      const handleExportPDF = () => {
        if (!hasAccess) {
          setShowPaywallModal(true);
          return;
        }

        const printWindow = window.open('', '_blank');
        if (!printWindow) {
          alert("Abilita i popup per scaricare il PDF.");
          return;
        }

        const drillsHtml = drills.length === 0 
          ? `<p style="color:#666; font-style:italic;">Nessun esercizio inserito in questa sessione.</p>`
          : drills.map((d, index) => `
            <div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa;">
              <h3 style="margin: 0 0 5px 0; color: #15803d;">#${index + 1} - ${d.title}</h3>
              <p style="margin: 0 0 8px 0; font-size: 12px; color: #555;"><strong>Categoria:</strong> ${d.category} | ⏱️ <strong>Durata:</strong> ${d.duration}</p>
              <p style="margin: 0; font-size: 13px; color: #333; white-space: pre-line;">${d.description || 'Nessuna descrizione.'}</p>
            </div>
          `).join('');

        const squadHtml = players.length === 0
          ? `<p style="color:#666; font-style:italic;">Nessun giocatore registrato in rosa.</p>`
          : `
            <table style="width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px;">
              <thead>
                <tr style="background: #15803d; color: white;">
                  <th style="padding: 8px; text-align: left; border: 1px solid #ddd;">Giocatore</th>
                  <th style="padding: 8px; text-align: left; border: 1px solid #ddd;">Ruolo</th>
                  <th style="padding: 8px; text-align: left; border: 1px solid #ddd;">Stato</th>
                </tr>
              </thead>
              <tbody>
                ${players.map(p => `
                  <tr>
                    <td style="padding: 6px; border: 1px solid #ddd;">${p.name}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${p.role}</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-transform: uppercase; font-weight: bold; color: ${p.status === 'presente' ? '#15803d' : '#dc2626'};">${p.status}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;

        printWindow.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8" />
            <title>CoachPro - Sessione di Allenamento</title>

        const x = Math.max(5, Math.min(95, ((clientX - rect.left) / rect.width) * 100));

        return { x, y };

                    <button onClick={() => presetFormation('4231')} className="px-2.5 py-1 bg-gray-900 border border-gray-800 rounded-lg text-xs font-semibold hover:border-emerald-500 transition-all">4-2-3-1</button>
                    <button onClick={() => presetFormation('352')} className="px-2.5 py-1 bg-gray-900 border border-gray-800 rounded-lg text-xs font-semibold hover:border-emerald-500 transition-all">3-5-2</button>
                    <button onClick={() => presetFormation('3421')} className="px-2.5 py-1 bg-gray-900 border border-gray-800 rounded-lg text-xs font-semibold hover:border-emerald-500 transition-all">3-4-2-1</button>
                    <button onClick={() => presetFormation('4312')} className="px-2.5 py-1 bg-gray-900 border border-gray-800 rounded-lg text-xs font-semibold hover:border-emerald-500 transition-all">4-3-1-2</button>
                  </div>
                </div>

                {/* Toolbar strumenti */}
                <div className="w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-2xl p-2 mb-3 flex flex-wrap items-center justify-center gap-1.5 shadow-lg">
                  <button onClick={() => setTool('move')} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${tool === 'move' ? 'bg-emerald-600 text-white shadow' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}>{t('toolMove')}</button>
                  <button onClick={() => setTool('player-red')} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${tool === 'player-red' ? 'bg-rose-600 text-white shadow' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}>{t('toolRed')}</button>
                  <button onClick={() => setTool('player-blue')} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${tool === 'player-blue' ? 'bg-blue-600 text-white shadow' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}>{t('toolBlue')}</button>
                  <button onClick={() => setTool('ball')} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${tool === 'ball' ? 'bg-amber-600 text-white shadow' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}>{t('toolBall')}</button>
                  <button onClick={() => setTool('cone')} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${tool === 'cone' ? 'bg-orange-600 text-white shadow' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}>{t('toolCone')}</button>
                  <button onClick={() => setTool('cinesina')} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${tool === 'cinesina' ? 'bg-yellow-500 text-gray-950 shadow' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}>{t('toolCinesina')}</button>
                  <button onClick={() => setTool('ladder')} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${tool === 'ladder' ? 'bg-purple-600 text-white shadow' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}>{t('toolLadder')}</button>
                  <button onClick={() => setTool('arrow')} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${tool === 'arrow' ? 'bg-cyan-600 text-white shadow' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}>{t('toolArrow')}</button>
                  <button onClick={() => setTool('delete')} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${tool === 'delete' ? 'bg-rose-700 text-white shadow' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}>{t('toolDelete')}</button>
                  <button onClick={() => { setElements([]); setArrows([]); }} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-gray-800 text-rose-400 hover:bg-gray-700 transition-all">{t('toolClear')}</button>
                </div>

                {/* Campo da calcio / Lavagna */}
                <div className="w-full max-w-2xl aspect-[2/3] relative rounded-2xl overflow-hidden shadow-2xl border-4 border-gray-800 pitch-bg">
                  <svg 
                    ref={svgRef} 
                    onClick={handleBoardClick} 
                    onTouchMove={handleTouchMove}
                    className="w-full h-full absolute inset-0 cursor-crosshair"
                  >
                    {/* Linee del campo */}
                    <rect x="5%" y="5%" width="90%" height="90%" fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="2" />
                    <line x1="5%" y1="50%" x2="95%" y2="50%" stroke="rgba(255,255,255,0.4)" strokeWidth="2" />
                    <circle cx="50%" cy="50%" r="15%" fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="2" />
                    <circle cx="50%" cy="50%" r="1%" fill="rgba(255,255,255,0.4)" />
                    {/* Area di rigore superiore */}
                    <rect x="30%" y="5%" width="40%" height="18%" fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="2" />
                    <rect x="40%" y="5%" width="20%" height="6%" fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="2" />
                    {/* Area di rigore inferiore */}
                    <rect x="30%" y="77%" width="40%" height="18%" fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="2" />
                    <rect x="40%" y="89%" width="20%" height="6%" fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="2" />

                    {/* Frecce salvate */}
                    {arrows.map(arr => (
                      <g key={arr.id}>
                        <line x1={`${arr.startX}%`} y1={`${arr.startY}%`} x2={`${arr.endX}%`} y2={`${arr.endY}%`} stroke="#38bdf8" strokeWidth="3" strokeDasharray="5,5" />
                        <circle cx={`${arr.endX}%`} cy={`${arr.endY}%`} r="3" fill="#38bdf8" />
                      </g>
                    ))}

                    {/* Freccia in corso di disegno */}
                    {isDrawingArrow && currentArrowStart && (
                      <line x1={`${currentArrowStart.x}%`} y1={`${currentArrowStart.y}%`} x2={`${currentArrowStart.x}%`} y2={`${currentArrowStart.y}%`} stroke="#38bdf8" strokeWidth="3" strokeDasharray="5,5" />
                    )}
                  </svg>

                  {/* Elementi sulla lavagna (Giocatori, Palla, Coni, ecc.) */}
                  {elements.map(el => {
                    let bgClass = "bg-rose-600 border-rose-400";
                    if (el.color === 'blue') bgClass = "bg-blue-600 border-blue-400";
                    if (el.type === 'ball') bgClass = "bg-white text-gray-950 border-gray-300";
                    if (el.type === 'cone') bgClass = "bg-orange-500 border-orange-300 rounded-none transform rotate-45";
                    if (el.type === 'cinesina') bgClass = "bg-yellow-400 text-gray-950 border-yellow-200 rounded-full w-6 h-6 text-[10px]";
                    if (el.type === 'ladder') bgClass = "bg-purple-600 border-purple-400 rounded-md w-8 h-5 text-[10px]";

                    return (
                      <div
                        key={el.id}
                        onClick={(e) => handleElementClick(el.id, e)}
                        style={{ left: `${el.x}%`, top: `${el.y}%`, transform: 'translate(-50%, -50%)' }}
                        className={`absolute w-9 h-9 rounded-full flex items-center justify-center font-bold text-xs shadow-xl cursor-pointer border-2 transition-transform select-none ${bgClass} ${draggedId === el.id ? 'ring-4 ring-emerald-400 scale-110' : ''}`}
                      >
                        {el.type === 'player' && el.number}
                        {el.type === 'ball' && '⚽'}
                        {el.type === 'cone' && ''}
                        {el.type === 'cinesina' && '•'}
                        {el.type === 'ladder' && '☷'}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'drills' && (
              <div className="p-4 max-w-2xl mx-auto w-full">
                <form onSubmit={addDrill} className="bg-gray-900 border border-gray-800 rounded-2xl p-4 mb-6 shadow-lg space-y-3">
                  <h2 className="font-bold text-base mb-2 text-emerald-400">{t('newDrill')}</h2>
                  <input 
                    type="text" 
                    placeholder={t('drillTitlePlaceholder')} 
                    value={newDrillTitle} 
                    onChange={(e) => setNewDrillTitle(e.target.value)} 
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500"
                  />
                  <div className="grid grid-cols-2 gap-2">
                    <select 
                      value={newDrillCat} 
                      onChange={(e) => setNewDrillCat(e.target.value)} 
                      className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500"
                    >
                      <option value="Possesso Palla">{t('categoryPossesso')}</option>
                      <option value="Tattica">{t('categoryTactics')}</option>
                      <option value="Atletico">{t('categoryFitness')}</option>
                      <option value="Rifinitura">{t('categoryFinishing')}</option>
                    </select>
                    <input 
                      type="text" 
                      placeholder={t('drillDurationPlaceholder')} 
                      value={newDrillDur} 
                      onChange={(e) => setNewDrillDur(e.target.value)} 
                      className="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <textarea 
                    placeholder={t('drillDescPlaceholder')} 
                    rows="3" 
                    value={newDrillDesc} 
                    onChange={(e) => setNewDrillDesc(e.target.value)} 
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500"
                  />
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition-all text-sm shadow">
                    {t('saveDrill')}
                  </button>
                </form>

                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-bold text-sm text-gray-300">Esercitazioni Salvate ({drills.length})</h3>
                  {drills.length > 0 && (
                    <button onClick={handleExportPDF} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-all shadow flex items-center space-x-1">
                      <span>{t('exportPdf')}</span>
                    </button>
                  )}
                </div>

                {drills.length === 0 ? (
                  <p className="text-gray-500 text-center py-10 text-sm">{t('noDrills')}</p>
                ) : (
                  <div className="space-y-3">
                    {drills.map((d, index) => (
                      <div key={d.id} className="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow">
                        <div className="flex items-start justify-between">
                          <div>
                            <span className="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-semibold border border-emerald-500/30">{d.category}</span>
                            <h4 className="font-bold text-base mt-1">#{index + 1} - {d.title}</h4>
                            <p className="text-xs text-gray-400 mt-0.5">⏱️ {d.duration}</p>
                          </div>
                          <div className="flex items-center space-x-2">
                            <button onClick={() => handleExportSingleDrillPDF(d)} className="bg-gray-800 hover:bg-gray-700 text-emerald-400 p-2 rounded-xl text-xs font-bold transition-all" title="Esporta PDF Esercizio">
                              📄
                            </button>
                            <button onClick={() => handleShareWhatsApp(d)} className="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 p-2 rounded-xl text-xs font-bold transition-all">
                              📲
                            </button>
                            <button onClick={() => removeDrill(d.id)} className="text-gray-500 hover:text-rose-400 p-2">✕</button>
                          </div>
                        </div>
                        {d.description && <p className="text-sm text-gray-300 mt-3 whitespace-pre-line bg-gray-950 p-3 rounded-xl border border-gray-800/60">{d.description}</p>}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'squad' && (
              <div className="p-4 max-w-2xl mx-auto w-full">
                <form onSubmit={addPlayer} className="bg-gray-900 border border-gray-800 rounded-2xl p-4 mb-6 shadow-lg space-y-3">
                  <h2 className="font-bold text-base mb-2 text-emerald-400">Aggiungi Giocatore in Rosa</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                    <input 
                      type="text" 
                      placeholder={t('playerPlaceholder')} 
                      value={newPlayerName} 
                      onChange={(e) => setNewPlayerName(e.target.value)} 
                      className="md:col-span-2 w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500"
                    />
                    <select 
                      value={newPlayerRole} 
                      onChange={(e) => setNewPlayerRole(e.target.value)} 
                      className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500"
                    >
                      <option value="Portiere">{t('roleGoalkeeper')}</option>
                      <option value="Difensore">{t('roleDefender')}</option>
                      <option value="Centrocampista">{t('roleMidfielder')}</option>
                      <option value="Attaccante">{t('roleForward')}</option>
                    </select>
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition-all text-sm shadow">
                    + {t('addPlayer')}
                  </button>
                </form>

                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-bold text-sm text-gray-300">Rosa Giocatori ({players.length})</h3>
                </div>

                {players.length === 0 ? (
                  <p className="text-gray-500 text-center py-10 text-sm">{t('noPlayers')}</p>
                ) : (
                  <div className="space-y-2">
                    {players.map(p => {
                      let statusBadge = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
                      if (p.status === 'assente') statusBadge = "bg-rose-500/20 text-rose-400 border-rose-500/30";
                      if (p.status === 'infortunato') statusBadge = "bg-amber-500/20 text-amber-400 border-amber-500/30";

                      return (
                        <div key={p.id} className="bg-gray-900 border border-gray-800 rounded-xl p-3 flex items-center justify-between shadow">
                          <div>
                            <h4 className="font-bold text-sm">{p.name}</h4>
                            <p className="text-xs text-gray-400">{p.role}</p>
                          </div>
                          <div className="flex items-center space-x-2">
                            <button 
                              onClick={() => togglePlayerStatus(p.id)} 
                              className={`text-[10px] px-2.5 py-1 rounded-full font-bold border transition-all ${statusBadge}`}
                            >
                              {p.status.toUpperCase()}
                            </button>
                            <button onClick={() => removePlayer(p.id)} className="text-gray-500 hover:text-rose-400 px-2 py-1">✕</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Drawer Profilo & Impostazioni */}
          {showProfileDrawer && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex justify-end">
              <div className="w-full max-w-sm bg-gray-900 h-full p-6 flex flex-col justify-between border-l border-gray-800 shadow-2xl">
                <div>
                  <div className="flex items-center justify-between mb-6">
                    <h2 className="font-bold text-lg">{t('profileSettings')}</h2>
                    <button onClick={() => setShowProfileDrawer(false)} className="text-gray-400 hover:text-white text-lg font-bold">✕</button>
                  </div>

                  <div className="flex flex-col items-center mb-6">
                    <div className="w-20 h-20 rounded-2xl bg-emerald-600 flex items-center justify-center font-bold text-2xl overflow-hidden border-2 border-emerald-500 mb-3 shadow-lg">
                      {profileImage ? <img src={profileImage} className="w-full h-full object-cover" /> : 'CP'}
                    </div>
                    <label className="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-xl text-xs font-bold cursor-pointer transition-all border border-gray-700 shadow">
                      {t('uploadPhoto')}
                      <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                    </label>
                  </div>

                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-medium text-gray-400 mb-1">{t('languageLabel')}</label>
                      <select 
                        value={language} 
                        onChange={(e) => setLanguage(e.target.value)} 
                        className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500"
                      >
                        <option value="it">Italiano</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                      </select>
                    </div>

                    <div className="bg-gray-950 p-4 rounded-xl border border-gray-800">
                      <p className="text-xs text-gray-400 mb-1">{t('accountStatus')}</p>
                      <p className="font-bold text-sm text-white">{user.email}</p>
                      {user.clubCode && (
                        <p className="text-xs text-emerald-400 mt-2 font-semibold">{t('clubLicenseActive')} ({user.clubCode})</p>
                      )}
                    </div>
                  </div>
                </div>

                <div className="space-y-2">
                  {user.clubCode && (
                    <button onClick={handleShareClubInvite} className="w-full bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 font-bold py-2.5 rounded-xl transition-all text-xs border border-emerald-500/30 flex items-center justify-center space-x-1">
                      <span>{t('inviteCoach')}</span>
                    </button>
                  )}
                  <button onClick={handleLogout} className="w-full bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 font-bold py-2.5 rounded-xl transition-all text-xs border border-rose-500/30">
                    {t('logoutAccount')}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Paywall / Modale Abbonamenti */}
          {showPaywallModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl relative">
                <button onClick={() => setShowPaywallModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white font-bold">✕</button>
                
                <div className="text-center mb-6">
                  <div className="w-12 h-12 bg-amber-500 text-gray-950 rounded-2xl mx-auto flex items-center justify-center text-xl font-black mb-3 shadow-lg">⭐</div>
                  <h2 className="text-xl font-bold">{t('paywallHeader')}</h2>
                  <p className="text-gray-400 text-xs mt-1">{t('paywallDesc')}</p>
                </div>

                <div className="space-y-3 mb-6">
                  <a 
                    href={STRIPE_PAYMENT_LINK} 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    className="block w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:opacity-90 text-white font-bold py-3 px-4 rounded-xl text-center text-sm shadow-lg transition-all"
                  >
                    {t('indProBtn')}
                  </a>
                  <a 
                    href={STRIPE_CLUB_PAYMENT_LINK} 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    className="block w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-90 text-white font-bold py-3 px-4 rounded-xl text-center text-sm shadow-lg transition-all"
                  >
                    {t('clubBtn')}
                    <span className="block text-[10px] font-normal text-blue-200 mt-0.5">{t('clubSubBtn')}</span>
                  </a>
                </div>

                <div className="border-t border-gray-800 pt-4 mb-4">
                  <form onSubmit={handleRedeemClubCode} className="space-y-2">
                    <label className="block text-xs font-medium text-gray-400">{t('haveClubCode')}</label>
                    <div className="flex space-x-2">
                      <input 
                        type="text" 
                        placeholder="Inserisci codice..." 
                        value={clubCodeInput} 
                        onChange={(e) => setClubCodeInput(e.target.value)} 
                        className="flex-1 bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 uppercase"
                      />
                      <button type="submit" className="bg-gray-800 hover:bg-gray-700 text-emerald-400 px-4 py-2 rounded-xl text-xs font-bold border border-gray-700">
                        {t('activate')}
                      </button>
                    </div>
                    {clubCodeMsg && <p className="text-xs font-semibold mt-1">{clubCodeMsg}</p>}
                  </form>
                </div>

                {!user.trialEndsAt && (
                  <button 
                    onClick={activateTrial} 
                    className="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-2.5 rounded-xl text-xs transition-all border border-gray-700"
                  >
                    {t('trialBtn')}
                  </button>
                )}
              </div>
            </div>
          )}

          {/* Navbar inferiore fissa */}
          <nav className="bg-gray-900 border-t border-gray-800 fixed bottom-0 left-0 right-0 z-30 flex justify-around py-2 px-2 shadow-2xl">
            <button 
              onClick={() => setActiveTab('board')} 
              className={`flex flex-col items-center flex-1 py-1 transition-all ${activeTab === 'board' ? 'text-emerald-400 font-bold scale-105' : 'text-gray-400 hover:text-gray-200'}`}
            >
              <span className="text-lg">📋</span>
              <span className="text-[10px] mt-0.5">{t('navBoard')}</span>
            </button>
            <button 
              onClick={() => setActiveTab('drills')} 
              className={`flex flex-col items-center flex-1 py-1 transition-all ${activeTab === 'drills' ? 'text-emerald-400 font-bold scale-105' : 'text-gray-400 hover:text-gray-200'}`}
            >
              <span className="text-lg">⚽</span>
              <span className="text-[10px] mt-0.5">{t('navDrills')}</span>
            </button>
            <button 
              onClick={() => setActiveTab('squad')} 
              className={`flex flex-col items-center flex-1 py-1 transition-all ${activeTab === 'squad' ? 'text-emerald-400 font-bold scale-105' : 'text-gray-400 hover:text-gray-200'}`}
            >
              <span className="text-lg">👥</span>
              <span className="text-[10px] mt-0.5">{t('navSquad')}</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.render(<CoachProApp />, document.getElementById('root'));
  </script>
</body>
</html>
