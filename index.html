<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CoachPro - Lavagna & Session Planner</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbar & Touch Optimization */
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @media print {
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased selection:bg-emerald-500 selection:text-gray-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/tua_pagina_stripe";

    // Formazioni preimpostate (coordinate relative in %)
    const FORMATIONS = {
      '4-3-3': [
        { role: 'POR', x: 50, y: 92 },
        { role: 'TD',  x: 88, y: 75 },
        { role: 'DC',  x: 62, y: 80 },
        { role: 'DC',  x: 38, y: 80 },
        { role: 'TS',  x: 12, y: 75 },
        { role: 'MED', x: 50, y: 60 },
        { role: 'CC',  x: 72, y: 50 },
        { role: 'CC',  x: 28, y: 50 },
        { role: 'ED',  x: 85, y: 25 },
        { role: 'ATT', x: 50, y: 20 },
        { role: 'ES',  x: 15, y: 25 }
      ],
      '4-4-2': [
        { role: 'POR', x: 50, y: 92 },
        { role: 'TD',  x: 88, y: 75 },
        { role: 'DC',  x: 62, y: 80 },
        { role: 'DC',  x: 38, y: 80 },
        { role: 'TS',  x: 12, y: 75 },
        { role: 'ED',  x: 85, y: 50 },
        { role: 'CC',  x: 62, y: 55 },
        { role: 'CC',  x: 38, y: 55 },
        { role: 'ES',  x: 15, y: 50 },
        { role: 'ATT', x: 62, y: 25 },
        { role: 'ATT', x: 38, y: 25 }
      ],
      '3-5-2': [
        { role: 'POR', x: 50, y: 92 },
        { role: 'DC',  x: 75, y: 80 },
        { role: 'DC',  x: 50, y: 82 },
        { role: 'DC',  x: 25, y: 80 },
        { role: 'ED',  x: 90, y: 48 },
        { role: 'CC',  x: 68, y: 58 },
        { role: 'MED', x: 50, y: 64 },
        { role: 'CC',  x: 32, y: 58 },
        { role: 'ES',  x: 10, y: 48 },
        { role: 'ATT', x: 60, y: 22 },
        { role: 'ATT', x: 40, y: 22 }
      ]
    };

    function CoachProApp() {
      // Navigation Tabs: 'board' | 'drills' | 'microcycle' | 'squad' | 'profile'
      const [activeTab, setActiveTab] = useState('board');
      
      // User Auth Simulation State
      const [user, setUser] = useState({ loggedIn: true, email: 'mister.rossi@coachpro.it', name: 'Mister Marco Rossi', isPro: true, teamName: 'US Triestina Calcio' });
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');

      // Tactical Board State
      const [pitchView, setPitchView] = useState('full'); // 'full' | 'half'
      const [tool, setTool] = useState('move'); // 'move', 'player-red', 'player-blue', 'ball', 'cone', 'ladder', 'hurdle', 'arrow-pass', 'arrow-run', 'delete'
      const [playerNumberInput, setPlayerNumberInput] = useState('9');
      
      const [elements, setElements] = useState([
        { id: '1', type: 'player', color: 'red', number: '9', x: 50, y: 38 },
        { id: '2', type: 'player', color: 'red', number: '10', x: 35, y: 48 },
        { id: '3', type: 'player', color: 'blue', number: '4', x: 50, y: 55 },
        { id: '4', type: 'player', color: 'blue', number: '5', x: 65, y: 60 },
        { id: '5', type: 'ball', x: 48, y: 42 },
        { id: '6', type: 'cone', x: 30, y: 30 },
        { id: '7', type: 'cone', x: 70, y: 30 },
        { id: '8', type: 'ladder', x: 15, y: 45 },
        { id: '9', type: 'hurdle', x: 82, y: 45 }
      ]);
      const [arrows, setArrows] = useState([
        { id: 'a1', startX: 50, startY: 38, endX: 35, endY: 48, type: 'pass' }
      ]);

      const [draggingId, setDraggingId] = useState(null);
      const [isDrawingArrow, setIsDrawingArrow] = useState(false);
      const [arrowStart, setArrowStart] = useState(null);
      const [arrowPreview, setArrowPreview] = useState(null);

      // Drill Library State
      const [drills, setDrills] = useState([
        {
          id: 'd1',
          title: 'Rondo 4v2 con Uscita in Ampiezza',
          category: 'Possesso Palla',
          duration: '15 min',
          pitchSize: '20x20 m',
          players: '6 Giocatori',
          intensity: 'Alta',
          equipment: '10 Coni, 2 Palloni',
          description: 'Mantenimento del possesso palla in uno spazio stretto. Al recupero dei 2 difensori, cercare immediatamente l\'uscita verso l\'esterno su sponda per il ribaltamento di fronte.',
          keyPoints: 'Orientamento del corpo, trasmissione di prima intenzione, reazione rapida alla transizione.'
        },
        {
          id: 'd2',
          title: 'Costruzione dal Basso contro Pressing Alto 4-3-3',
          category: 'Tattica',
          duration: '25 min',
          pitchSize: 'Metà Campo',
          players: '11v10',
          intensity: 'Alta',
          description: 'Esercitazione guidata per l\'uscita dal primo pressing avversario sfruttando l\'abbassamento del mediano o la sovrapposizione interna del terzino opposto.',
          keyPoints: 'Smarcamento fuori ombra di pressione, conduzione nello spazio libero, verticalizzazione rapida.'
        },
        {
          id: 'd3',
          title: 'Circuit Training Reattività & Tiro in Porta',
          category: 'Atletica',
          duration: '20 min',
          pitchSize: 'Area Rigore',
          players: 'Tutta la rosa',
          intensity: 'Massima',
          equipment: 'Scaletta agility, 4 Ostacoli, Palloni',
          description: 'Lavoro ad alta intensità: rapida coordinazione sulla scaletta, salto dell\'ostacolo e conclusione immediata a rete al limite dell\'area.',
          keyPoints: 'Coordinazione appoggi, esplosività, accuratezza di tiro in situazione di affaticamento.'
        }
      ]);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Tutti');
      const [showNewDrillModal, setShowNewDrillModal] = useState(false);
      const [newDrill, setNewDrill] = useState({
        title: '', category: 'Possesso Palla', duration: '15 min', pitchSize: '20x20 m', players: '8', intensity: 'Alta', equipment: 'Coni, Palloni', description: '', keyPoints: ''
      });

      // Squad State
      const [players, setPlayers] = useState([
        { id: 'p1', name: 'Marco Rossi', role: 'Attaccante', number: 9, status: 'Presente' },
        { id: 'p2', name: 'Giuseppe Verdi', role: 'Centrocampista', number: 10, status: 'Presente' },
        { id: 'p3', name: 'Alessandro Bianchi', role: 'Difensore', number: 4, status: 'Infortunato' },
        { id: 'p4', name: 'Luca Ferrari', role: 'Portiere', number: 1, status: 'Presente' },
        { id: 'p5', name: 'Andrea Russo', role: 'Terzino', number: 3, status: 'Assente' },
        { id: 'p6', name: 'Matteo Romano', role: 'Centrocampista', number: 8, status: 'Presente' }
      ]);
      const [showAddPlayerModal, setShowAddPlayerModal] = useState(false);
      const [newPlayer, setNewPlayer] = useState({ name: '', role: 'Centrocampista', number: '' });

      // Microcycle State
      const [microcycle, setMicrocycle] = useState([
        { day: 'Lunedì', title: 'Scarico & Analisi Video', focus: 'Recupero attivo & Correzione errori tattici', duration: '60 min', intensity: 'Bassa' },
        { day: 'Martedì', title: 'Forza & Possesso Palla', focus: 'Potenza aerobica & Rondos ad alta intensità', duration: '90 min', intensity: 'Massima' },
        { day: 'Mercoledì', title: 'Transizioni & Velocità', focus: 'Attacco rapido e ripiegamento difensivo', duration: '90 min', intensity: 'Alta' },
        { day: 'Giovedì', title: 'Tattica Collettiva (11v11)', focus: 'Pressione, blocco medio e sviluppo di gioco', duration: '75 min', intensity: 'Media' },
        { day: 'Venerdì', title: 'Rifinitura & Palle Inattive', focus: 'Reattività, calci d\'angolo e punizioni', duration: '60 min', intensity: 'Bassa/Media' },
        { day: 'Sabato', title: 'MATCH DAY - CAMPIONATO', focus: 'Applicazione del piano gara & Focus 100%', duration: '90 min', intensity: 'Gara' },
        { day: 'Domenica', title: 'Riposo Rigenerativo', focus: 'Recupero fisico e mentale', duration: '0 min', intensity: 'Riposo' }
      ]);

      const [showProModal, setShowProModal] = useState(false);
      const [pdfPreviewDrill, setPdfPreviewDrill] = useState(null);

      const svgRef = useRef(null);

      // SVG Coordinate Helper
      const getSvgCoordinates = (e) => {
        if (!svgRef.current) return { x: 50, y: 50 };
        const rect = svgRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const x = Math.max(2, Math.min(98, ((clientX - rect.left) / rect.width) * 100));
        const y = Math.max(2, Math.min(98, ((clientY - rect.top) / rect.height) * 100));
        return { x, y };
      };

      // Board Interaction Handlers
      const handleBoardPointerDown = (e) => {
        if (tool === 'move') return;

        const { x, y } = getSvgCoordinates(e);

        if (tool === 'player-red') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'red', number: playerNumberInput || '7', x, y }]);
        } else if (tool === 'player-blue') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'blue', number: playerNumberInput || '4', x, y }]);
        } else if (tool === 'ball') {
          setElements([...elements, { id: Date.now().toString(), type: 'ball', x, y }]);
        } else if (tool === 'cone') {
          setElements([...elements, { id: Date.now().toString(), type: 'cone', x, y }]);
        } else if (tool === 'ladder') {
          setElements([...elements, { id: Date.now().toString(), type: 'ladder', x, y }]);
        } else if (tool === 'hurdle') {
          setElements([...elements, { id: Date.now().toString(), type: 'hurdle', x, y }]);
        } else if (tool === 'arrow-pass' || tool === 'arrow-run') {
          if (!isDrawingArrow) {
            setIsDrawingArrow(true);
            setArrowStart({ x, y });
            setArrowPreview({ startX: x, startY: y, endX: x, endY: y, type: tool === 'arrow-pass' ? 'pass' : 'run' });
          } else {
            setArrows([...arrows, { id: Date.now().toString(), startX: arrowStart.x, startY: arrowStart.y, endX: x, endY: y, type: tool === 'arrow-pass' ? 'pass' : 'run' }]);
            setIsDrawingArrow(false);
            setArrowStart(null);
            setArrowPreview(null);
          }
        }
      };

      const handleBoardPointerMove = (e) => {
        if (isDrawingArrow && arrowStart) {
          const { x, y } = getSvgCoordinates(e);
          setArrowPreview(prev => ({ ...prev, endX: x, endY: y }));
        }

        if (draggingId) {
          const { x, y } = getSvgCoordinates(e);
          setElements(elements.map(el => el.id === draggingId ? { ...el, x, y } : el));
        }
      };

      const handleBoardPointerUp = () => {
        if (draggingId) {
          setDraggingId(null);
        }
      };

      const handleElementPointerDown = (id, e) => {
        e.stopPropagation();
        if (tool === 'delete') {
          setElements(elements.filter(el => el.id !== id));
        } else if (tool === 'move') {
          setDraggingId(id);
        }
      };

      const handleArrowClick = (id, e) => {
        e.stopPropagation();
        if (tool === 'delete') {
          setArrows(arrows.filter(a => a.id !== id));
        }
      };

      const applyFormation = (formationKey, color) => {
        const selectedFormation = FORMATIONS[formationKey];
        if (!selectedFormation) return;

        const filtered = elements.filter(el => !(el.type === 'player' && el.color === color));

        const newPlayers = selectedFormation.map((pos, index) => ({
          id: Date.now().toString() + index,
          type: 'player',
          color: color,
          number: (index + 1).toString(),
          x: color === 'blue' ? pos.x : 100 - pos.x,
          y: color === 'blue' ? pos.y : 100 - pos.y
        }));

        setElements([...filtered, ...newPlayers]);
      };

      // WhatsApp Share
      const handleShareWhatsApp = (drill) => {
        const text = `⚽ *COACHPRO - SCHEDA ESERCIZIO*\n\n📌 *Titolo:* ${drill.title}\n⏱️ *Durata:* ${drill.duration} | 📐 *Campo:* ${drill.pitchSize}\n👥 *Giocatori:* ${drill.players} | 🔥 *Intensità:* ${drill.intensity}\n📂 *Categoria:* ${drill.category}\n🎒 *Attrezzatura:* ${drill.equipment || 'Standard'}\n\n📝 *Descrizione:*\n${drill.description}\n\n💡 *Punti Chiave:*\n${drill.keyPoints}\n\n_Inviato tramite CoachPro App_`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      };

      // Drill Management
      const handleSaveDrill = (e) => {
        e.preventDefault();
        if (!newDrill.title) return;
        setDrills([{ ...newDrill, id: Date.now().toString() }, ...drills]);
        setShowNewDrillModal(false);
        setNewDrill({ title: '', category: 'Possesso Palla', duration: '15 min', pitchSize: '20x20 m', players: '8', intensity: 'Alta', equipment: 'Coni, Palloni', description: '', keyPoints: '' });
      };

      // Squad Management
      const handleAddPlayer = (e) => {
        e.preventDefault();
        if (!newPlayer.name) return;
        const autoNumber = newPlayer.number || (players.length ? Math.max(...players.map(p => p.number)) + 1 : 1);
        setPlayers([...players, { id: Date.now().toString(), name: newPlayer.name, role: newPlayer.role, number: Number(autoNumber), status: 'Presente' }]);
        setShowAddPlayerModal(false);
        setNewPlayer({ name: '', role: 'Centrocampista', number: '' });
      };

      const togglePlayerStatus = (id) => {
        setPlayers(players.map(p => {
          if (p.id === id) {
            const nextStatus = p.status === 'Presente' ? 'Assente' : p.status === 'Assente' ? 'Infortunato' : 'Presente';
            return { ...p, status: nextStatus };
          }
          return p;
        }));
      };

      // Auth Handler
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        if (!authEmail) return;
        setUser({
          loggedIn: true,
          email: authEmail,
          name: authEmail.split('@')[0].toUpperCase(),
          isPro: true,
          teamName: 'Squadra Dilettanti FC'
        });
        setShowAuthModal(false);
      };

      const presentCount = players.filter(p => p.status === 'Presente').length;
      const injuredCount = players.filter(p => p.status === 'Infortunato').length;

      return (
        <div className="min-h-screen bg-gray-950 text-gray-100 flex flex-col justify-between max-w-md md:max-w-4xl mx-auto shadow-2xl border-x border-gray-800">
          
          {/* HEADER */}
          <header className="bg-gray-900 border-b border-gray-800 px-4 py-3 flex items-center justify-between sticky top-0 z-40 no-print">
            <div className="flex items-center space-x-3">
              <div className="bg-gradient-to-tr from-emerald-600 to-emerald-400 text-gray-950 p-2 rounded-xl font-black text-xl tracking-tighter shadow-lg shadow-emerald-500/20 flex items-center justify-center w-10 h-10">
                CP
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <h1 className="font-extrabold text-lg leading-tight text-white tracking-wide">CoachPro</h1>
                  <span className="bg-emerald-500/20 text-emerald-400 text-[10px] font-black px-1.5 py-0.5 rounded border border-emerald-500/30">PRO</span>
                </div>
                <span className="text-[11px] text-gray-400 font-semibold block">{user.teamName}</span>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button 
                onClick={() => setShowProModal(true)}
                className="bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-gray-950 font-black px-3 py-1.5 rounded-xl text-xs shadow-md shadow-emerald-500/20 transition-all flex items-center space-x-1"
              >
                <span>⚡</span>
                <span className="hidden sm:inline">OFFERTA</span> PRO
              </button>
              
              <button
                onClick={() => setActiveTab('profile')}
                className="bg-gray-800 hover:bg-gray-700 text-gray-200 p-2 rounded-xl border border-gray-700 text-xs flex items-center justify-center w-9 h-9"
                title="Profilo & Account"
              >
                👤
              </button>
            </div>
          </header>

          {/* MAIN CONTENT CONTAINER */}
          <main className="flex-1 p-3 md:p-6 overflow-y-auto pb-24">
            
            {/* ==================== TAB 1: LAVAGNA TATTICA ==================== */}
            {activeTab === 'board' && (
              <div className="space-y-4">
                
                {/* TOOLBAR STRUMENTI LAVAGNA */}
                <div className="bg-gray-900 p-2.5 rounded-2xl border border-gray-800 space-y-2.5 shadow-lg">
                  <div className="grid grid-cols-5 sm:grid-cols-10 gap-1.5 text-xs font-semibold">
                    <button 
                      onClick={() => setTool('move')} 
                      className={`p-2 rounded-xl flex flex-col items-center justify-center transition ${tool === 'move' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-800'}`}
                    >
                      <span className="text-base">👆</span>
                      <span className="text-[10px] mt-0.5">Sposta</span>
                    </button>

                    <button 
                      onClick={() => setTool('player-red')} 
                      className={`p-2 rounded-xl flex flex-col items-center justify-center transition ${tool === 'player-red' ? 'bg-red-500/20 text-red-400 border border-red-500/50' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-800'}`}
                    >
                      <span className="text-base">🔴</span>
                      <span className="text-[10px] mt-0.5">Rosso</span>
                    </button>

                    <button 
                      onClick={() => setTool('player-blue')} 
                      className={`p-2 rounded-xl flex flex-col items-center justify-center transition ${tool === 'player-blue' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/50' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-800'}`}
                    >
                      <span className="text-base">🔵</span>
                      <span className="text-[10px] mt-0.5">Blu</span>
                    </button>

                    <button 
                      onClick={() => setTool('ball')} 
                      className={`p-2 rounded-xl flex flex-col items-center justify-center transition ${tool === 'ball' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/50' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-800'}`}
                    >
                      <span className="text-base">⚽</span>
                      <span className="text-[10px] mt-0.5">Palla</span>
                    </button>

                    <button 
                      onClick={() => setTool('cone')} 
                      className={`p-2 rounded-xl flex flex-col items-center justify-center transition ${tool === 'cone' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/50' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-800'}`}
                    >
                      <span className="text-base">🔶</span>
                      <span className="text-[10px] mt-0.5">Cono</span>
                    </button>

                    <button 
                      onClick={() => setTool('ladder')} 
                      className={`p-2 rounded-xl flex flex-col items-center justify-center transition ${tool === 'ladder' ? 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/50' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-800'}`}
                    >
                      <span className="text-base">🪜</span>
                      <span className="text-[10px] mt-0.5">Scaletta</span>
                    </button>

                    <button 
                      onClick={() => setTool('hurdle')} 
                      className={`p-2 rounded-xl flex flex-col items-center justify-center transition ${tool === 'hurdle' ? 'bg-purple-500/20 text-purple-400 border border-purple-500/50' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-800'}`}
                    >
                      <span className="text-base">🚧</span>
                      <span className="text-[10px] mt-0.5">Ostacolo</span>
                    </button>

                    <button 
                      onClick={() => setTool('arrow-pass')} 
                      className={`p-2 rounded-xl flex flex-col items-center justify-center transition ${tool === 'arrow-pass' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-800'}`}
                    >
                      <span className="text-base">➡️</span>
                      <span className="text-[10px] mt-0.5">Passaggio</span>
                    </button>

                    <button 
                      onClick={() => setTool('arrow-run')} 
                      className={`p-2 rounded-xl flex flex-col items-center justify-center transition ${tool === 'arrow-run' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-800'}`}
                    >
                      <span className="text-base">💨</span>
                      <span className="text-[10px] mt-0.5">Corsa</span>
                    </button>

                    <button 
                      onClick={() => setTool('delete')} 
                      className={`p-2 rounded-xl flex flex-col items-center justify-center transition ${tool === 'delete' ? 'bg-red-900/40 text-red-400 border border-red-500/50' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-800'}`}
                    >
                      <span className="text-base">🧹</span>
                      <span className="text-[10px] mt-0.5">Gomma</span>
                    </button>
                  </div>

                  {/* PROPRIETÀ ELEMENTO & CAMPO */}
                  <div className="flex items-center justify-between pt-2 border-t border-gray-800 text-xs">
                    <div className="flex items-center space-x-3">
                      <div className="flex items-center space-x-1">
                        <span className="text-gray-400 font-medium">N° Maglia:</span>
                        <input 
                          type="text" 
                          value={playerNumberInput}
                          onChange={(e) => setPlayerNumberInput(e.target.value)}
                          className="w-9 bg-gray-950 border border-gray-700 rounded-lg px-1.5 py-1 text-center font-bold text-emerald-400 focus:outline-none focus:border-emerald-500"
                          maxLength="2"
                        />
                      </div>

                      <div className="flex items-center space-x-1">
                        <span className="text-gray-400 font-medium">Vista:</span>
                        <button 
                          onClick={() => setPitchView(pitchView === 'full' ? 'half' : 'full')}
                          className="bg-gray-800 border border-gray-700 px-2 py-1 rounded-lg text-[11px] font-bold text-gray-200"
