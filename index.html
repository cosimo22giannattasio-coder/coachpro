    function CoachProApp() {
      // Auth state
      const [user, setUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [authData, setAuthData] = useState({ name: '', email: '', password: '' });

      // Profile & Language state
      const [showProfileDrawer, setShowProfileDrawer] = useState(false);
      const [profileImage, setProfileImage] = useState(null);
      const [language, setLanguage] = useState('it');

      // Funzione di traduzione reattiva globale
      const t = (key) => {
        return translations[language]?.[key] || translations['it'][key] || key;
      };

      // App state
      const [activeTab, setActiveTab] = useState('board');
      const [tool, setTool] = useState('move');
      const [draggedId, setDraggedId] = useState(null);
      const [elements, setElements] = useState([]);
      const [arrows, setArrows] = useState([]);
      const [isDrawingArrow, setIsDrawingArrow] = useState(false);
      const [currentArrowStart, setCurrentArrowStart] = useState(null);
      const [showPaywallModal, setShowPaywallModal] = useState(false);

      // Club License state
      const [clubCodeInput, setClubCodeInput] = useState('');
      const [clubCodeMsg, setClubCodeMsg] = useState('');

      // Data state
      const [drills, setDrills] = useState([]);
      const [players, setPlayers] = useState([]);
      const [newPlayerName, setNewPlayerName] = useState('');
      const [newPlayerRole, setNewPlayerRole] = useState('Centrocampista');
      
      const [newDrillTitle, setNewDrillTitle] = useState('');
      const [newDrillCat, setNewDrillCat] = useState('Possesso Palla');
      const [newDrillDur, setNewDrillDur] = useState('15 min');
      const [newDrillDesc, setNewDrillDesc] = useState('');

      const svgRef = useRef(null);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setProfileImage(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const checkAccess = () => {
        if (!user) return false;
        if (user.isPro) return true;
        if (user.trialEndsAt && new Date().getTime() < user.trialEndsAt) return true;
        return false;
      };

      const hasAccess = checkAccess();

      const handleAuth = (evt) => {
        evt.preventDefault();
        if (!authData.email) return;
        const displayName = authData.name.trim() ? authData.name.trim() : authData.email.split('@')[0];
        const trialEndTime = new Date().getTime() + (TRIAL_DAYS * 24 * 60 * 60 * 1000);

        setUser({
          name: displayName,
          email: authData.email,
          isPro: false,
          clubCode: null,
          trialEndsAt: authMode === 'register' ? trialEndTime : null
        });
      };

      const handleLogout = () => {
        setUser(null);
        setAuthData({ name: '', email: '', password: '' });
        setProfileImage(null);
      };

      const activateTrial = () => {
        const trialEndTime = new Date().getTime() + (TRIAL_DAYS * 24 * 60 * 60 * 1000);
        setUser({ ...user, trialEndsAt: trialEndTime });
        setShowPaywallModal(false);
      };

      const handleRedeemClubCode = (e) => {
        e.preventDefault();
        if (!clubCodeInput.trim()) return;
        const code = clubCodeInput.trim().toUpperCase();
        if (code.length >= 4) {
          setUser({ ...user, isPro: true, clubCode: code });
          setClubCodeMsg('✅ ' + (language === 'it' ? 'Codice Società riscattato con successo!' : 'Club code redeemed successfully!'));
          setTimeout(() => {
            setShowPaywallModal(false);
            setClubCodeMsg('');
            setClubCodeInput('');
          }, 1500);
        } else {
          setClubCodeMsg('❌ ' + (language === 'it' ? 'Codice non valido.' : 'Invalid code.'));
        }
      };

      const handleShareClubInvite = () => {
        const codeToShare = user?.clubCode || "CP-CLUB-2026";
        const text = `⚽ *COACHPRO - CLUB LICENSE*\n\n🔑 *Code:* ${codeToShare}\n\n1. Open CoachPro\n2. Subscription > Redeem Club Code`;
        const encodedText = encodeURIComponent(text);
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
          window.location.href = `whatsapp://send?text=${encodedText}`;
        } else {
          window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
        }
      };

      const getCoords = (evt) => {
        if (!svgRef.current) return { x: 50, y: 50 };
        const rect = svgRef.current.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        const x = Math.max(5, Math.min(95, ((clientX - rect.left) / rect.width) * 100));
        const y = Math.max(5, Math.min(95, ((clientY - rect.top) / rect.height) * 100));
        return { x, y };
      };

      const handleBoardClick = (evt) => {
        if (!hasAccess) {
          setShowPaywallModal(true);
          return;
        }
        if (draggedId) {
          setDraggedId(null);
          return;
        }
        const { x, y } = getCoords(evt);

        if (tool === 'player-red') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'red', number: (elements.filter(e => e.color === 'red').length + 1).toString(), x, y }]);
        } else if (tool === 'player-blue') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'blue', number: (elements.filter(e => e.color === 'blue').length + 1).toString(), x, y }]);
        } else if (tool === 'ball') {
          setElements([...elements, { id: Date.now().toString(), type: 'ball', x, y }]);
        } else if (tool === 'cone') {
          setElements([...elements, { id: Date.now().toString(), type: 'cone', x, y }]);
        } else if (tool === 'cinesina') {
          setElements([...elements, { id: Date.now().toString(), type: 'cinesina', x, y }]);
        } else if (tool === 'ladder') {
          setElements([...elements, { id: Date.now().toString(), type: 'ladder', x, y }]);
        } else if (tool === 'arrow') {
          if (!isDrawingArrow) {
            setIsDrawingArrow(true);
            setCurrentArrowStart({ x, y });
          } else {
            setArrows([...arrows, { id: Date.now().toString(), startX: currentArrowStart.x, startY: currentArrowStart.y, endX: x, endY: y }]);
            setIsDrawingArrow(false);
            setCurrentArrowStart(null);
          }
        }
      };

      const handleTouchMove = (evt) => {
        if (!hasAccess) return;
        if (!draggedId || tool !== 'move') return;
        const { x, y } = getCoords(evt);
        setElements(elements.map(el => el.id === draggedId ? { ...el, x, y } : el));
      };

      const handleElementClick = (id, evt) => {
        evt.stopPropagation();
        if (!hasAccess) {
          setShowPaywallModal(true);
          return;
        }
        if (tool === 'delete') {
          setElements(elements.filter(el => el.id !== id));
        } else if (tool === 'move') {
          setDraggedId(draggedId === id ? null : id);
        }
      };

      const presetFormation = (type) => {
        if (!hasAccess) {
          setShowPaywallModal(true);
          return;
        }
        let reds = [];
        if (type === '433') {
          reds = [

                    className="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white h-20"
                  ></textarea>
                  <button type="submit" className="w-full bg-emerald-500 text-gray-950 font-bold py-2 rounded-xl text-xs">{t('saveDrill')}</button>
                </form>

                {drills.length === 0 ? (
                  <div className="text-center py-8 text-gray-500 text-xs">{t('noDrills')}</div>
                ) : (
                  drills.map(drill => (
                    <div key={drill.id} className="bg-gray-900 border border-gray-800 p-4 rounded-2xl space-y-2">
                      <div className="flex justify-between items-start">
                        <h4 className="font-bold text-sm text-white">{drill.title}</h4>
                        <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold px-2 py-0.5 rounded-full">{drill.category}</span>
                      </div>
                      <p className="text-xs text-gray-400">{drill.description}</p>
                      <div className="flex items-center justify-between pt-2 border-t border-gray-800 text-xs">
                        <span className="text-gray-500 font-medium">⏱️ {drill.duration}</span>
                        <button
                          onClick={() => handleShareWhatsApp(drill)}
                          className="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center space-x-1"
                        >
                          📲 {t('shareWhatsapp')}
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* TAB 3: ROSA */}
            {activeTab === 'squad' && (
              <div className="space-y-4">
                <form onSubmit={addPlayer} className="bg-gray-900 border border-gray-800 p-4 rounded-2xl flex space-x-2">
                  <input
                    type="text"
                    placeholder={t('playerPlaceholder')}
                    value={newPlayerName}
                    onChange={(ev) => setNewPlayerName(ev.target.value)}
                    className="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white"
                  />
                  <select
                    value={newPlayerRole}
                    onChange={(ev) => setNewPlayerRole(ev.target.value)}
                    className="bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white"
                  >
                    <option value="Portiere">{t('roleGoalkeeper')}</option>
                    <option value="Difensore">{t('roleDefender')}</option>
                    <option value="Centrocampista">{t('roleMidfielder')}</option>
                    <option value="Attaccante">{t('roleForward')}</option>
                  </select>
                  <button type="submit" className="bg-emerald-500 text-gray-950 font-bold px-4 py-2 rounded-xl text-xs">{t('addPlayer')}</button>
                </form>

                {players.length === 0 ? (
                  <div className="text-center py-8 text-gray-500 text-xs">{t('noPlayers')}</div>
                ) : (
                  <div className="bg-gray-900 border border-gray-800 rounded-2xl divide-y divide-gray-800">
                    {players.map(player => (
                      <div key={player.id} className="p-3 flex items-center justify-between">
                        <div>
                          <p className="font-semibold text-xs text-white">{player.name}</p>
                          <p className="text-[10px] text-gray-400">{player.role}</p>
                        </div>
                        <button
                          onClick={() => togglePlayerStatus(player.id)}
                          className={`px-3 py-1 rounded-lg text-xs font-bold ${
                            player.status === 'presente' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' :
                            player.status === 'assente' ? 'bg-red-500/20 text-red-400 border border-red-500/40' :
                            'bg-amber-500/20 text-amber-400 border border-amber-500/40'
                          }`}
                        >
                          {player.status === 'presente' ? t('statusPresent') : player.status === 'assente' ? t('statusAbsent') : t('statusInjured')}
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* MODALE PAYWALL */}
          {showPaywallModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-800 rounded-3xl p-6 max-w-sm w-full space-y-4 text-center shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button
                  onClick={() => setShowPaywallModal(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white font-bold text-sm"
                >
                  ✕
                </button>
                <div className="w-12 h-12 bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-xl">⭐</div>
                <h3 className="text-xl font-black text-white">{t('paywallHeader')}</h3>
                <p className="text-xs text-gray-300">{t('paywallDesc')}</p>
                
                <div className="space-y-2.5 pt-2">
                  <button
                    onClick={() => window.open(STRIPE_PAYMENT_LINK, '_blank')}
                    className="w-full bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold py-3 rounded-xl text-xs shadow-lg"
                  >
                    {t('indProBtn')}
                  </button>

                  <button
                    onClick={() => window.open(STRIPE_CLUB_PAYMENT_LINK, '_blank')}
                    className="w-full bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg border border-emerald-400/30 flex flex-col items-center justify-center space-y-0.5"
                  >
                    <span>🛡️ {t('clubBtn')}</span>
                    <span className="text-[10px] text-emerald-200 font-semibold">{t('clubSubBtn')}</span>
                  </button>

                  <div className="bg-gray-950/80 border border-gray-800 rounded-2xl p-3 space-y-2 text-left mt-3">
                    <label className="text-[11px] font-bold text-gray-300 block">{t('haveClubCode')}</label>
                    <form onSubmit={handleRedeemClubCode} className="flex space-x-2">
                      <input
                        type="text"
                        placeholder="es. CLUB2026"
                        value={clubCodeInput}
                        onChange={(e) => setClubCodeInput(e.target.value)}
                        className="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-white uppercase font-mono"
                      />
                      <button
                        type="submit"
                        className="bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold px-3 py-1.5 rounded-xl text-xs"
                      >
                        {t('activate')}
                      </button>
                    </form>
                    {clubCodeMsg && <p className="text-[10px] font-semibold text-emerald-400">{clubCodeMsg}</p>}
                  </div>

                  {!user.trialEndsAt && (
                    <button
                      onClick={activateTrial}
                      className="w-full bg-gray-800 hover:bg-gray-700 text-emerald-400 font-semibold py-2 rounded-xl text-xs border border-emerald-500/30"
                    >
                      {t('trialBtn')}
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM BAR */}
          <nav className="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-md border-t border-gray-800 px-6 py-2 flex justify-around items-center z-40">
            <button
              onClick={() => setActiveTab('board')}
              className={`flex flex-col items-center space-y-1 ${activeTab === 'board' ? 'text-emerald-400' : 'text-gray-400'}`}
            >
              <span className="text-xl">⚽</span>
              <span className="text-[10px] font-bold">{t('navBoard')}</span>
            </button>
            <button
              onClick={() => setActiveTab('drills')}
              className={`flex flex-col items-center space-y-1 ${activeTab === 'drills' ? 'text-emerald-400' : 'text-gray-400'}`}
            >
              <span className="text-xl">📋</span>
              <span className="text-[10px] font-bold">{t('navDrills')}</span>
            </button>
            <button
              onClick={() => setActiveTab('squad')}
              className={`flex flex-col items-center space-y-1 ${activeTab === 'squad' ? 'text-emerald-400' : 'text-gray-400'}`}
            >
              <span className="text-xl">👥</span>
              <span className="text-[10px] font-bold">{t('navSquad')}</span>
            </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(default = document.getElementById('root')); // Correggiamo con la sintassi corretta standard
    root.render(<CoachProApp />);
  </script>
</body>
</html>
