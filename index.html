<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CoachPro - Lavagna & Session Planner</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .pitch-bg {
      background-color: #15803d;
      background-image: repeating-linear-gradient(0deg, #15803d, #15803d 40px, #166534 40px, #166534 80px);
    }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans antialiased selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script>
    const e = React.createElement;
    const useState = React.useState;
    const useRef = React.useRef;

    const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/tua_pagina_stripe";

    function CoachProApp() {
      // Auth state
      const [user, setUser] = useState(null); // null = non autenticato
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
      const [authData, setAuthData] = useState({ name: '', email: '', password: '' });

      // App state
      const [activeTab, setActiveTab] = useState('board');
      const [tool, setTool] = useState('move');
      const [draggedId, setDraggedId] = useState(null);
      const [elements, setElements] = useState([]);
      const [arrows, setArrows] = useState([]);
      const [isDrawingArrow, setIsDrawingArrow] = useState(false);
      const [currentArrowStart, setCurrentArrowStart] = useState(null);

      // Data state (inizialmente vuoto per nuovi utenti)
      const [drills, setDrills] = useState([]);
      const [players, setPlayers] = useState([]);
      const [newPlayerName, setNewPlayerName] = useState('');
      const [newPlayerRole, setNewPlayerRole] = useState('Centrocampista');
      
      const [newDrillTitle, setNewDrillTitle] = useState('');
      const [newDrillCat, setNewDrillCat] = useState('Possesso Palla');
      const [newDrillDur, setNewDrillDur] = useState('15 min');
      const [newDrillDesc, setNewDrillDesc] = useState('');

      const svgRef = useRef(null);

      // Login / Registrazione Handlers
      const handleAuth = (evt) => {
        evt.preventDefault();
        if (!authData.email) return;
        const displayName = authData.name.trim() ? authData.name.trim() : authData.email.split('@')[0];
        setUser({
          name: displayName,
          email: authData.email,
          isPro: false
        });
      };

      const handleLogout = () => {
        setUser(null);
        setAuthData({ name: '', email: '', password: '' });
      };

      // Coordinate converter
      const getCoords = (evt) => {
        if (!svgRef.current) return { x: 50, y: 50 };
        const rect = svgRef.current.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        const x = Math.max(5, Math.min(95, ((clientX - rect.left) / rect.width) * 100));
        const y = Math.max(5, Math.min(95, ((clientY - rect.top) / rect.height) * 100));
        return { x, y };
      };

      const handleBoardClick = (evt) => {
        if (draggedId) {
          setDraggedId(null);
          return;
        }
        const { x, y } = getCoords(evt);

        if (tool === 'player-red') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'red', number: (elements.filter(e => e.color === 'red').length + 1).toString(), x, y }]);
        } else if (tool === 'player-blue') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'blue', number: (elements.filter(e => e.color === 'blue').length + 1).toString(), x, y }]);
        } else if (tool === 'ball') {
          setElements([...elements, { id: Date.now().toString(), type: 'ball', x, y }]);
        } else if (tool === 'cone') {
          setElements([...elements, { id: Date.now().toString(), type: 'cone', x, y }]);
        } else if (tool === 'arrow') {
          if (!isDrawingArrow) {
            setIsDrawingArrow(true);
            setCurrentArrowStart({ x, y });
          } else {
            setArrows([...arrows, { id: Date.now().toString(), startX: currentArrowStart.x, startY: currentArrowStart.y, endX: x, endY: y }]);
            setIsDrawingArrow(false);
            setCurrentArrowStart(null);
          }
        }
      };

      const handleTouchMove = (evt) => {
        if (!draggedId || tool !== 'move') return;
        const { x, y } = getCoords(evt);
        setElements(elements.map(el => el.id === draggedId ? { ...el, x, y } : el));
      };

      const handleElementClick = (id, evt) => {
        evt.stopPropagation();
        if (tool === 'delete') {
          setElements(elements.filter(el => el.id !== id));
        } else if (tool === 'move') {
          setDraggedId(draggedId === id ? null : id);
        }
      };

      const presetFormation = (type) => {
        let reds = [];
        if (type === '433') {
          reds = [
            { id: 'r1', type: 'player', color: 'red', number: '1', x: 50, y: 88 },
            { id: 'r2', type: 'player', color: 'red', number: '2', x: 15, y: 70 },
            { id: 'r3', type: 'player', color: 'red', number: '5', x: 38, y: 75 },
            { id: 'r4', type: 'player', color: 'red', number: '6', x: 62, y: 75 },
            { id: 'r5', type: 'player', color: 'red', number: '3', x: 85, y: 70 },
            { id: 'r6', type: 'player', color: 'red', number: '4', x: 50, y: 60 },
            { id: 'r7', type: 'player', color: 'red', number: '8', x: 30, y: 50 },
            { id: 'r8', type: 'player', color: 'red', number: '10', x: 70, y: 50 },
            { id: 'r9', type: 'player', color: 'red', number: '7', x: 15, y: 30 },
            { id: 'r10', type: 'player', color: 'red', number: '9', x: 50, y: 25 },
            { id: 'r11', type: 'player', color: 'red', number: '11', x: 85, y: 30 }
          ];
        } else if (type === '442') {
          reds = [
            { id: 'r1', type: 'player', color: 'red', number: '1', x: 50, y: 88 },
            { id: 'r2', type: 'player', color: 'red', number: '2', x: 15, y: 70 },
            { id: 'r3', type: 'player', color: 'red', number: '5', x: 38, y: 75 },
            { id: 'r4', type: 'player', color: 'red', number: '6', x: 62, y: 75 },
            { id: 'r5', type: 'player', color: 'red', number: '3', x: 85, y: 70 },
            { id: 'r6', type: 'player', color: 'red', number: '7', x: 15, y: 50 },
            { id: 'r7', type: 'player', color: 'red', number: '4', x: 38, y: 52 },
            { id: 'r8', type: 'player', color: 'red', number: '8', x: 62, y: 52 },
            { id: 'r9', type: 'player', color: 'red', number: '11', x: 85, y: 50 },
            { id: 'r10', type: 'player', color: 'red', number: '9', x: 38, y: 28 },
            { id: 'r11', type: 'player', color: 'red', number: '10', x: 62, y: 28 }
          ];
        }
        setElements([...reds, { id: 'b1', type: 'ball', x: 50, y: 50 }]);
        setArrows([]);
      };

      const handleShareWhatsApp = (drill) => {
        const text = `⚽ *COACHPRO - SCHEDA ESERCIZIO*\n\n📌 *Titolo:* ${drill.title}\n⏱️ *Durata:* ${drill.duration}\n📂 *Categoria:* ${drill.category}\n\n📝 *Descrizione:*\n${drill.description}\n\n_Inviato tramite CoachPro App_`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      };

      const addDrill = (evt) => {
        evt.preventDefault();
        if (!newDrillTitle) return;
        setDrills([...drills, {
          id: Date.now().toString(),
          title: newDrillTitle,
          category: newDrillCat,
          duration: newDrillDur,
          description: newDrillDesc
        }]);
        setNewDrillTitle('');
        setNewDrillDesc('');
      };

      const addPlayer = (evt) => {
        evt.preventDefault();
        if (!newPlayerName) return;
        setPlayers([...players, {
          id: Date.now().toString(),
          name: newPlayerName,
          role: newPlayerRole,
          status: 'presente'
        }]);
        setNewPlayerName('');
      };

      const togglePlayerStatus = (id) => {
        setPlayers(players.map(p => {
          if (p.id !== id) return p;
          const nextStatus = p.status === 'presente' ? 'assente' : p.status === 'assente' ? 'infortunato' : 'presente';
          return { ...p, status: nextStatus };
        }));
      };

      // SCHERMATA LOGIN SE L'UTENTE NON È AUTENTICATO
      if (!user) {
        return e('div', { className: 'min-h-screen bg-gray-950 flex items-center justify-center p-4' },
          e('div', { className: 'w-full max-w-md bg-gray-900 border border-gray-800 rounded-3xl p-6 space-y-6 shadow-2xl' },
            e('div', { className: 'text-center space-y-2' },
              e('div', { className: 'w-16 h-16 bg-emerald-500 text-gray-950 rounded-2xl font-black text-2xl flex items-center justify-center mx-auto shadow-lg shadow-emerald-500/20' }, 'CP'),
              e('h1', { className: 'text-2xl font-black text-white tracking-tight' }, 'CoachPro'),
              e('p', { className: 'text-xs text-gray-400' }, 'Piattaforma tattica professionale per allenatori')
            ),
            e('form', { onSubmit: handleAuth, className: 'space-y-4' },
              authMode === 'register' && e('div', { className: 'space-y-1' },
                e('label', { className: 'text-xs font-semibold text-gray-300' }, 'Nome & Cognome / Titolo'),
                e('input', {
                  type: 'text',
                  placeholder: 'es. Mister Rossi',
                  value: authData.name,
                  onChange: (ev) => setAuthData({ ...authData, name: ev.target.value }),
                  className: 'w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500'
                })
              ),
              e('div', { className: 'space-y-1' },
                e('label', { className: 'text-xs font-semibold text-gray-300' }, 'Email'),
                e('input', {
                  type: 'email',
                  required: true,
                  placeholder: 'allenatore@email.com',
                  value: authData.email,
                  onChange: (ev) => setAuthData({ ...authData, email: ev.target.value }),
                  className: 'w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500'
                })
              ),
              e('div', { className: 'space-y-1' },
                e('label', { className: 'text-xs font-semibold text-gray-300' }, 'Password'),
                e('input', {
                  type: 'password',
                  required: true,
                  placeholder: '••••••••',
                  value: authData.password,
                  onChange: (ev) => setAuthData({ ...authData, password: ev.target.value }),
                  className: 'w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500'
                })
              ),
              e('button', {
                type: 'submit',
                className: 'w-full bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold py-3 rounded-xl transition duration-200 text-sm shadow-lg shadow-emerald-500/20'
              }, authMode === 'login' ? 'Accedi a CoachPro' : 'Crea Account Allenatore')
            ),
            e('div', { className: 'text-center border-t border-gray-800 pt-4' },
              e('button', {
                onClick: () => setAuthMode(authMode === 'login' ? 'register' : 'login'),
                className: 'text-xs text-emerald-400 font-semibold hover:underline'
              }, authMode === 'login' ? 'Non hai un account? Registrati ora' : 'Hai già un account? Accedi')
            )
          )
        );
      }

      // APP PRINCIPALE AUTENTICATA
      return e('div', { className: 'min-h-screen bg-gray-950 text-gray-100 flex flex-col pb-24' },
        // HEADER
        e('header', { className: 'bg-gray-900 border-b border-gray-800 px-4 py-3 flex items-center justify-between sticky top-0 z-40' },
          e('div', { className: 'flex items-center space-x-3' },
            e('div', { className: 'bg-emerald-500 text-gray-950 p-2 rounded-xl font-black text-base' }, 'CP'),
            e('div', null,
              e('h1', { className: 'font-bold text-sm leading-none text-white' }, user.name),
              e('span', { className: 'text-[10px] text-emerald-400 font-medium' }, 'CoachPro Workspace')
            )
          ),
          e('div', { className: 'flex items-center space-x-2' },
            e('button', {
              onClick: () => window.open(STRIPE_PAYMENT_LINK, '_blank'),
              className: 'bg-gradient-to-r from-emerald-500 to-teal-400 text-gray-950 font-extrabold px-3 py-1.5 rounded-lg text-xs shadow-md'
            }, 'PRO 29,99€/anno'),
            e('button', {
              onClick: handleLogout,
              className: 'bg-gray-800 hover:bg-gray-700 text-gray-400 px-2.5 py-1.5 rounded-lg text-xs font-semibold'
            }, 'Esci')
          )
        ),

        // MAIN CONTENT
        e('main', { className: 'flex-1 p-4 max-w-4xl mx-auto w-full space-y-4' },

          // TAB 1: LAVAGNA TATTICA
          activeTab === 'board' && e('div', { className: 'space-y-4' },
            // Controlli veloci formazioni
            e('div', { className: 'flex items-center justify-between bg-gray-900 p-2.5 rounded-2xl border border-gray-800 text-xs' },
              e('span', { className: 'text-gray-400 font-medium text-[11px]' }, 'Moduli rapidi:'),
              e('div', { className: 'flex space-x-2' },
                e('button', { onClick: () => presetFormation('433'), className: 'bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded-lg text-emerald-400 font-bold' }, '4-3-3'),
                e('button', { onClick: () => presetFormation('442'), className: 'bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded-lg text-emerald-400 font-bold' }, '4-4-2')
              )
            ),

            // Toolbar strumenti
            e('div', { className: 'bg-gray-900 p-2.5 rounded-2xl border border-gray-800 grid grid-cols-4 gap-2 text-xs' },
              e('button', { onClick: () => setTool('move'), className: `p-2 rounded-xl font-semibold text-center ${tool === 'move' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-gray-800 text-gray-300'}` }, '👆 Sposta'),
              e('button', { onClick: () => setTool('player-red'), className: `p-2 rounded-xl font-semibold text-center ${tool === 'player-red' ? 'bg-red-500/20 text-red-400 border border-red-500/50' : 'bg-gray-800 text-gray-300'}` }, '🔴 Rosso'),
              e('button', { onClick: () => setTool('player-blue'), className: `p-2 rounded-xl font-semibold text-center ${tool === 'player-blue' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/50' : 'bg-gray-800 text-gray-300'}` }, '🔵 Blu'),
              e('button', { onClick: () => setTool('ball'), className: `p-2 rounded-xl font-semibold text-center ${tool === 'ball' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/50' : 'bg-gray-800 text-gray-300'}` }, '⚽ Palla'),
              e('button', { onClick: () => setTool('cone'), className: `p-2 rounded-xl font-semibold text-center ${tool === 'cone' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/50' : 'bg-gray-800 text-gray-300'}` }, '🔶 Cono'),
              e('button', { onClick: () => setTool('arrow'), className: `p-2 rounded-xl font-semibold text-center ${tool === 'arrow' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-gray-800 text-gray-300'}` }, '↗️ Freccia'),
              e('button', { onClick: () => setTool('delete'), className: `p-2 rounded-xl font-semibold text-center ${tool === 'delete' ? 'bg-red-500/20 text-red-400 border border-red-500/50' : 'bg-gray-800 text-gray-300'}` }, '❌ Gomma'),
              e('button', { onClick: () => { setElements([]); setArrows([]); }, className: 'p-2 rounded-xl font-semibold text-center bg-red-950/60 text-red-300 border border-red-900/50' }, '🗑️ Pulisci')
            ),

            // Campo da gioco SVG
            e('div', { className: 'relative w-full aspect-[4/3] pitch-bg rounded-3xl overflow-hidden shadow-2xl border-4 border-gray-800' },
              e('svg', {
                ref: svgRef,
                className: 'w-full h-full cursor-pointer touch-none',
                onClick: handleBoardClick,
                onTouchMove: handleTouchMove
              },
                // Segnature Campo
                e('rect', { x: '5%', y: '5%', width: '90%', height: '90%', fill: 'none', stroke: 'white', strokeWidth: '2', strokeOpacity: '0.7' }),
                e('line', { x1: '5%', y1: '50%', x2: '95%', y2: '50%', stroke: 'white', strokeWidth: '2', strokeOpacity: '0.7' }),
                e('circle', { cx: '50%', cy: '50%', r: '15%', fill: 'none', stroke: 'white', strokeWidth: '2', strokeOpacity: '0.7' }),
                e('rect', { x: '25%', y: '5%', width: '50%', height: '18%', fill: 'none', stroke: 'white', strokeWidth: '2', strokeOpacity: '0.7' }),
                e('rect', { x: '25%', y: '77%', width: '50%', height: '18%', fill: 'none', stroke: 'white', strokeWidth: '2', strokeOpacity: '0.7' }),

                // Render Frecce
                arrows.map(arr => e('line', {
                  key: arr.id,
                  x1: `${arr.startX}%`,
                  y1: `${arr.startY}%`,
                  x2: `${arr.endX}%`,
                  y2: `${arr.endY}%`,
                  stroke: '#34d399',
                  strokeWidth: '4',
                  strokeDasharray: '6,6'
                })),

                // Render Elementi (Giocatori, Palla, Coni)
                elements.map(el => e('g', {
                  key: el.id,
                  onClick: (evt) => handleElementClick(el.id, evt),
                  className: 'cursor-pointer'
                },
                  el.type === 'player' && e('circle', {
                    cx: `${el.x}%`,
                    cy: `${el.y}%`,
                    r: '14',
                    fill: el.color === 'red' ? '#ef4444' : '#3b82f6',
                    stroke: 'white',
                    strokeWidth: '2.5'
                  }),
                  el.type === 'player' && e('text', {
                    x: `${el.x}%`,
                    y: `${el.y}%`,
                    dy: '4',
                    textAnchor: 'middle',
                    fill: 'white',
                    fontSize: '11',
                    fontWeight: 'bold'
                  }, el.number),
                  el.type === 'ball' && e('circle', {
                    cx: `${el.x}%`,
                    cy: `${el.y}%`,
                    r: '7',
                    fill: 'white',
                    stroke: 'black',
                    strokeWidth: '2'
                  }),
                  el.type === 'cone' && e('polygon', {
                    points: `${el.x}%,${el.y - 2.5}% ${el.x - 2}%,${el.y + 2}% ${el.x + 2}%,${el.y + 2}%`,
                    fill: '#f97316'
                  })
                ))
              )
            )
          ),

          // TAB 2: ARCHIVIO ESERCIZI
          activeTab === 'drills' && e('div', { className: 'space-y-4' },
            e('form', { onSubmit: addDrill, className: 'bg-gray-900 border border-gray-800 p-4 rounded-2xl space-y-3' },
              e('h3', { className: 'text-sm font-bold text-white' }, 'Nuovo Esercizio'),
              e('input', {
                type: 'text',
                placeholder: 'Titolo esercitazione...',
                value: newDrillTitle,
                onChange: (ev) => setNewDrillTitle(ev.target.value),
                className: 'w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white'
              }),
              e('div', { className: 'grid grid-cols-2 gap-2' },
                e('select', {
                  value: newDrillCat,
                  onChange: (ev) => setNewDrillCat(ev.target.value),
                  className: 'bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white'
                },
                  e('option', { value: 'Possesso Palla' }, 'Possesso Palla'),
                  e('option', { value: 'Tattica' }, 'Tattica'),
                  e('option', { value: 'Atletico' }, 'Atletico'),
                  e('option', { value: 'Rifinitura' }, 'Rifinitura')
                ),
                e('input', {
                  type: 'text',
                  placeholder: 'Durata (es. 15 min)',
                  value: newDrillDur,
                  onChange: (ev) => setNewDrillDur(ev.target.value),
                  className: 'bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white'
                })
              ),
              e('textarea', {
                placeholder: 'Descrizione ed obbiettivi...',
                value: newDrillDesc,
                onChange: (ev) => setNewDrillDesc(ev.target.value),
                className: 'w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white h-20'
              }),
              e('button', { type: 'submit', className: 'w-full bg-emerald-500 text-gray-950 font-bold py-2 rounded-xl text-xs' }, '+ Salva Esercizio')
            ),

            drills.length === 0 ? e('div', { className: 'text-center py-8 text-gray-500 text-xs' }, 'Nessun esercizio salvato. Creane uno sopra!') :
            drills.map(drill => e('div', { key: drill.id, className: 'bg-gray-900 border border-gray-800 p-4 rounded-2xl space-y-2' },
              e('div', { className: 'flex justify-between items-start' },
                e('h4', { className: 'font-bold text-sm text-white' }, drill.title),
                e('span', { className: 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold px-2 py-0.5 rounded-full' }, drill.category)
              ),
              e('p', { className: 'text-xs text-gray-400' }, drill.description),
              e('div', { className: 'flex items-center justify-between pt-2 border-t border-gray-800 text-xs' },
                e('span', { className: 'text-gray-500 font-medium' }, `⏱️ ${drill.duration}`),
                e('button', {
                  onClick: () => handleShareWhatsApp(drill),
                  className: 'bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center space-x-1'
                }, '📲 Condividi WhatsApp')
              )
            ))
          ),

          // TAB 3: ROSA E PRESENZE
          activeTab === 'squad' && e('div', { className: 'space-y-4' },
            e('form', { onSubmit: addPlayer, className: 'bg-gray-900 border border-gray-800 p-4 rounded-2xl flex space-x-2' },
              e('input', {
                type: 'text',
                placeholder: 'Nome giocatore...',
                value: newPlayerName,
                onChange: (ev) => setNewPlayerName(ev.target.value),
                className: 'flex-1 bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white'
              }),
              e('select', {
                value: newPlayerRole,
                onChange: (ev) => setNewPlayerRole(ev.target.value),
                className: 'bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white'
              },
                e('option', { value: 'Portiere' }, 'Portiere'),
                e('option', { value: 'Difensore' }, 'Difensore'),
                e('option', { value: 'Centrocampista' }, 'Centrocampista'),
                e('option', { value: 'Attaccante' }, 'Attaccante')
              ),
              e('button', { type: 'submit', className: 'bg-emerald-500 text-gray-950 font-bold px-4 py-2 rounded-xl text-xs' }, 'Aggiungi')
            ),

            players.length === 0 ? e('div', { className: 'text-center py-8 text-gray-500 text-xs' }, 'Nessun giocatore in rosa. Aggiungi il primo sopra!') :
            e('div', { className: 'bg-gray-900 border border-gray-800 rounded-2xl divide-y divide-gray-800' },
              players.map(player => e('div', { key: player.id, className: 'p-3 flex items-center justify-between' },
                e('div', null,
                  e('p', { className: 'font-semibold text-xs text-white' }, player.name),
                  e('p', { className: 'text-[10px] text-gray-400' }, player.role)
                ),
                e('button', {
                  onClick: () => togglePlayerStatus(player.id),
                  className: `px-3 py-1 rounded-lg text-xs font-bold ${
                    player.status === 'presente' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' :
                    player.status === 'assente' ? 'bg-red-500/20 text-red-400 border border-red-500/40' :
                    'bg-amber-500/20 text-amber-400 border border-amber-500/40'
                  }`
                }, player.status.toUpperCase())
              ))
            )
          )
        ),

        // BOTTOM NAVIGATION BAR
        e('nav', { className: 'fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-md border-t border-gray-800 px-6 py-2 flex justify-around items-center z-40' },
          e('button', {
            onClick: () => setActiveTab('board'),
            className: `flex flex-col items-center space-y-1 ${activeTab === 'board' ? 'text-emerald-400' : 'text-gray-400'}`
          },
            e('span', { className: 'text-xl' }, '⚽'),
            e('span', { className: 'text-[10px] font-bold' }, 'Lavagna')
          ),
          e('button', {
            onClick: () => setActiveTab('drills'),
            className: `flex flex-col items-center space-y-1 ${activeTab === 'drills' ? 'text-emerald-400' : 'text-gray-400'}`
          },
            e('span', { className: 'text-xl' }, '📋'),
            e('span', { className: 'text-[10px] font-bold' }, 'Esercizi')
          ),
          e('button', {
            onClick: () => setActiveTab('squad'),
            className: `flex flex-col items-center space-y-1 ${activeTab === 'squad' ? 'text-emerald-400' : 'text-gray-400'}`
          },
            e('span', { className: 'text-xl' }, '👥'),
            e('span', { className: 'text-[10px] font-bold' }, 'Rosa')
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(CoachProApp));
  </script>
</body>
</html>
