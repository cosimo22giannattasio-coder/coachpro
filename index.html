    function CoachProApp() {
      const [user, setUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [authData, setAuthData] = useState({ name: '', email: '', password: '' });

      const [showProfileDrawer, setShowProfileDrawer] = useState(false);
      const [profileImage, setProfileImage] = useState(null);
      const [language, setLanguage] = useState('it');
      const [showBoardPdfModal, setShowBoardPdfModal] = useState(false);

      const t = (key) => {
        return translations[language][key] || translations['it'][key] || key;
      };

      const [activeTab, setActiveTab] = useState('board');
      const [tool, setTool] = useState('move');
      const [draggedId, setDraggedId] = useState(null);
      const [elements, setElements] = useState([]);
      const [arrows, setArrows] = useState([]);
      const [isDrawingArrow, setIsDrawingArrow] = useState(false);
      const [currentArrowStart, setCurrentArrowStart] = useState(null);
      const [showPaywallModal, setShowPaywallModal] = useState(false);

      // Stati per la modifica del nome direttamente in campo
      const [editingPlayerId, setEditingPlayerId] = useState(null);
      const [tempPlayerName, setTempPlayerName] = useState('');

      const [clubCodeInput, setClubCodeInput] = useState('');
      const [clubCodeMsg, setClubCodeMsg] = useState('');

      const [drills, setDrills] = useState([]);
      const [players, setPlayers] = useState([]);
      const [newPlayerName, setNewPlayerName] = useState('');
      const [newPlayerNumber, setNewPlayerNumber] = useState('');
      const [newPlayerRole, setNewPlayerRole] = useState('Centrocampista');
      
      const [newDrillTitle, setNewDrillTitle] = useState('');
      const [newDrillCat, setNewDrillCat] = useState('Possesso Palla');
      const [newDrillDur, setNewDrillDur] = useState('15 min');
      const [newDrillDesc, setNewDrillDesc] = useState('');

      const svgRef = useRef(null);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setProfileImage(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const checkAccess = () => {
        return true;
      };

      const hasAccess = checkAccess();

      const handleAuth = (evt) => {
        evt.preventDefault();
        if (!authData.email) return;
        const displayName = authData.name.trim() ? authData.name.trim() : authData.email.split('@')[0];
        const trialEndTime = new Date().getTime() + (TRIAL_DAYS * 24 * 60 * 60 * 1000);

        setUser({
          name: displayName,
          email: authData.email,
          isPro: false,
          clubCode: null,
          trialEndsAt: authMode === 'register' ? trialEndTime : null
        });
      };

      const handleLogout = () => {
        setUser(null);
        setAuthData({ name: '', email: '', password: '' });
        setProfileImage(null);
      };

      const activateTrial = () => {
        const trialEndTime = new Date().getTime() + (TRIAL_DAYS * 24 * 60 * 60 * 1000);
        setUser({ ...user, trialEndsAt: trialEndTime });
        setShowPaywallModal(false);
      };

      const handleRedeemClubCode = (e) => {
        e.preventDefault();
        if (!clubCodeInput.trim()) return;
        
        const code = clubCodeInput.trim().toUpperCase();
        if (code.length >= 4) {
          setUser({
            ...user,
            isPro: true,
            clubCode: code
          });
          setClubCodeMsg('✅ ' + (language === 'it' ? 'Codice Società riscattato con successo!' : 'Club code redeemed successfully!'));
          setTimeout(() => {
            setShowPaywallModal(false);
            setClubCodeMsg('');
            setClubCodeInput('');
          }, 1500);
        } else {
          setClubCodeMsg('❌ ' + (language === 'it' ? 'Codice non valido.' : 'Invalid code.'));
        }
      };

      const handleShareClubInvite = () => {
        const codeToShare = user?.clubCode || "CP-CLUB-2026";
        const text = `⚽ *COACHPRO - LICENZA SOCIETÀ*\n\n🔑 *Codice:* ${codeToShare}\n\n1. Open CoachPro\n2. Subscription > Redeem Club Code`;
        const encodedText = encodeURIComponent(text);
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
          window.location.href = `whatsapp://send?text=${encodedText}`;
        } else {
          window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
        }
      };

      const addPlayer = (e) => {
        e.preventDefault();
        if (!newPlayerName.trim()) return;
        
        const squadPlayer = {
          id: Date.now().toString(),
          name: newPlayerName.trim(),
          number: newPlayerNumber || '1',
          role: newPlayerRole || 'Centrocampista',
          status: 'presente'
        };

        setPlayers([...players, squadPlayer]);
        setNewPlayerName('');
        setNewPlayerNumber('');
      };

      const togglePlayerStatus = (id) => {
        setPlayers(players.map(p => {
          if (p.id === id) {
            const nextStatus = p.status === 'presente' ? 'assente' : p.status === 'assente' ? 'infortunato' : 'presente';
            return { ...p, status: nextStatus };
          }
          return p;
        }));
      };

      const removePlayer = (id) => {
        setPlayers(players.filter(p => p.id !== id));
      };

      const addDrill = (e) => {
        e.preventDefault();
        if (!newDrillTitle.trim()) return;
        setDrills([...drills, { id: Date.now().toString(), title: newDrillTitle.trim(), category: newDrillCat, duration: newDrillDur, description: newDrillDesc }]);
        setNewDrillTitle('');
        setNewDrillDesc('');
      };

      const removeDrill = (id) => {
        setDrills(drills.filter(d => d.id !== id));
      };

      // Funzione Esportazione PDF Lavagna collegata al modale di anteprima
      const handleExportBoardPDF = () => {
        if (!hasAccess) {
          setShowPaywallModal(true);
          return;
        }
        setShowBoardPdfModal(true);
      };

      const presetFormation = (type) => {
        if (!hasAccess) {
          setShowPaywallModal(true);
          return;
        }
        let formationElements = [];
        formationElements.push({ id: 'p1', type: 'player', color: 'red', number: '1', name: 'Portiere', x: 50, y: 90 });

        if (type === '433') {
          formationElements.push(
            { id: 'p2', type: 'player', color: 'red', number: '2', name: 'Ter. Dx', x: 20, y: 70 },
            { id: 'p3', type: 'player', color: 'red', number: '5', name: 'Dif. Cen', x: 40, y: 75 },
            { id: 'p4', type: 'player', color: 'red', number: '6', name: 'Dif. Cen', x: 60, y: 75 },
            { id: 'p5', type: 'player', color: 'red', number: '3', name: 'Ter. Sx', x: 80, y: 70 },
            { id: 'p6', type: 'player', color: 'red', number: '8', name: 'Mediano', x: 35, y: 50 },
            { id: 'p7', type: 'player', color: 'red', number: '4', name: 'Regista', x: 50, y: 55 },
            { id: 'p8', type: 'player', color: 'red', number: '10', name: 'Mezzala', x: 65, y: 50 },

            { id: 'p10', type: 'player', color: 'red', number: '9', name: 'Punta', x: 50, y: 20 },

        } else if (type === '442') {
          formationElements.push(
            { id: 'p2', type: 'player', color: 'red', number: '2', name: 'Ter. Dx', x: 20, y: 70 },
            { id: 'p3', type: 'player', color: 'red', number: '5', name: 'Dif. Cen', x: 40, y: 75 },
            { id: 'p4', type: 'player', color: 'red', number: '6', name: 'Dif. Cen', x: 60, y: 75 },
            { id: 'p5', type: 'player', color: 'red', number: '3', name: 'Ter. Sx', x: 80, y: 70 },
            { id: 'p6', type: 'player', color: 'red', number: '7', name: 'Est. Dx', x: 20, y: 45 },
            { id: 'p7', type: 'player', color: 'red', number: '4', name: 'Centr.', x: 40, y: 50 },
            { id: 'p8', type: 'player', color: 'red', number: '8', name: 'Centr.', x: 60, y: 50 },
            { id: 'p9', type: 'player', color: 'red', number: '11', name: 'Est. Sx', x: 80, y: 45 },
            { id: 'p10', type: 'player', color: 'red', number: '9', name: 'Prima P.', x: 40, y: 22 },
            { id: 'p11', type: 'player', color: 'red', number: '10', name: 'Seconda P.', x: 60, y: 22 }
          );
        } else if (type === '352') {
          formationElements.push(
            { id: 'p2', type: 'player', color: 'red', number: '2', name: 'Bracc. Dx', x: 30, y: 75 },
            { id: 'p3', type: 'player', color: 'red', number: '5', name: 'Libero', x: 50, y: 80 },
            { id: 'p4', type: 'player', color: 'red', number: '3', name: 'Bracc. Sx', x: 70, y: 75 },
            { id: 'p5', type: 'player', color: 'red', number: '7', name: 'Torn. Dx', x: 15, y: 50 },
            { id: 'p6', type: 'player', color: 'red', number: '8', name: 'Mediano', x: 38, y: 50 },
            { id: 'p7', type: 'player', color: 'red', number: '4', name: 'Regista', x: 50, y: 55 },
            { id: 'p8', type: 'player', color: 'red', number: '10', name: 'Mezzala', x: 62, y: 50 },
            { id: 'p9', type: 'player', color: 'red', number: '11', name: 'Torn. Sx', x: 85, y: 50 },
            { id: 'p10', type: 'player', color: 'red', number: '9', name: 'Attaccante', x: 40, y: 22 },
            { id: 'p11', type: 'player', color: 'red', number: '11', name: 'Attaccante', x: 60, y: 22 }
          );
        } else if (type === '4321') {
          formationElements.push(
            { id: 'p2', type: 'player', color: 'red', number: '2', name: 'Ter. Dx', x: 20, y: 70 },
            { id: 'p3', type: 'player', color: 'red', number: '5', name: 'Dif. Cen', x: 40, y: 75 },
            { id: 'p4', type: 'player', color: 'red', number: '6', name: 'Dif. Cen', x: 60, y: 75 },
            { id: 'p5', type: 'player', color: 'red', number: '3', name: 'Ter. Sx', x: 80, y: 70 },
            { id: 'p6', type: 'player', color: 'red', number: '8', name: 'Mediano', x: 35, y: 55 },
            { id: 'p7', type: 'player', color: 'red', number: '4', name: 'Regista', x: 50, y: 60 },
            { id: 'p8', type: 'player', color: 'red', number: '14', name: 'Mediano', x: 65, y: 55 },
            { id: 'p9', type: 'player', color: 'red', number: '10', name: 'Trequart.', x: 40, y: 35 },
            { id: 'p10', type: 'player', color: 'red', number: '11', name: 'Trequart.', x: 60, y: 35 },
            { id: 'p11', type: 'player', color: 'red', number: '9', name: 'Punta', x: 50, y: 20 }
          );
        }
        setElements(formationElements);
      };

      const getCoords = (evt) => {
        if (!svgRef.current) return { x: 50, y: 50 };
        const rect = svgRef.current.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        const x = Math.max(5, Math.min(95, ((clientX - rect.left) / rect.width) * 100));
        const y = Math.max(5, Math.min(95, ((clientY - rect.top) / rect.height) * 100));
        return { x, y };
      };

      const handleBoardClick = (evt) => {
        if (!hasAccess) {
          setShowPaywallModal(true);
          return;
        }
        if (draggedId) {
          setDraggedId(null);
          return;
        }
        const { x, y } = getCoords(evt);

        if (tool === 'red') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'red', number: (elements.filter(e => e.color === 'red').length + 1).toString(), name: 'Giocatore', x, y }]);
        } else if (tool === 'blue') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'blue', number: (elements.filter(e => e.color === 'blue').length + 1).toString(), name: 'Giocatore', x, y }]);
        } else if (tool === 'ball') {
          setElements([...elements, { id: Date.now().toString(), type: 'ball', x, y }]);
        } else if (tool === 'cone') {
          setElements([...elements, { id: Date.now().toString(), type: 'cone', x, y }]);
        } else if (tool === 'cinesina') {
          setElements([...elements, { id: Date.now().toString(), type: 'cinesina', x, y }]);
        } else if (tool === 'ladder') {
          setElements([...elements, { id: Date.now().toString(), type: 'ladder', x, y }]);
        } else if (tool === 'arrow') {
          if (!isDrawingArrow) {
            setIsDrawingArrow(true);
            setCurrentArrowStart({ x, y });
          } else {
            setArrows([...arrows, { id: Date.now().toString(), startX: currentArrowStart.x, startY: currentArrowStart.y, endX: x, endY: y }]);
            setIsDrawingArrow(false);
            setCurrentArrowStart(null);
          }
        }
      };

      const handleTouchMove = (evt) => {
        if (!hasAccess) return;
        if (!draggedId || tool !== 'move') return;
        const { x, y } = getCoords(evt);
        setElements(elements.map(el => el.id === draggedId ? { ...el, x, y } : el));
      };

      if (!user) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center p-4">
            <div className="max-w-md w-full bg-gray-900 border border-gray-800 p-8 rounded-3xl shadow-2xl">
              <div className="text-center mb-8">
                <div className="w-16 h-16 bg-emerald-600 rounded-2xl mx-auto flex items-center justify-center font-black text-2xl text-white mb-3 shadow-lg shadow-emerald-600/30">CP</div>
                <h1 className="text-2xl font-black text-white tracking-tight">{t('appTitle')}</h1>
                <p className="text-xs text-gray-400 mt-1">{t('subtitle')}</p>
              </div>

              <form onSubmit={handleAuth} className="space-y-4">
                {authMode === 'register' && (
                  <div>
                    <label className="block text-xs font-bold text-gray-300 mb-1">Nome Mister / Società</label>
                    <input 
                      type="text" 
                      placeholder={t('namePlaceholder')} 
                      value={authData.name} 
                      onChange={(e) => setAuthData({ ...authData, name: e.target.value })} 
                      className="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white"
                    />
                  </div>
                )}
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1">{t('emailLabel')}</label>
                  <input 
                    type="email" 
                    required 
                    placeholder="mister@email.com" 
                    value={authData.email} 
                    onChange={(e) => setAuthData({ ...authData, email: e.target.value })} 
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1">{t('passwordLabel')}</label>
                  <input 
                    type="password" 
                    required 
                    placeholder="••••••••" 
                    value={authData.password} 
                    onChange={(e) => setAuthData({ ...authData, password: e.target.value })} 
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white"
                  />
                </div>
                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg shadow-emerald-600/20 transition-all">
                  {authMode === 'login' ? t('loginButton') : t('registerButton')}
                </button>
              </form>

              <div className="mt-6 text-center">
                <button 
                  onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}
                  className="text-xs text-emerald-400 hover:underline font-semibold"
                >
                  {authMode === 'login' ? t('noAccount') : t('hasAccount')}
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-950 text-white flex flex-col">
          {/* Header Principale */}
          <header className="bg-gray-900 border-b border-gray-800 px-4 py-3 flex items-center justify-between sticky top-0 z-40">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center font-black text-white shadow">CP</div>
              <div>
                <h1 className="font-extrabold text-sm tracking-tight">{user.name}</h1>
                <p className="text-[10px] text-emerald-400 font-semibold">{t('proActive')}</p>
              </div>
            </div>
            <div className="flex items-center space-x-2">
              <button onClick={() => setShowProfileDrawer(true)} className="p-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-bold">⚙️</button>
              <button onClick={handleLogout} className="p-2 rounded-xl bg-red-900/30 border border-red-800/50 hover:bg-red-900/50 text-red-400 text-xs font-bold">{t('exitButton')}</button>
            </div>
          </header>

          {/* Barra di Navigazione Tab */}
          <nav className="bg-gray-900/80 backdrop-blur border-b border-gray-800 flex justify-around p-2">
            <button onClick={() => setActiveTab('board')} className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${activeTab === 'board' ? 'bg-emerald-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}>
              📋 {t('navBoard')}
            </button>
            <button onClick={() => setActiveTab('drills')} className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${activeTab === 'drills' ? 'bg-emerald-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}>
              ⚽ {t('navDrills')}
            </button>
            <button onClick={() => setActiveTab('squad')} className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${activeTab === 'squad' ? 'bg-emerald-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}>
              👥 {t('navSquad')}
            </button>
          </nav>

          {/* Contenuto Principale */}
          <main className="flex-1 p-4 max-w-5xl w-full mx-auto">
            {activeTab === 'board' && (
              <div className="space-y-4">
                {/* Moduli rapidi & Pulsante Esporta PDF */}
                <div className="bg-gray-900 border border-gray-800 p-3 rounded-2xl flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center space-x-2">
                    <span className="text-xs font-bold text-gray-400">{t('quickFormations')}</span>
                    <button onClick={() => presetFormation('433')} className="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-bold rounded-xl">4-3-3</button>
                    <button onClick={() => presetFormation('442')} className="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-bold rounded-xl">4-4-2</button>
                    <button onClick={() => presetFormation('352')} className="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-bold rounded-xl">3-5-2</button>
                    <button onClick={() => presetFormation('4321')} className="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-bold rounded-xl">4-3-2-1</button>
                  </div>

                  <div className="flex items-center space-x-2">
                    <button onClick={() => { setElements([]); setArrows([]); }} className="px-3 py-2 rounded-xl text-xs font-bold bg-gray-900 border border-gray-800 text-gray-400 hover:text-rose-400">🧹 {t('toolClear')}</button>
                    <button onClick={handleExportBoardPDF} className="px-3 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow">
                      📄 Esporta PDF Lavagna
                    </button>
                  </div>
                </div>

                {/* Strumenti (Ripristinati al 100%) */}
                <div className="flex flex-wrap gap-2 bg-gray-900 border border-gray-800 p-3 rounded-2xl">
                  <button onClick={() => setTool('move')} className={`px-3 py-2 rounded-xl text-xs font-bold ${tool === 'move' ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-300'}`}>✋ {t('toolMove')}</button>
                  <button onClick={() => setTool('red')} className={`px-3 py-2 rounded-xl text-xs font-bold ${tool === 'red' ? 'bg-rose-600 text-white' : 'bg-gray-800 text-gray-300'}`}>🔴 {t('toolRed')}</button>
                  <button onClick={() => setTool('blue')} className={`px-3 py-2 rounded-xl text-xs font-bold ${tool === 'blue' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300'}`}>🔵 {t('toolBlue')}</button>
                  <button onClick={() => setTool('ball')} className={`px-3 py-2 rounded-xl text-xs font-bold ${tool === 'ball' ? 'bg-white text-black' : 'bg-gray-800 text-gray-300'}`}>⚽ {t('toolBall')}</button>
                  <button onClick={() => setTool('cone')} className={`px-3 py-2 rounded-xl text-xs font-bold ${tool === 'cone' ? 'bg-orange-600 text-white' : 'bg-gray-800 text-gray-300'}`}>🔺 {t('toolCone')}</button>
                  <button onClick={() => setTool('cinesina')} className={`px-3 py-2 rounded-xl text-xs font-bold ${tool === 'cinesina' ? 'bg-amber-500 text-black' : 'bg-gray-800 text-gray-300'}`}>🔘 {t('toolCinesina')}</button>
                  <button onClick={() => setTool('ladder')} className={`px-3 py-2 rounded-xl text-xs font-bold ${tool === 'ladder' ? 'bg-yellow-600 text-white' : 'bg-gray-800 text-gray-300'}`}>🪜 {t('toolLadder')}</button>
                  <button onClick={() => setTool('arrow')} className={`px-3 py-2 rounded-xl text-xs font-bold ${tool === 'arrow' ? 'bg-purple-600 text-white' : 'bg-gray-800 text-gray-300'}`}>↗️ {t('toolArrow')}</button>
                  <button onClick={() => setTool('delete')} className={`px-3 py-2 rounded-xl text-xs font-bold ${tool === 'delete' ? 'bg-rose-600 text-white' : 'bg-gray-800 text-gray-300'}`}>🧹 {t('toolDelete')}</button>
                </div>

                {/* Lavagna Campo */}
                <div 
                  ref={svgRef}
                  onClick={handleBoardClick}
                  onTouchMove={handleTouchMove}
                  className="relative w-full aspect-[4/3] rounded-3xl overflow-hidden border-2 border-emerald-600 pitch-bg shadow-2xl cursor-crosshair select-none"
                >
                  <div className="absolute inset-4 border-2 border-white/30 pointer-events-none"></div>
                  <div className="absolute top-1/2 left-0 right-0 h-[2px] bg-white/30 transform -translate-y-1/2 pointer-events-none"></div>
                  <div className="absolute top-1/2 left-1/2 w-28 h-28 border-2 border-white/30 rounded-full transform -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>

                  {/* Frecce */}
                  <svg className="absolute inset-0 w-full h-full pointer-events-none">
                    {arrows.map(arr => (
                      <g key={arr.id}>
                        <line x1={`${arr.startX}%`} y1={`${arr.startY}%`} x2={`${arr.endX}%`} y2={`${arr.endY}%`} stroke="#facc15" strokeWidth="3" strokeDasharray="6,6" />
                        <circle cx={`${arr.endX}%`} cy={`${arr.endY}%`} r="4" fill="#facc15" />
                      </g>
                    ))}
                  </svg>

                  {/* Elementi in campo */}
                  {elements.map(el => {
                    let bg = "bg-rose-600 border-rose-400";
                    if (el.color === 'blue') bg = "bg-blue-600 border-blue-400";
                    if (el.type === 'ball') bg = "bg-white text-black border-gray-300";
                    if (el.type === 'cone') bg = "bg-orange-500 border-orange-300 rounded-none transform rotate-45";
                    if (el.type === 'cinesina') bg = "bg-amber-400 border-amber-200 rounded-full w-5 h-5";
                    if (el.type === 'ladder') bg = "bg-yellow-600 border-yellow-400 rounded-none w-10 h-4";

                    return (
                      <div
                        key={el.id}
                        onMouseDown={(e) => { e.stopPropagation(); if (tool === 'move') setDraggedId(el.id); else setElements(elements.filter(item => item.id !== el.id)); }}
                        onTouchStart={(e) => { e.stopPropagation(); if (tool === 'move') setDraggedId(el.id); else setElements(elements.filter(item => item.id !== el.id)); }}
                        style={{ left: `${el.x}%`, top: `${el.y}%`, transform: 'translate(-50%, -50%)' }}
                        className="absolute flex flex-col items-center cursor-pointer select-none z-10"
                      >
                        <div className={`w-9 h-9 rounded-full flex items-center justify-center font-extrabold text-xs shadow-lg border-2 ${bg}`}>
                          {el.type === 'player' && el.number}
                          {el.type === 'ball' && '⚽'}
                        </div>
                        {el.type === 'player' && (
                          editingPlayerId === el.id ? (
                            <input 
                              autoFocus
                              type="text"
                              value={tempPlayerName}
                              onChange={(e) => setTempPlayerName(e.target.value)}
                              onBlur={() => {
                                setElements(elements.map(item => item.id === el.id ? { ...item, name: tempPlayerName } : item));
                                setEditingPlayerId(null);
                              }}
                              onKeyDown={(e) => {
                                if (e.key === 'Enter') {
                                  setElements(elements.map(item => item.id === el.id ? { ...item, name: tempPlayerName } : item));
                                  setEditingPlayerId(null);
                                }
                              }}
                              className="mt-1 bg-black text-white text-[9px] px-1.5 py-0.5 rounded border border-emerald-500 text-center w-16"
                            />
                          ) : (
                            <span 
                              onDoubleClick={(e) => { e.stopPropagation(); setEditingPlayerId(el.id); setTempPlayerName(el.name || ''); }}
                              onClick={(e) => { e.stopPropagation(); setEditingPlayerId(el.id); setTempPlayerName(el.name || ''); }}
                              className="mt-0.5 bg-black/90 text-white px-1.5 py-0.5 rounded text-[9px] font-bold whitespace-nowrap shadow cursor-pointer border border-transparent hover:border-emerald-400"
                            >
                              {el.name || 'Nome'}
                            </span>
                          )
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'drills' && (
              <div className="space-y-4">
                <form onSubmit={addDrill} className="bg-gray-900 border border-gray-800 p-4 rounded-2xl space-y-3">
                  <h2 className="font-bold text-sm text-emerald-400">{t('newDrill')}</h2>
                  <input type="text" placeholder={t('drillTitlePlaceholder')} value={newDrillTitle} onChange={(e) => setNewDrillTitle(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white" />
                  <div className="grid grid-cols-2 gap-2">
                    <select value={newDrillCat} onChange={(e) => setNewDrillCat(e.target.value)} className="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white">
                      <option>{t('categoryPossesso')}</option>
                      <option>{t('categoryTactics')}</option>
                      <option>{t('categoryFitness')}</option>
                      <option>{t('categoryFinishing')}</option>
                    </select>
                    <input type="text" placeholder={t('drillDurationPlaceholder')} value={newDrillDur} onChange={(e) => setNewDrillDur(e.target.value)} className="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white" />
                  </div>
                  <textarea placeholder={t('drillDescPlaceholder')} value={newDrillDesc} onChange={(e) => setNewDrillDesc(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white h-20"></textarea>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 font-bold text-xs py-2.5 rounded-xl shadow">{t('saveDrill')}</button>
                </form>

                <div className="space-y-3">
                  {drills.length === 0 ? (
                    <p className="text-center text-xs text-gray-500 py-8">{t('noDrills')}</p>
                  ) : (
                    drills.map(d => (
                      <div key={d.id} className="bg-gray-900 border border-gray-800 p-4 rounded-2xl flex justify-between items-start">
                        <div>
                          <span className="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800/50 px-2 py-0.5 rounded-full font-bold">{d.category} - {d.duration}</span>
                          <h3 className="font-bold text-sm mt-1">{d.title}</h3>
                          <p className="text-xs text-gray-400 mt-1 whitespace-pre-wrap">{d.description}</p>
                        </div>
                        <button onClick={() => removeDrill(d.id)} className="text-red-400 hover:text-red-300 text-xs font-bold">🗑️</button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {activeTab === 'squad' && (
              <div className="space-y-4">
                <form onSubmit={addPlayer} className="bg-gray-900 border border-gray-800 p-4 rounded-2xl space-y-3">
                  <h2 className="font-bold text-sm text-emerald-400">Aggiungi Giocatore in Rosa</h2>
                  <div className="grid grid-cols-3 gap-2">
                    <input type="text" placeholder={t('playerPlaceholder')} value={newPlayerName} onChange={(e) => setNewPlayerName(e.target.value)} className="col-span-2 bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white" />
                    <input type="number" placeholder="N°" value={newPlayerNumber} onChange={(e) => setNewPlayerNumber(e.target.value)} className="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white text-center" />
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 font-bold text-xs py-2.5 rounded-xl shadow">{t('addPlayer')}</button>
                </form>

                <div className="space-y-2">
                  {players.length === 0 ? (
                    <p className="text-center text-xs text-gray-500 py-8">{t('noPlayers')}</p>
                  ) : (
                    players.map(p => (
                      <div key={p.id} className="bg-gray-900 border border-gray-800 p-3 rounded-2xl flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                          <span className="w-7 h-7 bg-emerald-600/20 border border-emerald-500 text-emerald-400 rounded-lg flex items-center justify-center font-bold text-xs">{p.number}</span>
                          <div>
                            <h4 className="font-bold text-xs">{p.name}</h4>
                            <button onClick={() => togglePlayerStatus(p.id)} className={`text-[10px] font-bold px-2 py-0.5 rounded-full mt-0.5 inline-block ${p.status === 'presente' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : p.status === 'assente' ? 'bg-amber-950 text-amber-400 border border-amber-800' : 'bg-red-950 text-red-400 border border-red-800'}`}>
                              {p.status.toUpperCase()}
                            </button>
                          </div>
                        </div>
                        <button onClick={() => removePlayer(p.id)} className="text-red-400 hover:text-red-300 text-xs font-bold">🗑️</button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}
          </main>

          {/* Drawer Profilo e Impostazioni */}
          {showProfileDrawer && (
            <div className="fixed inset-0 bg-black/80 flex justify-end z-50">
              <div className="bg-gray-900 w-80 h-full p-6 space-y-6 overflow-y-auto border-l border-gray-800">
                <div className="flex justify-between items-center border-b border-gray-800 pb-3">
                  <h3 className="font-bold text-sm text-emerald-400">{t('profileSettings')}</h3>
                  <button onClick={() => setShowProfileDrawer(false)} className="text-gray-400 hover:text-white font-bold text-sm">✕</button>
                </div>

                <div className="space-y-2">
                  <label className="block text-xs font-bold text-gray-400">{t('uploadPhoto')}</label>
                  <input type="file" accept="image/*" onChange={handleImageUpload} className="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500" />
                  {profileImage && <img src={profileImage} alt="Logo" className="w-16 h-16 rounded-xl object-cover mt-2 border border-emerald-500" />}
                </div>

                <div className="space-y-2">
                  <label className="block text-xs font-bold text-gray-400">{t('languageLabel')}</label>
                  <select value={language} onChange={(e) => setLanguage(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white">
                    <option value="it">Italiano</option>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                  </select>
                </div>

                <div className="pt-4 border-t border-gray-800">
                  <button onClick={handleLogout} className="w-full bg-red-950/50 border border-red-800 text-red-400 font-bold text-xs py-3 rounded-xl">{t('logoutAccount')}</button>
                </div>
              </div>
            </div>
          )}

          {/* Modale Anteprima PDF Lavagna */}
          {showBoardPdfModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className="bg-white text-gray-900 rounded-3xl max-w-2xl w-full p-6 space-y-4 shadow-2xl relative">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-lg text-emerald-700">📄 Anteprima Stampa / PDF Lavagna</h3>
                  <button onClick={() => setShowBoardPdfModal(false)} className="text-gray-500 hover:text-black font-bold text-lg px-2">✕</button>
                </div>

                <div className="p-4 bg-gray-50 rounded-2xl border border-gray-200">
                  <div className="flex items-center justify-between border-b-2 border-emerald-700 pb-3 mb-4">
                    <div>
                      <h1 className="m-0 text-emerald-800 font-bold text-base">COACHPRO - LAVAGNA TATTICA</h1>
                      <p className="m-0 text-xs text-gray-600 mt-1">Mister: <strong>{user.name}</strong> | Data: {new Date().toLocaleDateString()}</p>
                    </div>
                    <div>
                      {profileImage ? <img src={profileImage} className="w-12 h-12 rounded-xl object-cover border border-emerald-700" /> : <div className="bg-emerald-700 text-white font-bold w-10 h-10 flex items-center justify-center rounded-xl text-xs">CP</div>}
                    </div>
                  </div>

                  {/* Miniatura campo */}
                  <div className="relative w-full aspect-[4/3] rounded-xl overflow-hidden border-2 border-emerald-700 pitch-bg shadow-inner">
                    <div className="absolute inset-3 border-2 border-white/30 pointer-events-none"></div>
                    <div className="absolute top-1/2 left-0 right-0 h-[2px] bg-white/30 transform -translate-y-1/2 pointer-events-none"></div>
                    <div className="absolute top-1/2 left-1/2 w-20 h-20 border-2 border-white/30 rounded-full transform -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>

                    {elements.map(el => {
                      let bg = "bg-rose-600 border-rose-400";
                      if (el.color === 'blue') bg = "bg-blue-600 border-blue-400";
                      if (el.type === 'ball') bg = "bg-white text-black border-gray-300";
                      if (el.type === 'cone') bg = "bg-orange-500 border-orange-300 rounded-none transform rotate-45";
                      if (el.type === 'cinesina') bg = "bg-amber-400 border-amber-200 rounded-full w-4 h-4";
                      if (el.type === 'ladder') bg = "bg-yellow-600 border-yellow-400 rounded-none w-8 h-3";

                      return (
                        <div
                          key={el.id}
                          style={{ left: `${el.x}%`, top: `${el.y}%`, transform: 'translate(-50%, -50%)' }}
                          className="absolute flex flex-col items-center select-none"
                        >
                          <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shadow-md border-2 ${bg}`}>
                            {el.type === 'player' && el.number}
                            {el.type === 'ball' && '⚽'}
                          </div>
                          {el.type === 'player' && el.name && (
                            <span className="mt-0.5 bg-black/90 text-white px-1 py-0.5 rounded text-[8px] font-bold whitespace-nowrap shadow">
                              {el.name}
                            </span>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  <div className="text-center text-[10px] text-gray-400 mt-4 border-t pt-2">
                    Generato con CoachPro App - Piattaforma Tattica Professionale
                  </div>
                </div>

                <div className="flex space-x-3 pt-2">
                  <button 
                    onClick={() => { window.print(); }} 
                    className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg transition-all"
                  >
                    🖨️ Stampa / Salva in PDF
                  </button>
                  <button 
                    onClick={() => setShowBoardPdfModal(false)} 
                    className="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold px-5 py-3 rounded-xl text-sm"
                  >
                    Chiudi
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CoachProApp />);
  </script>
</body>
</html>
