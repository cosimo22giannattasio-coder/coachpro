    function CoachProApp() {
      const [user, setUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [authData, setAuthData] = useState({ name: '', email: '', password: '' });

      const [showProfileDrawer, setShowProfileDrawer] = useState(false);
      const [profileImage, setProfileImage] = useState(null);
      const [language, setLanguage] = useState('it');

      const t = (key) => {
        return translations[language][key] || translations['it'][key] || key;
      };

      const [activeTab, setActiveTab] = useState('board');
      const [tool, setTool] = useState('move');
      const [draggedId, setDraggedId] = useState(null);
      const [elements, setElements] = useState([]);
      const [arrows, setArrows] = useState([]);
      const [isDrawingArrow, setIsDrawingArrow] = useState(false);
      const [currentArrowStart, setCurrentArrowStart] = useState(null);
      const [showPaywallModal, setShowPaywallModal] = useState(false);

      const [clubCodeInput, setClubCodeInput] = useState('');
      const [clubCodeMsg, setClubCodeMsg] = useState('');

      const [drills, setDrills] = useState([]);
      const [players, setPlayers] = useState([]);
      const [newPlayerName, setNewPlayerName] = useState('');
      const [newPlayerNumber, setNewPlayerNumber] = useState('');
      const [newPlayerRole, setNewPlayerRole] = useState('Centrocampista');
      
      const [newDrillTitle, setNewDrillTitle] = useState('');
      const [newDrillCat, setNewDrillCat] = useState('Possesso Palla');
      const [newDrillDur, setNewDrillDur] = useState('15 min');
      const [newDrillDesc, setNewDrillDesc] = useState('');

      const svgRef = useRef(null);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setProfileImage(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const checkAccess = () => {
        return true;
      };

      const hasAccess = checkAccess();

      const handleAuth = (evt) => {
        evt.preventDefault();
        if (!authData.email) return;
        const displayName = authData.name.trim() ? authData.name.trim() : authData.email.split('@')[0];
        const trialEndTime = new Date().getTime() + (TRIAL_DAYS * 24 * 60 * 60 * 1000);

        setUser({
          name: displayName,
          email: authData.email,
          isPro: false,
          clubCode: null,
          trialEndsAt: authMode === 'register' ? trialEndTime : null
        });
      };

      const handleLogout = () => {
        setUser(null);
        setAuthData({ name: '', email: '', password: '' });
        setProfileImage(null);
      };

      const activateTrial = () => {
        const trialEndTime = new Date().getTime() + (TRIAL_DAYS * 24 * 60 * 60 * 1000);
        setUser({ ...user, trialEndsAt: trialEndTime });
        setShowPaywallModal(false);
      };

      const handleRedeemClubCode = (e) => {
        e.preventDefault();
        if (!clubCodeInput.trim()) return;
        
        const code = clubCodeInput.trim().toUpperCase();
        if (code.length >= 4) {
          setUser({
            ...user,
            isPro: true,
            clubCode: code
          });
          setClubCodeMsg('✅ ' + (language === 'it' ? 'Codice Società riscattato con successo!' : 'Club code redeemed successfully!'));
          setTimeout(() => {
            setShowPaywallModal(false);
            setClubCodeMsg('');
            setClubCodeInput('');
          }, 1500);
        } else {
          setClubCodeMsg('❌ ' + (language === 'it' ? 'Codice non valido.' : 'Invalid code.'));
        }
      };

      const handleShareClubInvite = () => {
        const codeToShare = user?.clubCode || "CP-CLUB-2026";
        const text = `⚽ *COACHPRO - LICENZA SOCIETÀ*\n\n🔑 *Codice:* ${codeToShare}\n\n1. Open CoachPro\n2. Subscription > Redeem Club Code`;
        const encodedText = encodeURIComponent(text);
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
          window.location.href = `whatsapp://send?text=${encodedText}`;
        } else {
          window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
        }
      };

      const addPlayer = (e) => {
        e.preventDefault();
        if (!newPlayerName.trim()) return;
        
        const squadPlayer = {
          id: Date.now().toString(),
          name: newPlayerName.trim(),
          number: newPlayerNumber || '1',
          role: newPlayerRole || 'Centrocampista',
          status: 'presente'
        };

        setPlayers([...players, squadPlayer]);
        setNewPlayerName('');
        setNewPlayerNumber('');
      };

      const togglePlayerStatus = (id) => {
        setPlayers(players.map(p => {
          if (p.id === id) {
            const nextStatus = p.status === 'presente' ? 'assente' : p.status === 'assente' ? 'infortunato' : 'presente';
            return { ...p, status: nextStatus };
          }
          return p;
        }));
      };

      const removePlayer = (id) => {
        setPlayers(players.filter(p => p.id !== id));
      };

      const addDrill = (e) => {
        e.preventDefault();
        if (!newDrillTitle.trim()) return;
        setDrills([...drills, { id: Date.now().toString(), title: newDrillTitle.trim(), category: newDrillCat, duration: newDrillDur, description: newDrillDesc }]);
        setNewDrillTitle('');
        setNewDrillDesc('');
      };

      const removeDrill = (id) => {
        setDrills(drills.filter(d => d.id !== id));
      };

     const presetFormation = (type) => {
        if (!hasAccess) {
          setShowPaywallModal(true);
          return;
        }

        // Funzione di supporto per prendere un giocatore dalla rosa in base al ruolo o all'ordine
        const getPlayerForPos = (index, fallbackName, fallbackNum) => {
          if (players && players.length > index) {
            return {
              name: players[index].name,
              number: players[index].number || fallbackNum
            };
          }
          return { name: fallbackName, number: fallbackNum };
        };

        let formationElements = [];
        
        // Portiere (Prende il primo portiere o il primo della rosa)
        const gkPlayer = players.find(p => p.role === 'Portiere') || players[0];
        formationElements.push({ 
          id: 'p1', 
          type: 'player', 
          color: 'red', 
          number: gkPlayer ? gkPlayer.number : '1', 
          name: gkPlayer ? gkPlayer.name : 'Portiere', 
          x: 50, 
          y: 90 
        });

        if (type === '433') {
          const p2 = getPlayerForPos(1, 'Terzino', '2');
          const p3 = getPlayerForPos(2, 'Difensore', '5');
          const p4 = getPlayerForPos(3, 'Difensore', '6');
          const p5 = getPlayerForPos(4, 'Terzino', '3');
          const p6 = getPlayerForPos(5, 'Mediano', '8');
          const p7 = getPlayerForPos(6, 'Regista', '4');
          const p8 = getPlayerForPos(7, 'Mezzala', '10');
          const p9 = getPlayerForPos(8, 'Ala', '7');
          const p10 = getPlayerForPos(9, 'Punta', '9');
          const p11 = getPlayerForPos(10, 'Ala', '11');

                  <div className="space-y-3">
                    {drills.map(d => (
                      <div key={d.id} className="bg-gray-900 border border-gray-800 p-4 rounded-2xl flex flex-col space-y-2">
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">{d.category}</span>
                            <h4 className="font-bold text-sm mt-1">{d.title}</h4>
                            <p className="text-xs text-gray-400">⏱️ {d.duration}</p>
                          </div>
                          <div className="flex space-x-2">
                            <button onClick={() => handleExportSingleDrillPDF(d)} className="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1 rounded-xl text-emerald-400 font-semibold">PDF</button>
                            <button onClick={() => removeDrill(d.id)} className="text-gray-500 hover:text-rose-400">✕</button>
                          </div>
                        </div>
                        {d.description && <p className="text-xs text-gray-300 bg-gray-950/50 p-2 rounded-xl">{d.description}</p>}
                      </div>
                    ))}
                    <button onClick={handleExportPDF} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg">
                      {t('exportPdf')}
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* TAB: SQUAD / ROSA */}
            {activeTab === 'squad' && (
              <div className="space-y-4">
                <form onSubmit={addPlayer} className="bg-gray-900 border border-gray-800 p-4 rounded-2xl flex space-x-2">
                  <input
                    type="number"
                    placeholder="N°"
                    value={newPlayerNumber}
                    onChange={(ev) => setNewPlayerNumber(ev.target.value)}
                    className="w-16 bg-gray-800 border border-gray-700 rounded-xl px-2 py-2 text-xs text-white text-center font-bold"
                  />
                  <input
                    type="text"
                    placeholder={t('playerPlaceholder')}
                    value={newPlayerName}
                    onChange={(ev) => setNewPlayerName(ev.target.value)}
                    className="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white"
                  />
                  <select
                    value={newPlayerRole}
                    onChange={(ev) => setNewPlayerRole(ev.target.value)}
                    className="bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white"
                  >
                    <option value="Portiere">{t('roleGoalkeeper')}</option>
                    <option value="Difensore">{t('roleDefender')}</option>
                    <option value="Centrocampista">{t('roleMidfielder')}</option>
                    <option value="Attaccante">{t('roleForward')}</option>
                  </select>
                  <button type="submit" className="bg-emerald-500 text-gray-950 font-bold px-4 py-2 rounded-xl text-xs">{t('addPlayer')}</button>
                </form>

                {players.length === 0 ? (
                  <p className="text-gray-500 text-center py-10 text-sm">{t('noPlayers')}</p>
                ) : (
                  <div className="space-y-2">
                    {players.map(p => {
                      let statusBadge = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
                      if (p.status === 'assente') statusBadge = "bg-rose-500/20 text-rose-400 border-rose-500/30";
                      if (p.status === 'infortunato') statusBadge = "bg-amber-500/20 text-amber-400 border-amber-500/30";

                      return (
                        <div key={p.id} className="bg-gray-900 border border-gray-800 rounded-xl p-3 flex items-center justify-between shadow">
                          <div className="flex items-center space-x-3">
                            <span className="w-7 h-7 rounded-full bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 flex items-center justify-center font-bold text-xs">
                              {p.number}
                            </span>
                            <div>
                              <h4 className="font-bold text-sm">{p.name}</h4>
                              <p className="text-xs text-gray-400">{p.role}</p>
                            </div>
                          </div>
                          <div className="flex items-center space-x-2">
                            <button 
                              onClick={() => togglePlayerStatus(p.id)} 
                              className={`text-[10px] px-2.5 py-1 rounded-full font-bold border transition-all ${statusBadge}`}
                            >
                              {p.status.toUpperCase()}
                            </button>
                            <button onClick={() => removePlayer(p.id)} className="text-gray-500 hover:text-rose-400 px-2 py-1">✕</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

          </main>

          {/* Profile Drawer / Modal */}
          {showProfileDrawer && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-gray-900 border border-gray-800 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-base">{t('profileSettings')}</h3>
                  <button onClick={() => setShowProfileDrawer(false)} className="text-gray-400 hover:text-white font-bold text-sm">✕</button>
                </div>

                <div className="flex flex-col items-center space-y-3">
                  <div className="w-20 h-20 rounded-2xl overflow-hidden bg-emerald-600 flex items-center justify-center font-bold text-2xl border-2 border-emerald-500 shadow-lg">
                    {profileImage ? <img src={profileImage} className="w-full h-full object-cover" /> : user.name.substring(0, 2).toUpperCase()}
                  </div>
                  <label className="bg-gray-800 hover:bg-gray-700 text-xs font-semibold px-4 py-2 rounded-xl cursor-pointer border border-gray-700">
                    {t('uploadPhoto')}
                    <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                  </label>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-bold text-gray-400">{t('languageLabel')}</label>
                  <select 
                    value={language} 
                    onChange={(e) => setLanguage(e.target.value)}
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white"
                  >
                    <option value="it">Italiano</option>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                  </select>
                </div>

                <button onClick={() => setShowProfileDrawer(false)} className="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-xl text-xs">
                  Salva & Chiudi
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CoachProApp />);
  </script>
</body>
</html>
