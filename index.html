    function CoachProApp() {
      const [user, setUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [authData, setAuthData] = useState({ name: '', email: '', password: '' });

      const [showProfileDrawer, setShowProfileDrawer] = useState(false);

      const t = (key) => {
        return translations[language][key] || translations['it'][key] || key;

      const [activeTab, setActiveTab] = useState('board');
      const [tool, setTool] = useState('move');
      const [draggedId, setDraggedId] = useState(null);
      const [elements, setElements] = useState([]);
      const [arrows, setArrows] = useState([]);
      const [isDrawingArrow, setIsDrawingArrow] = useState(false);
      const [currentArrowStart, setCurrentArrowStart] = useState(null);
      const [showPaywallModal, setShowPaywallModal] = useState(false);
      // Calcola la distanza tra due dita per il pinch-to-zoom
      const getTouchDistance = (touches) => {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      };

      const handleTouchStartBoard = (e) => {
        if (e.touches.length === 2) {
          // Inizia il pinch con 2 dita
          setLastTouchDist(getTouchDistance(e.touches));
        } else if (e.touches.length === 1 && tool === 'move' && !draggedId) {
          // Spostamento del campo (pan) se non stiamo muovendo un giocatore
          setIsDraggingBoard(true);
          setDragStart({ x: e.touches[0].clientX - pan.x, y: e.touches[0].clientY - pan.y });
        }
      };

      const handleTouchMoveBoard = (e) => {
        if (e.touches.length === 2 && lastTouchDist !== null) {
          // Gestione Zoom con 2 dita
          const dist = getTouchDistance(e.touches);
          const factor = dist / lastTouchDist;
          setScale(prev => Math.min(Math.max(prev * factor, 0.8), 3)); // Zoom da 0.8x a 3x
          setLastTouchDist(dist);
        } else if (e.touches.length === 1 && isDraggingBoard) {
          // Gestione Pan (spostamento campo)
          setPan({
            x: e.touches[0].clientX - dragStart.x,
            y: e.touches[0].clientY - dragStart.y
          });
        } else {
          // Se stiamo muovendo un giocatore, usiamo la normale funzione di movimento
          handleTouchMove(e);
        }
      };

      const handleTouchEndBoard = () => {
        setLastTouchDist(null);
        setIsDraggingBoard(false);

      const [clubCodeInput, setClubCodeInput] = useState('');

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {

          reader.onloadend = () => {

        const trialEndTime = new Date().getTime() + (TRIAL_DAYS * 24 * 60 * 60 * 1000);

      const handleRedeemClubCode = (e) => {

        printWindow.document.write(`

        `);
        printWindow.document.close();
      };

      const handleExportSingleDrillPDF = (drill) => {
        if (!hasAccess) { setShowPaywallModal(true); return; }
        const printWindow = window.open('', '_blank');
        if (!printWindow) { alert("Abilita i popup."); return; }

        printWindow.document.write(`
          <!DOCTYPE html><html><head><meta charset="UTF-8"/><title>CoachPro - Esercizio</title>
          <style>body { font-family: Arial, sans-serif; color: #111; padding: 25px; max-width: 800px; margin: auto; }</style></head>
          <body>

      const handleExportBoardPDF = () => {
        if (!hasAccess) { setShowPaywallModal(true); return; }
        const printWindow = window.open('', '_blank');
        if (!printWindow) { alert("Abilita i popup."); return; }

        const svgContent = svgRef.current ? svgRef.current.outerHTML : '';

        printWindow.document.write(`
          <!DOCTYPE html>

              .footer { margin-top: 20px; text-align: center; font-size: 10px; color: #777; border-top: 1px solid #ddd; padding-top: 5px; }
            </style>
          </head>
          <body>
            <div class="header">
              <div class="title-box">
                <h1>COACHPRO - LAVAGNA TATTICA</h1>
                <p>Mister: <strong>${user.name}</strong> | Data: ${new Date().toLocaleDateString()}</p>

              <div>
                ${profileImage ? `<img src="${profileImage}" class="logo" />` : `<div style="background:#15803d; color:white; font-weight:bold; width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:12px;">CP</div>`}

      const getCoords = (evt) => {
        if (!svgRef.current) return { x: 50, y: 50 };
        const rect = svgRef.current.getBoundingClientRect();
        // Supporto unificato per mouse e touch screen
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        
        // Calcoliamo la posizione in percentuale rispetto alla viewBox (0 a 100)
        const x = Math.max(5, Math.min(95, ((clientX - rect.left) / rect.width) * 100));
        const y = Math.max(5, Math.min(95, ((clientY - rect.top) / rect.height) * 100));
        return { x, y };
      };

      const handleBoardClick = (evt) => {
        if (!hasAccess) { setShowPaywallModal(true); return; }
        
        // Se stavamo trascinando un elemento e clicchiamo sul campo, rilasciamo l'oggetto
        if (draggedId) {
          setDraggedId(null);
          return;
        }

        const { x, y } = getCoords(evt);

        if (tool === 'player-red') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'red', number: (elements.filter(e => e.color === 'red').length + 1).toString(), x, y }]);
        } else if (tool === 'player-blue') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'blue', number: (elements.filter(e => e.color === 'blue').length + 1).toString(), x, y }]);
        } else if (tool === 'ball') {
          setElements([...elements, { id: Date.now().toString(), type: 'ball', x, y }]);
        } else if (tool === 'cone') {
          setElements([...elements, { id: Date.now().toString(), type: 'cone', x, y }]);
        } else if (tool === 'cinesina') {
          setElements([...elements, { id: Date.now().toString(), type: 'cinesina', x, y }]);
        } else if (tool === 'ladder') {
          setElements([...elements, { id: Date.now().toString(), type: 'ladder', x, y }]);
        } else if (tool === 'arrow') {
          if (!isDrawingArrow) {
            setIsDrawingArrow(true);
            setCurrentArrowStart({ x, y });
          } else {
            setArrows([...arrows, { id: Date.now().toString(), startX: currentArrowStart.x, startY: currentArrowStart.y, endX: x, endY: y }]);
            setIsDrawingArrow(false);
            setCurrentArrowStart(null);
          }
        }
      };

      const handleTouchMove = (evt) => {
        if (!hasAccess || !draggedId || tool !== 'move') return;
        const { x, y } = getCoords(evt);
        setElements(elements.map(el => el.id === draggedId ? { ...el, x, y } : el));
      };

      const handleElementClick = (id, evt) => {
        evt.stopPropagation();
        if (!hasAccess) { setShowPaywallModal(true); return; }
        
        if (tool === 'delete') {
          setElements(elements.filter(el => el.id !== id));
        } else if (tool === 'move') {
          // Se lo strumento è "Sposta", il primo click seleziona l'elemento, il secondo lo rilascia nella nuova posizione
          setDraggedId(draggedId === id ? null : id);
        }
      };

        let reds = [];
        if (type === '433') {
          reds = [
            { id: 'r1', type: 'player', color: 'red', number: '1', x: 50, y: 88 },
            { id: 'r2', type: 'player', color: 'red', number: '2', x: 15, y: 70 },
            { id: 'r3', type: 'player', color: 'red', number: '5', x: 38, y: 75 },
            { id: 'r4', type: 'player', color: 'red', number: '6', x: 62, y: 75 },
            { id: 'r5', type: 'player', color: 'red', number: '3', x: 85, y: 70 },
            { id: 'r6', type: 'player', color: 'red', number: '4', x: 50, y: 60 },
            { id: 'r7', type: 'player', color: 'red', number: '8', x: 30, y: 50 },
            { id: 'r8', type: 'player', color: 'red', number: '10', x: 70, y: 50 },
            { id: 'r9', type: 'player', color: 'red', number: '7', x: 15, y: 30 },
            { id: 'r10', type: 'player', color: 'red', number: '9', x: 50, y: 25 },
            { id: 'r11', type: 'player', color: 'red', number: '11', x: 85, y: 30 }
          ];
        } else if (type === '442') {
          reds = [
            { id: 'r1', type: 'player', color: 'red', number: '1', x: 50, y: 88 },

            { id: 'r4', type: 'player', color: 'red', number: '6', x: 62, y: 75 },

        setArrows([]);

      const handleShareWhatsApp = (drill) => {
        if (!hasAccess) { setShowPaywallModal(true); return; }
        const text = `⚽ *COACHPRO - DRILL*\n\n📌 *Title:* ${drill.title}\n⏱️ *Duration:* ${drill.duration}\n📂 *Category:* ${drill.category}\n\n📝 *Description:*\n${drill.description}`;

        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if (!newDrillTitle) return;
        setDrills([...drills, { id: Date.now().toString(), title: newDrillTitle, category: newDrillCat, duration: newDrillDur, description: newDrillDesc }]);

      const addPlayer = (evt) => {
        evt.preventDefault();
        if (!hasAccess) { setShowPaywallModal(true); return; }
        if (!newPlayerName) return;
        setPlayers([...players, { id: Date.now().toString(), name: newPlayerName, role: newPlayerRole, status: 'presente' }]);

      const togglePlayerStatus = (id) => {
        if (!hasAccess) { setShowPaywallModal(true); return; }

                    <label className="text-[11px] font-bold text-gray-300 block">{t('haveClubCode')}</label>
                    <form onSubmit={handleRedeemClubCode} className="flex space-x-2">
                      <input type="text" placeholder="es. CLUB2026" value={clubCodeInput} onChange={(e) => setClubCodeInput(e.target.value)} className="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-white uppercase font-mono" />
                      <button type="submit" className="bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold px-3 py-1.5 rounded-xl text-xs">{t('activate')}</button>
                    </form>
                    {clubCodeMsg && <p className="text-[10px] font-semibold text-emerald-400">{clubCodeMsg}</p>}
                  </div>
                  {!user.trialEndsAt && <button onClick={activateTrial} className="w-full bg-gray-800 hover:bg-gray-700 text-emerald-400 font-semibold py-2 rounded-xl text-xs border border-emerald-500/30">{t('trialBtn')}</button>}
                </div>
              </div>
            </div>
          )}

          <nav className="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-md border-t border-gray-800 px-6 py-2 flex justify-around items-center z-40">
            <button onClick={() => setActiveTab('board')} className={`flex flex-col items-center space-y-1 ${activeTab === 'board' ? 'text-emerald-400' : 'text-gray-400'}`}><span className="text-xl">⚽</span><span className="text-[10px] font-bold">{t('navBoard')}</span></button>
            <button onClick={() => setActiveTab('drills')} className={`flex flex-col items-center space-y-1 ${activeTab === 'drills' ? 'text-emerald-400' : 'text-gray-400'}`}><span className="text-xl">📋</span><span className="text-[10px] font-bold">{t('navDrills')}</span></button>
            <button onClick={() => setActiveTab('squad')} className={`flex flex-col items-center space-y-1 ${activeTab === 'squad' ? 'text-emerald-400' : 'text-gray-400'}`}><span className="text-xl">👥</span><span className="text-[10px] font-bold">{t('navSquad')}</span></button>
          </nav>
        </div>
      );
    }

    ReactDOM.render(<CoachProApp />, document.getElementById('root'));
  </script>
</body>
</html>
