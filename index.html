<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CoachPro</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: manipulation; user-select: none; }
    .pitch-bg { background-color: #15803d; background-image: repeating-linear-gradient(0deg, #15803d, #15803d 40px, #166534 40px, #166534 80px); }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans">
  <div id="root"></div>
  <script type="text/babel">
    function App() {
      return (
        <div className="p-6 text-center">
          <h1 className="text-2xl font-bold text-emerald-400">CoachPro Funzionante</h1>
          <p className="text-gray-400 mt-2">L'ambiente di React è attivo correttamente.</p>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
