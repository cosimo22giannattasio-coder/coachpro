<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CoachPro - Lavagna &amp; Session Planner</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 Standard UMD (Compatible with Safari iOS) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    /* Prevent iOS Safari elastic bounce & pinch zoom while drawing */
    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      background-color: #030712;
    }

    .touch-pitch {
      touch-action: none !important;
      -webkit-touch-callout: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased">
  <div id="root" class="h-full w-full flex flex-col"></div>

  <script>
    const e = React.createElement;
    const { useState, useRef, useEffect } = React;

    const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/tua_pagina_stripe";

    // Formazioni Preimpostate (% del campo)
    const FORMATIONS = {
      '4-3-3': [
        { role: 'POR', x: 50, y: 92 },
        { role: 'TD',  x: 88, y: 75 },
        { role: 'DC',  x: 62, y: 80 },
        { role: 'DC',  x: 38, y: 80 },
        { role: 'TS',  x: 12, y: 75 },
        { role: 'MED', x: 50, y: 60 },
        { role: 'CC',  x: 72, y: 50 },
        { role: 'CC',  x: 28, y: 50 },
        { role: 'ED',  x: 85, y: 25 },
        { role: 'ATT', x: 50, y: 20 },
        { role: 'ES',  x: 15, y: 25 }
      ],
      '4-4-2': [
        { role: 'POR', x: 50, y: 92 },
        { role: 'TD',  x: 88, y: 75 },
        { role: 'DC',  x: 62, y: 80 },
        { role: 'DC',  x: 38, y: 80 },
        { role: 'TS',  x: 12, y: 75 },
        { role: 'ED',  x: 85, y: 50 },
        { role: 'CC',  x: 62, y: 55 },
        { role: 'CC',  x: 38, y: 55 },
        { role: 'ES',  x: 15, y: 50 },
        { role: 'ATT', x: 62, y: 25 },
        { role: 'ATT', x: 38, y: 25 }
      ],
      '3-5-2': [
        { role: 'POR', x: 50, y: 92 },
        { role: 'DC',  x: 75, y: 80 },
        { role: 'DC',  x: 50, y: 82 },
        { role: 'DC',  x: 25, y: 80 },
        { role: 'ED',  x: 90, y: 48 },
        { role: 'CC',  x: 68, y: 58 },
        { role: 'MED', x: 50, y: 64 },
        { role: 'CC',  x: 32, y: 58 },
        { role: 'ES',  x: 10, y: 48 },
        { role: 'ATT', x: 60, y: 22 },
        { role: 'ATT', x: 40, y: 22 }
      ]
    };

    function CoachProApp() {
      // Navigazione: 'board' | 'drills' | 'microcycle' | 'squad' | 'profile'
      const [activeTab, setActiveTab] = useState('board');
      
      // Stato Utente
      const [user, setUser] = useState({ loggedIn: true, email: 'mister.rossi@coachpro.it', name: 'Mister Marco Rossi', isPro: true, teamName: 'U.S. Triestina' });
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');

      // Stato Lavagna Tattica
      const [pitchView, setPitchView] = useState('full');
      const [tool, setTool] = useState('move'); // 'move', 'player-red', 'player-blue', 'ball', 'cone', 'ladder', 'hurdle', 'arrow-pass', 'arrow-run', 'delete'
      const [playerNumberInput, setPlayerNumberInput] = useState('9');
      
      const [elements, setElements] = useState([
        { id: '1', type: 'player', color: 'red', number: '9', x: 50, y: 38 },
        { id: '2', type: 'player', color: 'red', number: '10', x: 35, y: 48 },
        { id: '3', type: 'player', color: 'blue', number: '4', x: 50, y: 55 },
        { id: '4', type: 'player', color: 'blue', number: '5', x: 65, y: 60 },
        { id: '5', type: 'ball', x: 48, y: 42 },
        { id: '6', type: 'cone', x: 30, y: 30 },
        { id: '7', type: 'cone', x: 70, y: 30 },
        { id: '8', type: 'ladder', x: 15, y: 45 },
        { id: '9', type: 'hurdle', x: 82, y: 45 }
      ]);
      const [arrows, setArrows] = useState([
        { id: 'a1', startX: 50, startY: 38, endX: 35, endY: 48, type: 'pass' }
      ]);
      const [history, setHistory] = useState([]);

      const [draggingId, setDraggingId] = useState(null);
      const [isDrawingArrow, setIsDrawingArrow] = useState(false);
      const [arrowStart, setArrowStart] = useState(null);
      const [arrowPreview, setArrowPreview] = useState(null);

      // Esercizi Archivio
      const [drills, setDrills] = useState([
        {
          id: 'd1',
          title: 'Rondo 4v2 con Uscita in Ampiezza',
          category: 'Possesso Palla',
          duration: '15 min',
          pitchSize: '20x20 m',
          players: '6 Giocatori',
          intensity: 'Alta',
          equipment: '10 Coni, 2 Palloni',
          description: 'Mantenimento del possesso palla in uno spazio stretto. Al recupero dei 2 difensori, cercare immediatamente l\'uscita verso l\'esterno su sponda per il ribaltamento di fronte.',
          keyPoints: 'Orientamento del corpo, trasmissione di prima intenzione, reazione rapida alla transizione.'
        },
        {
          id: 'd2',
          title: 'Costruzione dal Basso vs Pressing 4-3-3',
          category: 'Tattica',
          duration: '25 min',
          pitchSize: 'Metà Campo',
          players: '11v10',
          intensity: 'Alta',
          equipment: 'Casacche Rossi/Blu, Palloni',
          description: 'Esercitazione guidata per l\'uscita dal primo pressing avversario sfruttando l\'abbassamento del mediano o la sovrapposizione del terzino opposto.',
          keyPoints: 'Smarcamento fuori ombra di pressione, conduzione nello spazio libero, verticalizzazione rapida.'
        },
        {
          id: 'd3',
          title: 'Circuit Training Reattività & Tiro',
          category: 'Atletica',
          duration: '20 min',
          pitchSize: 'Area Rigore',
          players: 'Tutta la rosa',
          intensity: 'Massima',
          equipment: 'Scaletta agility, 4 Ostacoli, Palloni',
          description: 'Lavoro ad alta intensità: coordinazione sulla scaletta, salto dell\'ostacolo e conclusione immediata a rete al limite dell\'area.',
          keyPoints: 'Coordinazione appoggi, esplosività, accuratezza di tiro sotto affaticamento.'
        }
      ]);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Tutti');
      const [showNewDrillModal, setShowNewDrillModal] = useState(false);
      const [newDrill, setNewDrill] = useState({
        title: '', category: 'Possesso Palla', duration: '15 min', pitchSize: '20x20 m', players: '8', intensity: 'Alta', equipment: 'Coni, Palloni', description: '', keyPoints: ''
      });

      // Rosa Giocatori
      const [players, setPlayers] = useState([
        { id: 'p1', name: 'Marco Rossi', role: 'Attaccante', number: 9, status: 'Presente' },
        { id: 'p2', name: 'Giuseppe Verdi', role: 'Centrocampista', number: 10, status: 'Presente' },
        { id: 'p3', name: 'Alessandro Bianchi', role: 'Difensore', number: 4, status: 'Infortunato' },
        { id: 'p4', name: 'Luca Ferrari', role: 'Portiere', number: 1, status: 'Presente' },
        { id: 'p5', name: 'Andrea Russo', role: 'Terzino', number: 3, status: 'Assente' },
        { id: 'p6', name: 'Matteo Romano', role: 'Centrocampista', number: 8, status: 'Presente' }
      ]);
      const [showAddPlayerModal, setShowAddPlayerModal] = useState(false);
      const [newPlayer, setNewPlayer] = useState({ name: '', role: 'Centrocampista', number: '' });

      // Microciclo
      const [microcycle, setMicrocycle] = useState([
        { day: 'Lunedì', title: 'Scarico & Analisi Video', focus: 'Recupero attivo & Correzione errori tattici', duration: '60 min', intensity: 'Bassa' },
        { day: 'Martedì', title: 'Forza & Possesso Palla', focus: 'Potenza aerobica & Rondos ad alta intensità', duration: '90 min', intensity: 'Massima' },
        { day: 'Mercoledì', title: 'Transizioni & Velocità', focus: 'Attacco rapido e ripiegamento difensivo', duration: '90 min', intensity: 'Alta' },
        { day: 'Giovedì', title: 'Tattica Collettiva (11v11)', focus: 'Pressione, blocco medio e sviluppo di gioco', duration: '75 min', intensity: 'Media' },
        { day: 'Venerdì', title: 'Rifinitura & Palle Inattive', focus: 'Reattività, calci d\'angolo e punizioni', duration: '60 min', intensity: 'Bassa/Media' },
        { day: 'Sabato', title: 'MATCH DAY - CAMPIONATO', focus: 'Applicazione del piano gara & Focus 100%', duration: '90 min', intensity: 'Gara' },
        { day: 'Domenica', title: 'Riposo Rigenerativo', focus: 'Recupero fisico e mentale', duration: '0 min', intensity: 'Riposo' }
      ]);

      const [showProModal, setShowProModal] = useState(false);
      const [pdfPreviewDrill, setPdfPreviewDrill] = useState(null);

      const svgRef = useRef(null);

      // Calcolo coordinate sicuro per Safari (Touch & Mouse)
      const getSvgCoordinates = (e) => {
        if (!svgRef.current) return { x: 50, y: 50 };
        const rect = svgRef.current.getBoundingClientRect();
        
        let clientX = e.clientX;
        let clientY = e.clientY;

        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else if (e.changedTouches && e.changedTouches.length > 0) {
          clientX = e.changedTouches[0].clientX;
          clientY = e.changedTouches[0].clientY;
        }

        const x = Math.max(3, Math.min(97, ((clientX - rect.left) / rect.width) * 100));
        const y = Math.max(3, Math.min(97, ((clientY - rect.top) / rect.height) * 100));
        return { x, y };
      };

      const saveHistoryState = () => {
        setHistory(prev => [...prev.slice(-10), { elements: JSON.parse(JSON.stringify(elements)), arrows: JSON.parse(JSON.stringify(arrows)) }]);
      };

      const undoLastAction = () => {
        if (history.length === 0) return;
        const lastState = history[history.length - 1];
        setElements(lastState.elements);
        setArrows(lastState.arrows);
        setHistory(prev => prev.slice(0, -1));
      };

      // Gestori Tocco/Pointer Lavagna
      const handleBoardPointerDown = (evt) => {
        if (tool === 'move') return;

        saveHistoryState();
        const { x, y } = getSvgCoordinates(evt);

        if (tool === 'player-red') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'red', number: playerNumberInput || '7', x, y }]);
        } else if (tool === 'player-blue') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'blue', number: playerNumberInput || '4', x, y }]);
        } else if (tool === 'ball') {
          setElements([...elements, { id: Date.now().toString(), type: 'ball', x, y }]);
        } else if (tool === 'cone') {
          setElements([...elements, { id: Date.now().toString(), type: 'cone', x, y }]);
        } else if (tool === 'ladder') {
          setElements([...elements, { id: Date.now().toString(), type: 'ladder', x, y }]);
        } else if (tool === 'hurdle') {
          setElements([...elements, { id: Date.now().toString(), type: 'hurdle', x, y }]);
        } else if (tool === 'arrow-pass' || tool === 'arrow-run') {
          if (!isDrawingArrow) {
            setIsDrawingArrow(true);
            setArrowStart({ x, y });
            setArrowPreview({ startX: x, startY: y, endX: x, endY: y, type: tool === 'arrow-pass' ? 'pass' : 'run' });
          } else {
            setArrows([...arrows, { id: Date.now().toString(), startX: arrowStart.x, startY: arrowStart.y, endX: x, endY: y, type: tool === 'arrow-pass' ? 'pass' : 'run' }]);
            setIsDrawingArrow(false);
            setArrowStart(null);
            setArrowPreview(null);
          }
        }
      };

      const handleBoardPointerMove = (evt) => {
        if (isDrawingArrow && arrowStart) {
          const { x, y } = getSvgCoordinates(evt);
          setArrowPreview(prev => (prev ? { ...prev, endX: x, endY: y } : null));
        }

        if (draggingId) {
          const { x, y } = getSvgCoordinates(evt);
          setElements(elements.map(el => el.id === draggingId ? { ...el, x, y } : el));
        }
      };

      const handleBoardPointerUp = () => {
        if (draggingId) {
          setDraggingId(null);
        }
      };

      const handleElementPointerDown = (id, evt) => {
        evt.stopPropagation();
        saveHistoryState();

        if (tool === 'delete') {
          setElements(elements.filter(el => el.id !== id));
        } else if (tool === 'move') {
          setDraggingId(id);
        }
      };

      const handleArrowClick = (id, evt) => {
        evt.stopPropagation();
        if (tool === 'delete') {
          saveHistoryState();
          setArrows(arrows.filter(a => a.id !== id));
        }
      };

      const applyFormation = (formationKey, color) => {
        saveHistoryState();
        const selectedFormation = FORMATIONS[formationKey];
        if (!selectedFormation) return;

        const filtered = elements.filter(el => !(el.type === 'player' && el.color === color));

        const newPlayers = selectedFormation.map((pos, index) => ({
          id: Date.now().toString() + index,
          type: 'player',
          color: color,
          number: (index + 1).toString(),
          x: color === 'blue' ? pos.x : 100 - pos.x,
          y: color === 'blue' ? pos.y : 100 - pos.y
        }));

        setElements([...filtered, ...newPlayers]);
      };

      // WhatsApp Exporter
      const handleShareWhatsApp = (drill) => {
        const text = `⚽ *COACHPRO - SCHEDA ESERCIZIO*\n\n📌 *Titolo:* ${drill.title}\n⏱️ *Durata:* ${drill.duration} | 📐 *Campo:* ${drill.pitchSize}\n👥 *Giocatori:* ${drill.players} | 🔥 *Intensità:* ${drill.intensity}\n📂 *Categoria:* ${drill.category}\n🎒 *Attrezzatura:* ${drill.equipment || 'Standard'}\n\n📝 *Descrizione:*\n${drill.description}\n\n💡 *Punti Chiave:*\n${drill.keyPoints}\n\n_Inviato tramite CoachPro App_`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      };

      const handleSaveDrill = (evt) => {
        evt.preventDefault();
        if (!newDrill.title) return;
        setDrills([{ ...newDrill, id: Date.now().toString() }, ...drills]);
        setShowNewDrillModal(false);
        setNewDrill({ title: '', category: 'Possesso Palla', duration: '15 min', pitchSize: '20x20 m', players: '8', intensity: 'Alta', equipment: 'Coni, Palloni', description: '', keyPoints: '' });
      };

      const handleAddPlayer = (evt) => {
        evt.preventDefault();
        if (!newPlayer.name) return;
        const autoNumber = newPlayer.number || (players.length ? Math.max(...players.map(p => p.number)) + 1 : 1);
        setPlayers([...players, { id: Date.now().toString(), name: newPlayer.name, role: newPlayer.role, number: Number(autoNumber), status: 'Presente' }]);
        setShowAddPlayerModal(false);
        setNewPlayer({ name: '', role: 'Centrocampista', number: '' });
      };

      const togglePlayerStatus = (id) => {
        setPlayers(players.map(p => {
          if (p.id === id) {
            const nextStatus = p.status === 'Presente' ? 'Assente' : p.status === 'Assente' ? 'Infortunato' : 'Presente';
            return { ...p, status: nextStatus };
          }
          return p;
        }));
      };

      const handleAuthSubmit = (evt) => {
        evt.preventDefault();
        if (!authEmail) return;
        setUser({
          loggedIn: true,
          email: authEmail,
          name: authEmail.split('@')[0].toUpperCase(),
          isPro: true,
          teamName: 'U.S. Triestina'
        });
        setShowAuthModal(false);
      };

      const presentCount = players.filter(p => p.status === 'Presente').length;
      const injuredCount = players.filter(p => p.status === 'Infortunato').length;

      // ==================== RENDERING COMPONENTI ====================

      // HEADER
      const renderHeader = () => e('header', { className: "bg-gray-900 border-b border-gray-800 px-4 py-3 flex items-center justify-between sticky top-0 z-40 no-print" },
        e('div', { className: "flex items-center space-x-3" },
          e('div', { className: "bg-emerald-500 text-gray-950 p-2 rounded-xl font-black text-xl flex items-center justify-center w-10 h-10 shadow-lg shadow-emerald-500/20" }, "CP"),
          e('div', null,
            e('div', { className: "flex items-center space-x-1.5" },
              e('h1', { className: "font-extrabold text-base leading-tight text-white" }, "CoachPro"),
              e('span', { className: "bg-emerald-500/20 text-emerald-400 text-[10px] font-black px-1.5 py-0.5 rounded border border-emerald-500/30" }, "PRO")
            ),
            e('span', { className: "text-[11px] text-gray-400 font-semibold block" }, user.teamName)
          )
        ),
        e('div', { className: "flex items-center space-x-2" },
          e('button', { 
            onClick: () => setShowProModal(true),
            className: "bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black px-3 py-1.5 rounded-xl text-xs shadow-md shadow-emerald-500/20 transition flex items-center space-x-1" 
          }, "⚡ PRO"),
          e('button', { 
            onClick: () => setActiveTab('profile'),
            className: "bg-gray-800 hover:bg-gray-700 text-gray-200 p-2 rounded-xl border border-gray-700 text-xs flex items-center justify-center w-9 h-9" 
          }, "👤")
        )
      );

      // TAB 1: LAVAGNA TATTICA
      const renderBoardTab = () => e('div', { className: "space-y-3" },
        // Toolbar Strumenti
        e('div', { className: "bg-gray-900 p-2.5 rounded-2xl border border-gray-800 space-y-2.5 shadow-lg" },
          e('div', { className: "grid grid-cols-5 gap-1.5 text-xs font-semibold" },
            [
              { key: 'move', icon: '👆', label: 'Sposta', color: 'emerald' },
              { key: 'player-red', icon: '🔴', label: 'Rosso', color: 'red' },
              { key: 'player-blue', icon: '🔵', label: 'Blu', color: 'blue' },
              { key: 'ball', icon: '⚽', label: 'Palla', color: 'amber' },
              { key: 'cone', icon: '🔶', label: 'Cono', color: 'orange' },
              { key: 'ladder', icon: '🪜', label: 'Scaletta', color: 'yellow' },
              { key: 'hurdle', icon: '🚧', label: 'Ostacolo', color: 'purple' },
              { key: 'arrow-pass', icon: '➡️', label: 'Passaggio', color: 'emerald' },
              { key: 'arrow-run', icon: '💨', label: 'Corsa', color: 'amber' },
              { key: 'delete', icon: '🧹', label: 'Gomma', color: 'red' }
            ].map(t => e('button', {
              key: t.key,
              onClick: () => setTool(t.key),
              className: `p-2 rounded-xl flex flex-col items-center justify-center transition ${tool === t.key ? `bg-${t.color}-500/20 text-${t.color}-400 border border-${t.color}-500/50` : 'bg-gray-800/80 text-gray-300'}`
            }, e('span', { className: "text-base" }, t.icon), e('span', { className: "text-[10px] mt-0.5" }, t.label)))
          ),
          // Controlli Secondari
          e('div', { className: "flex items-center justify-between pt-2 border-t border-gray-800 text-xs" },
            e('div', { className: "flex items-center space-x-3" },
              e('div', { className: "flex items-center space-x-1" },
                e('span', { className: "text-gray-400 font-medium" }, "N°:"),
                e('input', {
                  type: 'text',
                  value: playerNumberInput,
                  onChange: (ev) => setPlayerNumberInput(ev.target.value),
                  className: "w-9 bg-gray-950 border border-gray-700 rounded-lg px-1 py-0.5 text-center font-bold text-emerald-400 focus:outline-none",
                  maxLength: "2"
                })
              ),
              e('button', {
                onClick: () => setPitchView(pitchView === 'full' ? 'half' : 'full'),
                className: "bg-gray-800 border border-gray-700 px-2.5 py-1 rounded-lg text-[11px] font-bold text-gray-200"
              }, pitchView === 'full' ? 'Metà Campo' : 'Campo Intero')
            ),
            e('div', { className: "flex items-center space-x-2" },
              e('button', {
                onClick: undoLastAction,
                disabled: history.length === 0,
                className: `px-2 py-1 rounded-lg text-xs font-bold border ${history.length > 0 ? 'bg-gray-800 text-gray-200 border-gray-700' : 'bg-gray-950 text-gray-600 border-gray-800'}`
              }, "↩️ Annulla"),
              e('button', {
                onClick: () => { saveHistoryState(); setElements([]); setArrows([]); },
                className: "text-red-400 text-xs font-semibold px-2 py-1 rounded-lg bg-red-950/40 border border-red-900/40"
              }, "🗑️ Pulisci")
            )
          )
        ),
        // Campo SVG
        e('div', { className: `relative w-full ${pitchView === 'full' ? 'aspect-[3/4]' : 'aspect-[4/3]'} bg-gradient-to-b from-emerald-900 via-emerald-800 to-emerald-950 rounded-3xl overflow-hidden shadow-2xl border-4 border-gray-800 touch-pitch` },
          e('svg', {
            ref: svgRef,
            className: "w-full h-full cursor-crosshair touch-pitch",
            onPointerDown: handleBoardPointerDown,
            onPointerMove: handleBoardPointerMove,
            onPointerUp: handleBoardPointerUp,
            onTouchStart: handleBoardPointerDown,
            onTouchMove: handleBoardPointerMove,
            onTouchEnd: handleBoardPointerUp
          },
            e('defs', null,
              e('marker', { id: 'arrow-pass-head', markerWidth: "8", markerHeight: "6", refX: "7", refY: "3", orient: "auto" },
                e('polygon', { points: "0 0, 8 3, 0 6", fill: "#34d399" })
              ),
              e('marker', { id: 'arrow-run-head', markerWidth: "8", markerHeight: "6", refX: "7", refY: "3", orient: "auto" },
                e('polygon', { points: "0 0, 8 3, 0 6", fill: "#fbbf24" })
              )
            ),
            // Tracciato Campo
            e('rect', { x: "4%", y: "4%", width: "92%", height: "92%", fill: "none", stroke: "white", strokeWidth: "2", strokeOpacity: "0.75" }),
            pitchView === 'full' && e(React.Fragment, null,
              e('line', { x1: "4%", y1: "50%", x2: "96%", y2: "50%", stroke: "white", strokeWidth: "2", strokeOpacity: "0.75" }),
              e('circle', { cx: "50%", cy: "50%", r: "16%", fill: "none", stroke: "white", strokeWidth: "2", strokeOpacity: "0.75" }),
              e('circle', { cx: "50%", cy: "50%", r: "1.5%", fill: "white", fillOpacity: "0.8" })
            ),
            e('rect', { x: "25%", y: "4%", width: "50%", height: "16%", fill: "none", stroke: "white", strokeWidth: "2", strokeOpacity: "0.75" }),
            e('rect', { x: "37%", y: "4%", width: "26%", height: "6%", fill: "none", stroke: "white", strokeWidth: "2", strokeOpacity: "0.75" }),
            pitchView === 'full' && e(React.Fragment, null,
              e('rect', { x: "25%", y: "80%", width: "50%", height: "16%", fill: "none", stroke: "white", strokeWidth: "2", strokeOpacity: "0.75" }),
              e('rect', { x: "37%", y: "90%", width: "26%", height: "6%", fill: "none", stroke: "white", strokeWidth: "2", strokeOpacity: "0.75" })
            ),
            // Frecce
            arrows.map(arr => e('line', {
              key: arr.id,
              x1: `${arr.startX}%`, y1: `${arr.startY}%`,
              x2: `${arr.endX}%`, y2: `${arr.endY}%`,
              stroke: arr.type === 'pass' ? '#34d399' : '#fbbf24',
              strokeWidth: "3.5",
              strokeDasharray: arr.type === 'run' ? '6 4' : 'none',
              markerEnd: arr.type === 'pass' ? 'url(#arrow-pass-head)' : 'url(#arrow-run-head)',
              onClick: (ev) => handleArrowClick(arr.id, ev)
            })),
            arrowPreview && e('line', {
              x1: `${arrowPreview.startX}%`, y1: `${arrowPreview.startY}%`,
              x2: `${arrowPreview.endX}%`, y2: `${arrowPreview.endY}%`,
              stroke: arrowPreview.type === 'pass' ? '#34d399' : '#fbbf24',
              strokeWidth: "3.5",
              strokeDasharray: arrowPreview.type === 'run' ? '6 4' : 'none',
              opacity: "0.6"
            }),
            // Elementi
            elements.map(el => e('g', {
              key: el.id,
              onPointerDown: (ev) => handleElementPointerDown(el.id, ev),
              onTouchStart: (ev) => handleElementPointerDown(el.id, ev),
              className: "cursor-grab"
            },
              el.type === 'player' && e('g', null,
                e('circle', { cx: `${el.x}%`, cy: `${el.y}%`, r: "15", fill: el.color === 'red' ? '#ef4444' : '#3b82f6', stroke: "white", strokeWidth: "2.5" }),
                e('text', { x: `${el.x}%`, y: `${el.y}%`, dominantBaseline: "central", textAnchor: "middle", fill: "white", fontSize: "12", fontWeight: "800", pointerEvents: "none" }, el.number)
              ),
              el.type === 'ball' && e('g', null,
                e('circle', { cx: `${el.x}%`, cy: `${el.y}%`, r: "8", fill: "white", stroke: "#111827", strokeWidth: "2" }),
                e('circle', { cx: `${el.x}%`, cy: `${el.y}%`, r: "2.5", fill: "#111827" })
              ),
              el.type === 'cone' && e('polygon', {
                points: `${el.x}%,${el.y - 2.5}% ${el.x - 1.8}%,${el.y + 2}% ${el.x + 1.8}%,${el.y + 2}%`,
                fill: "#f97316", stroke: "#ea580c", strokeWidth: "1.5"
              }),
              el.type === 'ladder' && e('g', null,
                e('rect', { x: `${el.x - 2}%`, y: `${el.y - 6}%`, width: "4%", height: "12%", fill: "none", stroke: "#eab308", strokeWidth: "2", rx: "2" }),
                e('line', { x1: `${el.x - 2}%`, y1: `${el.y - 2}%`, x2: `${el.x + 2}%`, y2: `${el.y - 2}%`, stroke: "#eab308", strokeWidth: "2" }),
                e('line', { x1: `${el.x - 2}%`, y1: `${el.y + 2}%`, x2: `${el.x + 2}%`, y2: `${el.y + 2}%`, stroke: "#eab308", strokeWidth: "2" })
              ),
              el.type === 'hurdle' && e('g', null,
                e('rect', { x: `${el.x - 2.5}%`, y: `${el.y - 1}%`, width: "5%", height: "2%", fill: "#a855f7", stroke: "white", strokeWidth: "1" }),
                e('line', { x1: `${el.x - 2}%`, y1: `${el.y - 1}%`, x2: `${el.x - 2}%`, y2: `${el.y + 2}%`, stroke: "#a855f7", strokeWidth: "2" }),
                e('line', { x1: `${el.x + 2}%`, y1: `${el.y - 1}%`, x2: `${el.x + 2}%`, y2: `${el.y + 2}%`, stroke: "#a855f7", strokeWidth: "2" })
              )
            ))
          )
        ),
        // Formazioni Rapide
        e('div', { className: "bg-gray-900 p-3 rounded-2xl border border-gray-800 space-y-2" },
          e('div', { className: "text-xs font-bold text-gray-400 uppercase tracking-wider" }, "Formazioni Rapide:"),
          e('div', { className: "grid grid-cols-3 gap-2 text-xs font-bold" },
            e('button', { onClick: () => applyFormation('4-3-3', 'red'), className: "bg-gray-800 hover:bg-gray-700 text-red-400 py-2 rounded-xl border border-red-500/30" }, "4-3-3 (Rosso)"),
            e('button', { onClick: () => applyFormation('4-4-2', 'red'), className: "bg-gray-800 hover:bg-gray-700 text-red-400 py-2 rounded-xl border border-red-500/30" }, "4-4-2 (Rosso)"),
            e('button', { onClick: () => applyFormation('3-5-2', 'blue'), className: "bg-gray-800 hover:bg-gray-700 text-blue-400 py-2 rounded-xl border border-blue-500/30" }, "3-5-2 (Blu)")
          )
        )
      );

      // TAB 2: ARCHIVIO ESERCIZI
      const renderDrillsTab = () => e('div', { className: "space-y-4" },
        e('div', { className: "flex justify-between items-center" },
          e('div', null,
            e('h2', { className: "text-xl font-bold text-white" }, "Archivio Esercitazioni"),
            e('p', { className: "text-xs text-gray-400" }, "Database schede di lavoro")
          ),
          e('button', {
            onClick: () => setShowNewDrillModal(true),
            className: "bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold px-3 py-2 rounded-xl text-xs flex items-center space-x-1"
          }, "➕ Nuovo Esercizio")
        ),
        e('input', {
          type: 'text',
          placeholder: '🔍 Cerca esercizio...',
          value: searchQuery,
          onChange: (ev) => setSearchQuery(ev.target.value),
          className: "w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
        }),
        e('div', { className: "flex space-x-2 overflow-x-auto no-scrollbar py-1" },
          ['Tutti', 'Possesso Palla', 'Tattica', 'Atletica', 'Portieri'].map(cat => e('button', {
            key: cat,
            onClick: () => setSelectedCategory(cat),
            className: `px-3 py-1.5 rounded-xl text-xs whitespace-nowrap font-medium transition ${selectedCategory === cat ? 'bg-emerald-500 text-gray-950 font-bold' : 'bg-gray-900 text-gray-400 border border-gray-800'}`
          }, cat))
        ),
        e('div', { className: "space-y-3" },
          drills
            .filter(d => (selectedCategory === 'Tutti' || d.category === selectedCategory) && d.title.toLowerCase().includes(searchQuery.toLowerCase()))
            .map(drill => e('div', { key: drill.id, className: "bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3 shadow-lg" },
              e('div', { className: "flex justify-between items-start" },
                e('div', null,
                  e('span', { className: "inline-block bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider mb-1 border border-emerald-500/20" }, drill.category),
                  e('h3', { className: "font-bold text-base text-white" }, drill.title)
                ),
                e('span', { className: "text-xs bg-gray-800 text-gray-300 font-semibold px-2 py-1 rounded-lg" }, `⏱️ ${drill.duration}`)
              ),
              e('p', { className: "text-xs text-gray-300 leading-relaxed" }, drill.description),
              drill.keyPoints && e('div', { className: "text-xs bg-emerald-950/30 border-l-2 border-emerald-500 p-2 rounded-r-lg text-emerald-300" }, `💡 Punti Chiave: ${drill.keyPoints}`),
              e('div', { className: "flex justify-end space-x-2 pt-2 border-t border-gray-800" },
                e('button', { onClick: () => setPdfPreviewDrill(drill), className: "bg-gray-800 text-gray-300 text-xs px-3 py-1.5 rounded-xl font-semibold" }, "🖨️ Stampa PDF"),
                e('button', { onClick: () => handleShareWhatsApp(drill), className: "bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1.5 rounded-xl font-bold" }, "📲 Invia WhatsApp")
              )
            ))
        )
      );

      // TAB 3: MICROCICLO
      const renderMicrocycleTab = () => e('div', { className: "space-y-4" },
        e('h2', { className: "text-xl font-bold text-white" }, "Microciclo Settimanale"),
        e('div', { className: "space-y-2.5" },
          microcycle.map((day, idx) => e('div', { key: idx, className: "bg-gray-900 border border-gray-800 p-3.5 rounded-2xl space-y-1.5" },
            e('div', { className: "flex items-center justify-between" },
              e('span', { className: "font-black text-sm text-emerald-400" }, day.day),
              e('span', { className: "text-xs text-gray-400" }, `⏱️ ${day.duration}`)
            ),
            e('h4', { className: "font-bold text-sm text-white" }, day.title),
            e('p', { className: "text-xs text-gray-400" }, day.focus)
          ))
        )
      );

      // TAB 4: ROSA GIOCATORI
      const renderSquadTab = () => e('div', { className: "space-y-4" },
        e('div', { className: "flex justify-between items-center" },
          e('h2', { className: "text-xl font-bold text-white" }, "Rosa & Presenze"),
          e('button', { onClick: () => setShowAddPlayerModal(true), className: "bg-emerald-500 text-gray-950 font-bold px-3 py-2 rounded-xl text-xs" }, "➕ Nuovo Giocatore")
        ),
        e('div', { className: "grid grid-cols-3 gap-2 text-center text-xs" },
          e('div', { className: "bg-gray-900 border border-gray-800 p-3 rounded-2xl" }, e('span', { className: "text-gray-400 block text-[10px] font-bold" }, "TOTALE"), e('span', { className: "text-lg font-black text-white" }, players.length)),
          e('div', { className: "bg-gray-900 border border-gray-800 p-3 rounded-2xl" }, e('span', { className: "text-emerald-400 block text-[10px] font-bold" }, "PRESENTI"), e('span', { className: "text-lg font-black text-emerald-400" }, presentCount)),
          e('div', { className: "bg-gray-900 border border-gray-800 p-3 rounded-2xl" }, e('span', { className: "text-amber-400 block text-[10px] font-bold" }, "INFORTUNATI"), e('span', { className: "text-lg font-black text-amber-400" }, injuredCount))
        ),
        e('div', { className: "space-y-2" },
          players.map(p => e('div', { key: p.id, className: "bg-gray-900 border border-gray-800 p-3 rounded-2xl flex items-center justify-between" },
            e('div', { className: "flex items-center space-x-3" },
              e('div', { className: "w-8 h-8 rounded-xl bg-gray-950 flex items-center justify-center font-black text-xs text-emerald-400" }, p.number),
              e('div', null, e('h4', { className: "font-bold text-xs text-white" }, p.name), e('span', { className: "text-[10px] text-gray-400" }, p.role))
            ),
            e('button', {
              onClick: () => togglePlayerStatus(p.id),
              className: `text-xs px-3 py-1.5 rounded-xl font-bold ${p.status === 'Presente' ? 'bg-emerald-500/20 text-emerald-400' : p.status === 'Assente' ? 'bg-red-500/20 text-red-400' : 'bg-amber-500/20 text-amber-400'}`
            }, p.status)
          ))
        )
      );

      // TAB 5: PROFILO / ACCOUNT
      const renderProfileTab = () => e('div', { className: "space-y-4" },
        e('h2', { className: "text-xl font-bold text-white" }, "Profilo & Abbonamento"),
        e('div', { className: "bg-gray-900 border border-gray-800 p-4 rounded-2xl space-y-3" },
          e('h3', { className: "font-bold text-base text-white" }, user.name),
          e('p', { className: "text-xs text-gray-400" }, user.email),
          e('div', { className: "bg-gray-950 p-3 rounded-xl border border-gray-800 text-xs flex justify-between items-center" },
            e('span', { className: "text-emerald-400 font-bold" }, "Piano PRO Attivo (29,99€/anno)"),
            e('span', { className: "bg-emerald-500 text-gray-950 font-black px-2 py-0.5 rounded text-[10px]" }, "ATTIVO")
          )
        ),
        e('button', {
          onClick: () => window.open(STRIPE_PAYMENT_LINK, '_blank'),
          className: "w-full bg-gradient-to-r from-emerald-500 to-teal-400 text-gray-950 font-black py-3 rounded-2xl text-xs uppercase shadow-lg shadow-emerald-500/20"
        }, "💳 GESTISCI ABBONAMENTO SU STRIPE"),
        e('div', { className: "text-center pt-4" },
          e('button', { onClick: () => setShowAuthModal(true), className: "text-xs text-gray-400 underline" }, "Cambia o Effettua Login")
        )
      );

      // NAV BAR INFERIORE SAFARI FRIENDLY
      const renderBottomNav = () => e('nav', { className: "fixed bottom-0 left-0 right-0 max-w-md md:max-w-4xl mx-auto bg-gray-900/95 backdrop-blur-md border-t border-gray-800 px-3 py-2 flex justify-around items-center z-40 no-print" },
        [
          { id: 'board', icon: '⚽', label: 'Lavagna' },
          { id: 'drills', icon: '📋', label: 'Esercizi' },
          { id: 'microcycle', icon: '📅', label: 'Microciclo' },
          { id: 'squad', icon: '👥', label: 'Rosa' },
          { id: 'profile', icon: '👤', label: 'Account' }
        ].map(item => e('button', {
          key: item.id,
          onClick: () => setActiveTab(item.id),
          className: `flex flex-col items-center transition ${activeTab === item.id ? 'text-emerald-400 font-bold scale-105' : 'text-gray-500'}`
        }, e('span', { className: "text-lg" }, item.icon), e('span', { className: "text-[10px] mt-0.5" }, item.label)))
      );

      // APPLICAZIONE PRINCIPALE (CONTAINER)
      return e('div', { className: "min-h-screen max-w-md md:max-w-4xl mx-auto bg-gray-950 text-gray-100 flex flex-col justify-between shadow-2xl border-x border-gray-800" },
        renderHeader(),
        e('main', { className: "flex-1 p-3 md:p-6 overflow-y-auto pb-24" },
          activeTab === 'board' && renderBoardTab(),
          activeTab === 'drills' && renderDrillsTab(),
          activeTab === 'microcycle' && renderMicrocycleTab(),
          activeTab === 'squad' && renderSquadTab(),
          activeTab === 'profile' && renderProfileTab()
        ),
        renderBottomNav(),
        // MODALE PRINT PDF
        pdfPreviewDrill && e('div', { className: "fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50" },
          e('div', { className: "bg-gray-900 border border-gray-800 rounded-3xl p-6 w-full max-w-lg space-y-4" },
            e('div', { className: "flex justify-between items-center border-b border-gray-800 pb-2" },
              e('h3', { className: "font-bold text-white text-base" }, "Scheda PDF Stampa"),
              e('button', { onClick: () => setPdfPreviewDrill(null), className: "text-gray-400" }, "✕")
            ),
            e('div', { className: "bg-white text-gray-950 p-4 rounded-xl space-y-2 text-xs" },
              e('h2', { className: "font-black text-lg text-emerald-800" }, pdfPreviewDrill.title),
              e('p', null, pdfPreviewDrill.description)
            ),
            e('button', { onClick: () => window.print(), className: "w-full bg-emerald-500 text-gray-950 font-bold py-2.5 rounded-xl text-xs" }, "🖨️ Stampa Adesso")
          )
        ),
        // MODALE STRIPE PRO
        showProModal && e('div', { className: "fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50" },
          e('div', { className: "bg-gray-900 border border-emerald-500/40 rounded-3xl p-6 w-full max-w-sm text-center space-y-4" },
            e('h3', { className: "text-xl font-black text-white" }, "CoachPro Unlimited"),
            e('p', { className: "text-xs text-gray-400" }, "Sblocca tutti i moduli rapidi, l'export PDF illimitato e il backup sul Cloud."),
            e('div', { className: "text-2xl font-black text-white" }, "29,99€ / anno"),
            e('button', { onClick: () => window.open(STRIPE_PAYMENT_LINK, '_blank'), className: "w-full bg-emerald-500 text-gray-950 font-black py-3 rounded-2xl text-xs uppercase" }, "PROVA 3 GIORNI SU STRIPE"),
            e('button', { onClick: () => setShowProModal(false), className: "text-xs text-gray-400 underline block mx-auto" }, "Chiudi")
          )
        )
      );
    }

    // React 18 Mounting sicuro per WebKit / Safari
    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('root');
      if (container) {
        const root = ReactDOM.createRoot(container);
        root.render(e(CoachProApp));
      }
    });
  </script>
</body>
</html>
