<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CoachPro - Lavagna & Session Planner</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { touch-action: manipulation; user-select: none; -webkit-user-select: none; background-color: #030712; }
    .pitch-bg {
      background-color: #0d5c2f;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08) 0%, transparent 80%),
        repeating-linear-gradient(0deg, #0d5c2f, #0d5c2f 50px, #0f6835 50px, #0f6835 100px);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
    }
    .glass-panel {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    button, input, select { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }

    @media print {
      body * { visibility: hidden; }
      #tactical-pitch-area, #tactical-pitch-area * { visibility: visible; }
      #tactical-pitch-area {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw !important;
        height: 100vh !important;
        border-radius: 0 !important;
      }
    }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans antialiased selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/3cIfZjc5Pg5l5WL2A39sk02";
    const STRIPE_CLUB_PAYMENT_LINK = "https://buy.stripe.com/9B68wRedX2ev2Kz4Ib9sk01";
    const TRIAL_DAYS = 3;

    const translations = {
      it: {
        appTitle: "CoachPro",
        subtitle: "Piattaforma tattica professionale per allenatori",
        loginTitle: "Accedi a CoachPro",
        registerTitle: "Crea Account (3 giorni gratis)",
        namePlaceholder: "es. Mister Rossi",
        emailLabel: "Email",
        passwordLabel: "Password",
        loginButton: "Accedi a CoachPro",
        registerButton: "Crea Account (3 giorni gratis)",
        noAccount: "Non hai un account? Registrati ora",
        hasAccount: "Hai già un account? Accedi",
        proActive: "Piano PRO Attivo",
        exitButton: "Esci",
        quickFormations: "Moduli:",
        toolMove: "Sposta",
        toolRed: "Rosso",
        toolBlue: "Blu",
        toolBall: "Palla",
        toolCone: "Cono",
        toolCinesina: "Cinesina",
        toolLadder: "Scaletta",
        toolArrow: "Freccia",
        toolDelete: "Gomma",
        toolClear: "Pulisci",
        newDrill: "Nuovo Esercizio",
        drillTitlePlaceholder: "Titolo esercitazione...",
        drillDescPlaceholder: "Descrizione ed obbiettivi...",
        saveDrill: "+ Salva Esercizio",
        noDrills: "Nessun esercizio salvato. Creane uno sopra!",
        exportPdf: "📥 Esporta Lavagna",
        exporting: "⏳ Generazione...",
        playerPlaceholder: "Nome giocatore...",
        addPlayer: "Aggiungi",
        noPlayers: "Nessun giocatore in rosa. Aggiungi il primo sopra!",
        navBoard: "Lavagna",
        navDrills: "Esercizi",
        navSquad: "Rosa",
        profileSettings: "Profilo & Impostazioni",
        languageLabel: "Lingua / Language"
      },
      en: {
        appTitle: "CoachPro",
        subtitle: "Professional tactical platform for coaches",
        loginTitle: "Log in to CoachPro",
        registerTitle: "Create Account (3 days free)",
        namePlaceholder: "e.g. Coach Smith",
        emailLabel: "Email",
        passwordLabel: "Password",
        loginButton: "Log in to CoachPro",
        registerButton: "Create Account (3 days free)",
        noAccount: "Don't have an account? Sign up",
        hasAccount: "Already have an account? Log in",
        proActive: "PRO Plan Active",
        exitButton: "Logout",
        quickFormations: "Formations:",
        toolMove: "Move",
        toolRed: "Red",
        toolBlue: "Blue",
        toolBall: "Ball",
        toolCone: "Cone",
        toolCinesina: "Disc",
        toolLadder: "Ladder",
        toolArrow: "Arrow",
        toolDelete: "Eraser",
        toolClear: "Clear",
        newDrill: "New Drill",
        drillTitlePlaceholder: "Drill title...",
        drillDescPlaceholder: "Description and objectives...",
        saveDrill: "+ Save Drill",
        noDrills: "No drills saved. Create one above!",
        exportPdf: "📥 Export Board",
        exporting: "⏳ Exporting...",
        playerPlaceholder: "Player name...",
        addPlayer: "Add",
        noPlayers: "No players in squad. Add the first one above!",
        navBoard: "Board",
        navDrills: "Drills",
        navSquad: "Squad",
        profileSettings: "Profile & Settings",
        languageLabel: "Language"
      }
    };

    function CoachProApp() {
      const [user, setUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [authData, setAuthData] = useState({ name: '', email: '', password: '' });

      const [showProfileDrawer, setShowProfileDrawer] = useState(false);
      const [language, setLanguage] = useState('it');
      const [isExporting, setIsExporting] = useState(false);

      const t = (key) => {
        return (translations[language] && translations[language][key]) || translations['it'][key] || key;
      };

      const [activeTab, setActiveTab] = useState('board');
      const [tool, setTool] = useState('move');
      const [draggedId, setDraggedId] = useState(null);
      const [elements, setElements] = useState([]);
      const [arrows, setArrows] = useState([]);
      const [isDrawingArrow, setIsDrawingArrow] = useState(false);
      const [currentArrowStart, setCurrentArrowStart] = useState(null);

      const [editingPlayerId, setEditingPlayerId] = useState(null);
      const [tempPlayerName, setTempPlayerName] = useState('');

      const [drills, setDrills] = useState([]);
      const [players, setPlayers] = useState([]);
      const [newPlayerName, setNewPlayerName] = useState('');
      const [newPlayerNumber, setNewPlayerNumber] = useState('');
      const [newPlayerRole, setNewPlayerRole] = useState('Centrocampista');
      
      const [newDrillTitle, setNewDrillTitle] = useState('');
      const [newDrillDesc, setNewDrillDesc] = useState('');

      const svgRef = useRef(null);

      const handleAuth = (evt) => {
        evt.preventDefault();
        if (!authData.email) return;
        const displayName = authData.name.trim() ? authData.name.trim() : authData.email.split('@')[0];
        setUser({
          name: displayName,
          email: authData.email,
          isPro: true
        });
      };

      const handleLogout = () => {
        setUser(null);
        setAuthData({ name: '', email: '', password: '' });
      };

      // Esportazione diretta e universale (funziona su Mobile, Tablet e Desktop)
      const handleExportBoard = async () => {
        const pitchElement = document.getElementById('tactical-pitch-area');
        if (!pitchElement) return;

        setIsExporting(true);
        try {
          if (window.html2canvas) {
            const canvas = await window.html2canvas(pitchElement, {
              backgroundColor: '#0d5c2f',
              scale: 2,
              useCORS: true
            });
            const dataUrl = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `CoachPro_Lavagna_${new Date().toISOString().slice(0,10)}.png`;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          } else {
            window.print();
          }
        } catch (err) {
          console.error(err);
          window.print();
        } finally {
          setIsExporting(false);
        }
      };

      const addPlayer = (e) => {
        e.preventDefault();
        if (!newPlayerName.trim()) return;
        setPlayers([...players, {
          id: Date.now().toString(),
          name: newPlayerName.trim(),
          number: newPlayerNumber || '1',
          role: newPlayerRole
        }]);
        setNewPlayerName('');
        setNewPlayerNumber('');
      };

      const removePlayer = (id) => setPlayers(players.filter(p => p.id !== id));

      const addDrill = (e) => {
        e.preventDefault();
        if (!newDrillTitle.trim()) return;
        setDrills([...drills, { id: Date.now().toString(), title: newDrillTitle.trim(), description: newDrillDesc }]);
        setNewDrillTitle('');
        setNewDrillDesc('');
      };

      const removeDrill = (id) => setDrills(drills.filter(d => d.id !== id));

      const presetFormation = (type) => {
        let formationElements = [
          { id: 'p1', type: 'player', color: 'red', number: '1', name: 'Portiere', x: 50, y: 90 }
        ];

        if (type === '433') {
          formationElements.push(
            { id: 'p2', type: 'player', color: 'red', number: '2', name: 'Ter. Dx', x: 20, y: 70 },
            { id: 'p3', type: 'player', color: 'red', number: '5', name: 'Dif. Cen', x: 40, y: 75 },
            { id: 'p4', type: 'player', color: 'red', number: '6', name: 'Dif. Cen', x: 60, y: 75 },
            { id: 'p5', type: 'player', color: 'red', number: '3', name: 'Ter. Sx', x: 80, y: 70 },
            { id: 'p6', type: 'player', color: 'red', number: '8', name: 'Mediano', x: 35, y: 50 },
            { id: 'p7', type: 'player', color: 'red', number: '4', name: 'Regista', x: 50, y: 55 },
            { id: 'p8', type: 'player', color: 'red', number: '10', name: 'Mezzala', x: 65, y: 50 },
            { id: 'p9', type: 'player', color: 'red', number: '7', name: 'Ala Dx', x: 20, y: 25 },
            { id: 'p10', type: 'player', color: 'red', number: '9', name: 'Punta', x: 50, y: 20 },
            { id: 'p11', type: 'player', color: 'red', number: '11', name: 'Ala Sx', x: 80, y: 25 }
          );
        } else if (type === '442') {
          formationElements.push(
            { id: 'p2', type: 'player', color: 'red', number: '2', name: 'Ter. Dx', x: 20, y: 70 },
            { id: 'p3', type: 'player', color: 'red', number: '5', name: 'Dif. Cen', x: 40, y: 75 },
            { id: 'p4', type: 'player', color: 'red', number: '6', name: 'Dif. Cen', x: 60, y: 75 },
            { id: 'p5', type: 'player', color: 'red', number: '3', name: 'Ter. Sx', x: 80, y: 70 },
            { id: 'p6', type: 'player', color: 'red', number: '7', name: 'Est. Dx', x: 20, y: 45 },
            { id: 'p7', type: 'player', color: 'red', number: '4', name: 'Centr.', x: 40, y: 50 },
            { id: 'p8', type: 'player', color: 'red', number: '8', name: 'Centr.', x: 60, y: 50 },
            { id: 'p9', type: 'player', color: 'red', number: '11', name: 'Est. Sx', x: 80, y: 45 },
            { id: 'p10', type: 'player', color: 'red', number: '9', name: 'Prima P.', x: 40, y: 22 },
            { id: 'p11', type: 'player', color: 'red', number: '10', name: 'Seconda P.', x: 60, y: 22 }
          );
        } else if (type === '352') {
          formationElements.push(
            { id: 'p2', type: 'player', color: 'red', number: '2', name: 'Bracc. Dx', x: 30, y: 75 },
            { id: 'p3', type: 'player', color: 'red', number: '5', name: 'Libero', x: 50, y: 80 },
            { id: 'p4', type: 'player', color: 'red', number: '3', name: 'Bracc. Sx', x: 70, y: 75 },
            { id: 'p5', type: 'player', color: 'red', number: '7', name: 'Torn. Dx', x: 15, y: 50 },
            { id: 'p6', type: 'player', color: 'red', number: '8', name: 'Mediano', x: 38, y: 50 },
            { id: 'p7', type: 'player', color: 'red', number: '4', name: 'Regista', x: 50, y: 55 },
            { id: 'p8', type: 'player', color: 'red', number: '10', name: 'Mezzala', x: 62, y: 50 },
            { id: 'p9', type: 'player', color: 'red', number: '11', name: 'Torn. Sx', x: 85, y: 50 },
            { id: 'p10', type: 'player', color: 'red', number: '9', name: 'Attaccante', x: 40, y: 22 },
            { id: 'p11', type: 'player', color: 'red', number: '11', name: 'Attaccante', x: 60, y: 22 }
          );
        } else if (type === '4321') {
          formationElements.push(
            { id: 'p2', type: 'player', color: 'red', number: '2', name: 'Ter. Dx', x: 20, y: 70 },
            { id: 'p3', type: 'player', color: 'red', number: '5', name: 'Dif. Cen', x: 40, y: 75 },
            { id: 'p4', type: 'player', color: 'red', number: '6', name: 'Dif. Cen', x: 60, y: 75 },
            { id: 'p5', type: 'player', color: 'red', number: '3', name: 'Ter. Sx', x: 80, y: 70 },
            { id: 'p6', type: 'player', color: 'red', number: '8', name: 'Mediano', x: 35, y: 55 },
            { id: 'p7', type: 'player', color: 'red', number: '4', name: 'Regista', x: 50, y: 60 },
            { id: 'p8', type: 'player', color: 'red', number: '14', name: 'Mediano', x: 65, y: 55 },
            { id: 'p9', type: 'player', color: 'red', number: '10', name: 'Trequart.', x: 40, y: 35 },
            { id: 'p10', type: 'player', color: 'red', number: '11', name: 'Trequart.', x: 60, y: 35 },
            { id: 'p11', type: 'player', color: 'red', number: '9', name: 'Punta', x: 50, y: 20 }
          );
        }
        setElements(formationElements);
        setArrows([]);
      };

      const getCoords = (evt) => {
        if (!svgRef.current) return { x: 50, y: 50 };
        const rect = svgRef.current.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        const x = Math.max(5, Math.min(95, ((clientX - rect.left) / rect.width) * 100));
        const y = Math.max(5, Math.min(95, ((clientY - rect.top) / rect.height) * 100));
        return { x, y };
      };

      const handleBoardClick = (evt) => {
        if (draggedId) {
          setDraggedId(null);
          return;
        }
        const { x, y } = getCoords(evt);

        if (tool === 'red') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'red', number: (elements.filter(e => e.color === 'red').length + 1).toString(), name: 'Giocatore', x, y }]);
        } else if (tool === 'blue') {
          setElements([...elements, { id: Date.now().toString(), type: 'player', color: 'blue', number: (elements.filter(e => e.color === 'blue').length + 1).toString(), name: 'Avversario', x, y }]);
        } else if (tool === 'ball') {
          setElements([...elements, { id: Date.now().toString(), type: 'ball', x, y }]);
        } else if (tool === 'cone') {
          setElements([...elements, { id: Date.now().toString(), type: 'cone', x, y }]);
        } else if (tool === 'cinesina') {
          setElements([...elements, { id: Date.now().toString(), type: 'cinesina', x, y }]);
        } else if (tool === 'ladder') {
          setElements([...elements, { id: Date.now().toString(), type: 'ladder', x, y }]);
        } else if (tool === 'arrow') {
          if (!isDrawingArrow) {
            setIsDrawingArrow(true);
            setCurrentArrowStart({ x, y });
          } else {
            setArrows([...arrows, { id: Date.now().toString(), startX: currentArrowStart.x, startY: currentArrowStart.y, endX: x, endY: y }]);
            setIsDrawingArrow(false);
            setCurrentArrowStart(null);
          }
        }
      };

      const handleTouchMove = (evt) => {
        if (!draggedId || tool !== 'move') return;
        const { x, y } = getCoords(evt);
        setElements(elements.map(el => el.id === draggedId ? { ...el, x, y } : el));
      };

      if (!user) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center p-4">
            <div className="max-w-md w-full glass-panel p-8 rounded-3xl shadow-2xl">
              <div className="text-center mb-8">
                <div className="w-16 h-16 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-2xl mx-auto flex items-center justify-center font-black text-2xl text-black mb-3 shadow-lg shadow-emerald-500/25">CP</div>
                <h1 className="text-2xl font-black text-white tracking-tight">{t('appTitle')}</h1>
                <p className="text-xs text-gray-400 mt-1">{t('subtitle')}</p>
              </div>

              <form onSubmit={handleAuth} className="space-y-4">
                {authMode === 'register' && (
                  <div>
                    <label className="block text-xs font-bold text-gray-300 mb-1">Nome Mister / Società</label>
                    <input 
                      type="text" 
                      placeholder={t('namePlaceholder')} 
                      value={authData.name} 
                      onChange={(e) => setAuthData({ ...authData, name: e.target.value })} 
                      className="w-full bg-gray-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white"
                    />
                  </div>
                )}
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1">{t('emailLabel')}</label>
                  <input 
                    type="email" 
                    required 
                    placeholder="mister@email.com" 
                    value={authData.email} 
                    onChange={(e) => setAuthData({ ...authData, email: e.target.value })} 
                    className="w-full bg-gray-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1">{t('passwordLabel')}</label>
                  <input 
                    type="password" 
                    required 
                    placeholder="••••••••" 
                    value={authData.password} 
                    onChange={(e) => setAuthData({ ...authData, password: e.target.value })} 
                    className="w-full bg-gray-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white"
                  />
                </div>
                <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-3.5 rounded-xl text-sm shadow-lg shadow-emerald-500/25 transition-all">
                  {authMode === 'login' ? t('loginButton') : t('registerButton')}
                </button>
              </form>

              <div className="mt-6 text-center">
                <button 
                  onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}
                  className="text-xs text-emerald-400 hover:underline font-semibold"
                >
                  {authMode === 'login' ? t('noAccount') : t('hasAccount')}
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-950 text-white flex flex-col">
          <header className="glass-panel border-b border-white/5 px-5 py-3.5 flex items-center justify-between sticky top-0 z-40">
            <div className="flex items-center space-x-3.5">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center font-black text-black shadow-lg shadow-emerald-500/25 tracking-wider">CP</div>
              <div>
                <h1 className="font-bold text-sm tracking-wide text-white">{user.name}</h1>
                <div className="flex items-center space-x-1.5 mt-0.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <p className="text-[10px] text-emerald-400 font-semibold tracking-wide uppercase">{t('proActive')}</p>
                </div>
              </div>
            </div>
            <div className="flex items-center space-x-2.5">
              <button onClick={() => setShowProfileDrawer(!showProfileDrawer)} className="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 text-xs font-bold border border-white/5">⚙️</button>
              <button onClick={handleLogout} className="px-3 py-2 rounded-xl bg-rose-500/10 border border-rose-500/20 hover:bg-rose-500/20 text-rose-400 text-xs font-semibold">{t('exitButton')}</button>
            </div>
          </header>

          {showProfileDrawer && (
            <div className="max-w-5xl w-full mx-auto px-4 pt-3">
              <div className="glass-panel p-4 rounded-2xl flex items-center justify-between">
                <span className="text-xs font-bold text-gray-300">{t('languageLabel')}</span>
                <select value={language} onChange={(e) => setLanguage(e.target.value)} className="bg-gray-900 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white">
                  <option value="it">Italiano</option>
                  <option value="en">English</option>
                </select>
              </div>
            </div>
          )}

          <nav className="glass-panel border-b border-white/5 flex justify-around p-2.5 max-w-5xl w-full mx-auto my-3 rounded-2xl">
            <button onClick={() => setActiveTab('board')} className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-2 ${activeTab === 'board' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/25 font-extrabold' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
              <span>📋</span><span>{t('navBoard')}</span>
            </button>
            <button onClick={() => setActiveTab('drills')} className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-2 ${activeTab === 'drills' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/25 font-extrabold' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
              <span>⚽</span><span>{t('navDrills')}</span>
            </button>
            <button onClick={() => setActiveTab('squad')} className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center space-x-2 ${activeTab === 'squad' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/25 font-extrabold' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
              <span>👥</span><span>{t('navSquad')}</span>
            </button>
          </nav>

          <main className="flex-1 max-w-6xl w-full mx-auto p-4">
            {activeTab === 'board' && (
              <div className="space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3 glass-panel p-3 rounded-2xl">
                  <div className="flex flex-wrap items-center gap-1.5">
                    <span className="text-xs font-bold text-gray-400 mr-1">{t('quickFormations')}</span>
                    <button onClick={() => presetFormation('433')} className="px-3 py-1.5 bg-white/5 hover:bg-white/10 text-xs font-bold rounded-xl border border-white/5">4-3-3</button>
                    <button onClick={() => presetFormation('442')} className="px-3 py-1.5 bg-white/5 hover:bg-white/10 text-xs font-bold rounded-xl border border-white/5">4-4-2</button>
                    <button onClick={() => presetFormation('352')} className="px-3 py-1.5 bg-white/5 hover:bg-white/10 text-xs font-bold rounded-xl border border-white/5">3-5-2</button>
                    <button onClick={() => presetFormation('4321')} className="px-3 py-1.5 bg-white/5 hover:bg-white/10 text-xs font-bold rounded-xl border border-white/5">4-3-2-1</button>
                  </div>
                  <button 
                    type="button"
                    onClick={handleExportBoard} 
                    disabled={isExporting}
                    className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-black text-xs font-extrabold rounded-xl shadow-lg shadow-emerald-500/20"
                  >
                    {isExporting ? t('exporting') : t('exportPdf')}
                  </button>
                </div>

                <div className="flex flex-wrap gap-2 glass-panel p-3 rounded-2xl">
                  <button onClick={() => setTool('move')} className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 ${tool === 'move' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>✋</span><span>{t('toolMove')}</span></button>
                  <button onClick={() => setTool('red')} className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 ${tool === 'red' ? 'bg-rose-600 text-white shadow-lg shadow-rose-600/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>🔴</span><span>{t('toolRed')}</span></button>
                  <button onClick={() => setTool('blue')} className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 ${tool === 'blue' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>🔵</span><span>{t('toolBlue')}</span></button>
                  <button onClick={() => setTool('ball')} className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 ${tool === 'ball' ? 'bg-white text-black shadow-lg shadow-white/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>⚽</span><span>{t('toolBall')}</span></button>
                  <button onClick={() => setTool('cone')} className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 ${tool === 'cone' ? 'bg-orange-600 text-white shadow-lg shadow-orange-600/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>🔺</span><span>{t('toolCone')}</span></button>
                  <button onClick={() => setTool('cinesina')} className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 ${tool === 'cinesina' ? 'bg-amber-500 text-black shadow-lg shadow-amber-500/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>⏺</span><span>{t('toolCinesina')}</span></button>
                  <button onClick={() => setTool('ladder')} className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 ${tool === 'ladder' ? 'bg-yellow-500 text-black shadow-lg shadow-yellow-500/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>🪜</span><span>{t('toolLadder')}</span></button>
                  <button onClick={() => setTool('arrow')} className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 ${tool === 'arrow' ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>↗️</span><span>{t('toolArrow')}</span></button>
                  <button onClick={() => setTool('delete')} className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 ${tool === 'delete' ? 'bg-rose-500 text-black shadow-lg shadow-rose-500/20' : 'bg-white/5 text-gray-300 hover:bg-white/10'}`}><span>🧹</span><span>{t('toolDelete')}</span></button>
                  <button onClick={() => { setElements([]); setArrows([]); }} className="px-3 py-2 rounded-xl text-xs font-bold bg-white/5 text-gray-400 hover:text-white hover:bg-white/10">🗑️ {t('toolClear')}</button>
                </div>

                {isDrawingArrow && (
                  <div className="text-center text-xs font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 py-2 rounded-xl">
                    Tocca il punto di arrivo della freccia sul campo
                  </div>
                )}

                <div 
                  id="tactical-pitch-area"
                  ref={svgRef}
                  onClick={handleBoardClick}
                  onMouseMove={handleTouchMove}
                  onMouseUp={() => setDraggedId(null)}
                  onTouchMove={handleTouchMove}
                  onTouchEnd={() => setDraggedId(null)}
                  className="relative w-full aspect-[4/3] max-w-4xl mx-auto pitch-bg rounded-3xl overflow-hidden border border-white/10 shadow-2xl cursor-crosshair"
                >
                  <div className="absolute inset-4 border-2 border-white/30 pointer-events-none"></div>
                  <div className="absolute top-1/2 left-4 right-4 h-0.5 bg-white/30 -translate-y-1/2 pointer-events-none"></div>
                  <div className="absolute top-1/2 left-1/2 w-24 h-24 border-2 border-white/30 rounded-full -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
                  <div className="absolute top-1/2 left-1/2 w-1.5 h-1.5 bg-white/60 rounded-full -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>

                  <svg className="absolute inset-0 w-full h-full pointer-events-none">
                    <defs>
                      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#facc15" />
                      </marker>
                    </defs>
                    {arrows.map(arr => (
                      <line 
                        key={arr.id} 
                        x1={`${arr.startX}%`} 
                        y1={`${arr.startY}%`} 
                        x2={`${arr.endX}%`} 
                        y2={`${arr.endY}%`} 
                        stroke="#facc15" 
                        strokeWidth="3" 
                        strokeDasharray="6,4"
                        markerEnd="url(#arrowhead)"
                      />
                    ))}
                  </svg>

                  {elements.map(el => {
                    let tokenContent = '';
                    let tokenStyle = "";

                    if (el.type === 'player') {
                      const baseColor = el.color === 'blue' ? 'from-blue-600 to-blue-800 border-blue-400' : 'from-rose-600 to-rose-800 border-rose-400';
                      tokenStyle = `w-9 h-9 rounded-full flex items-center justify-center font-black text-xs shadow-xl border-2 bg-gradient-to-br ${baseColor} text-white`;
                      tokenContent = el.number;
                    } else if (el.type === 'ball') {
                      tokenStyle = "w-7 h-7 rounded-full flex items-center justify-center text-sm shadow-2xl bg-gradient-to-br from-white via-gray-100 to-gray-300 border border-gray-800";
                      tokenContent = '⚽';
                    } else if (el.type === 'cone') {
                      tokenStyle = "w-8 h-7 flex flex-col items-center justify-center filter drop-shadow-[0_4px_4px_rgba(0,0,0,0.6)] relative";
                      tokenContent = (
                        <div className="relative flex flex-col items-center">
                          <div style={{
                            width: 0, 
                            height: 0, 
                            borderLeft: '10px solid transparent', 
                            borderRight: '10px solid transparent', 
                            borderBottom: '20px solid #ea580c'
                          }}></div>
                          <div className="w-5 h-1.5 bg-orange-900 rounded-full -mt-0.5 shadow-md"></div>
                        </div>
                      );
                    } else if (el.type === 'cinesina') {
                      tokenStyle = "w-7 h-4 rounded-full bg-gradient-to-t from-amber-600 via-amber-400 to-amber-300 border border-amber-200 shadow-xl flex items-center justify-center filter drop-shadow-[0_3px_3px_rgba(0,0,0,0.5)] relative";
                      tokenContent = <div className="w-3.5 h-1.5 rounded-full bg-white/40 absolute top-0.5"></div>;
                    } else if (el.type === 'ladder') {
                      tokenStyle = "w-12 h-6 bg-gradient-to-r from-yellow-500 via-yellow-400 to-yellow-500 border border-yellow-200 rounded-sm shadow-2xl flex flex-col justify-around p-0.5 filter drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)]";
                      tokenContent = (
                        <>
                          <div className="w-full h-1 bg-yellow-800/60 rounded-sm"></div>
                          <div className="w-full h-1 bg-yellow-800/60 rounded-sm"></div>
                          <div className="w-full h-1 bg-yellow-800/60 rounded-sm"></div>
                        </>
                      );
                    }

                    return (
                      <div
                        key={el.id}
                        onMouseDown={(e) => {
                          e.stopPropagation();
                          if (tool === 'delete') {
                            setElements(elements.filter(item => item.id !== el.id));
                          } else if (tool === 'move') {
                            setDraggedId(el.id);
                          }
                        }}
                        onTouchStart={(e) => {
                          e.stopPropagation();
                          if (tool === 'delete') {
                            setElements(elements.filter(item => item.id !== el.id));
                          } else if (tool === 'move') {
                            setDraggedId(el.id);
                          }
                        }}
                        style={{ left: `${el.x}%`, top: `${el.y}%`, transform: 'translate(-50%, -50%)' }}
                        className="absolute flex flex-col items-center cursor-pointer select-none z-10"
                      >
                        <div className={tokenStyle}>
                          {tokenContent}
                        </div>

                        {el.type === 'player' && (
                          editingPlayerId === el.id ? (
                            <input 
                              autoFocus
                              type="text"
                              value={tempPlayerName}
                              onChange={(e) => setTempPlayerName(e.target.value)}
                              onBlur={() => {
                                setElements(elements.map(item => item.id === el.id ? { ...item, name: tempPlayerName } : item));
                                setEditingPlayerId(null);
                              }}
                              onKeyDown={(e) => {
                                if (e.key === 'Enter') {
                                  setElements(elements.map(item => item.id === el.id ? { ...item, name: tempPlayerName } : item));
                                  setEditingPlayerId(null);
                                }
                              }}
                              className="mt-1 bg-black text-white text-[9px] px-1.5 py-0.5 rounded border border-emerald-500 text-center w-16 shadow-lg"
                            />
                          ) : (
                            <span 
                              onClick={(e) => { e.stopPropagation(); setEditingPlayerId(el.id); setTempPlayerName(el.name || ''); }}
                              className="mt-0.5 bg-black/90 text-white px-1.5 py-0.5 rounded text-[9px] font-bold whitespace-nowrap shadow-lg cursor-pointer border border-transparent hover:border-emerald-400"
                            >
                              {el.name || 'Nome'}
                            </span>
                          )
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'drills' && (
              <div className="glass-panel p-6 rounded-3xl shadow-xl space-y-6 max-w-2xl mx-auto">
                <h2 className="text-lg font-black text-white">{t('newDrill')}</h2>
                <form onSubmit={addDrill} className="space-y-3">
                  <input type="text" placeholder={t('drillTitlePlaceholder')} value={newDrillTitle} onChange={(e)=>setNewDrillTitle(e.target.value)} className="w-full bg-gray-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
                  <textarea placeholder={t('drillDescPlaceholder')} value={newDrillDesc} onChange={(e)=>setNewDrillDesc(e.target.value)} className="w-full bg-gray-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 h-24"></textarea>
                  <button type="submit" className="w-full bg-emerald-500 text-black font-extrabold py-3 rounded-xl text-xs">{t('saveDrill')}</button>
                </form>
                <div className="space-y-2">
                  {drills.length === 0 ? <p className="text-xs text-gray-400 text-center py-4">{t('noDrills')}</p> : drills.map(d => (
                    <div key={d.id} className="p-3 bg-white/5 border border-white/5 rounded-xl flex justify-between items-center text-xs">
                      <div>
                        <p className="font-bold">{d.title}</p>
                        {d.description && <p className="text-gray-400 text-[11px] mt-0.5">{d.description}</p>}
                      </div>
                      <button onClick={()=>removeDrill(d.id)} className="text-rose-400 font-bold">Elimina</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'squad' && (
              <div className="glass-panel p-6 rounded-3xl shadow-xl space-y-6 max-w-2xl mx-auto">
                <h2 className="text-lg font-black text-white">Rosa Giocatori</h2>
                <form onSubmit={addPlayer} className="flex gap-2">
                  <input type="text" placeholder="N." value={newPlayerNumber} onChange={(e)=>setNewPlayerNumber(e.target.value)} className="w-16 bg-gray-950/50 border border-white/10 rounded-xl px-3 py-3 text-sm text-white text-center" />
                  <input type="text" placeholder={t('playerPlaceholder')} value={newPlayerName} onChange={(e)=>setNewPlayerName(e.target.value)} className="flex-1 bg-gray-950/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
                  <button type="submit" className="bg-emerald-500 text-black px-5 font-extrabold rounded-xl text-xs">{t('addPlayer')}</button>
                </form>
                <div className="space-y-2">
                  {players.length === 0 ? <p className="text-xs text-gray-400 text-center py-4">{t('noPlayers')}</p> : players.map(p => (
                    <div key={p.id} className="p-3 bg-white/5 border border-white/5 rounded-xl flex justify-between items-center text-xs">
                      <span className="font-bold">#{p.number} - {p.name}</span>
                      <button onClick={()=>removePlayer(p.id)} className="text-rose-400 font-bold">Elimina</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CoachProApp />);
  </script>
</body>
</html>
